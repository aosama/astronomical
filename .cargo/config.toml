[build]
# Warnings are defects (see the engineering fundamentals rule): every Cargo
# compilation must fail on the first warning instead of letting it scroll
# past and rot. This applies to workspace crates; dependency crates are
# compiled with the same flag, so any dependency that starts warning breaks
# the build loudly and must be pinned, patched, or fixed — never silenced
# here.
rustflags = ["-D", "warnings"]

[alias]
# Each alias expands to one plain `cargo test` invocation; read the list to
# see the exact packages and test binaries it covers.
# test-hermetic: every package's hermetic_tests binary.
# test-rest-api: the REST contract and daemon rest_api_tests binaries.
# test-hermetic-and-rest: both lanes together; run this before committing.
test-hermetic = ["test", "--no-fail-fast", "-p", "astronomical-config", "-p", "astronomical-cli", "-p", "astronomical-ipc-protocol", "-p", "astronomical-native-build-tool", "-p", "astronomical-runtime-integration", "-p", "astronomical-model-serving", "-p", "astronomical-inference-worker", "-p", "astronomical-daemon", "--test", "hermetic_tests"]
test-rest-api = ["test", "--no-fail-fast", "-p", "astronomical-rest-contract", "-p", "astronomical-daemon", "--test", "rest_api_tests"]
test-hermetic-and-rest = ["test", "--no-fail-fast", "-p", "astronomical-config", "-p", "astronomical-cli", "-p", "astronomical-ipc-protocol", "-p", "astronomical-native-build-tool", "-p", "astronomical-runtime-integration", "-p", "astronomical-model-serving", "-p", "astronomical-inference-worker", "-p", "astronomical-daemon", "-p", "astronomical-rest-contract", "--test", "hermetic_tests", "--test", "rest_api_tests"]
