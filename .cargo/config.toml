[build]
# Warnings are defects (see the engineering fundamentals rule): every Cargo
# compilation must fail on the first warning instead of letting it scroll
# past and rot. `build.warnings` scopes the deny to workspace crates, unlike
# rustflags = ["-D", "warnings"] which would also hard-fail on any warning
# emitted by third-party dependencies.
warnings = "deny"

# Build parallelism is deliberately left at Cargo's default. `build.jobs`
# defaults to the logical CPU count, so any literal value here could only cap
# parallelism (and would hardwire a machine-specific core count); there is no
# config switch that raises it. The nightly parallel rustc front-end
# (rustflags = ["-Zthreads=0"]) was measured on a cold `cargo check
# --workspace --all-targets` and rejected: wall time was within noise
# (15.04s vs 14.88s) while user CPU rose 21%, because Cargo's cross-crate
# parallelism already saturates the cores. It roughly halves a single-crate
# `cargo check -p astronomical-model-serving` (1.8s -> 0.95s), but that ~1s
# per iteration does not justify the nightly-ICE risk surface, CI/local flag
# divergence, or splitting the sccache cache key (flags hash into it), which
# would make locally warmed entries unusable to the CI lane.

[alias]
# Each alias expands to one plain `cargo test` invocation; read the list to
# see the exact packages and test binaries it covers.
#
# Every alias is written as one string, never as a TOML array. Cargo merges
# config files from every ancestor directory and JOINS array values across
# them, while a string from the nearest file replaces the ancestors' value.
# A git worktree nested under the repository (for example under
# .claude/worktrees/) sees this file twice, once from the worktree and once
# from the main checkout; an array alias then doubles into
# `check --workspace --all-targets check --workspace --all-targets`, which
# breaks `cargo verify`, turns the duplicated `test` word of a test alias into
# a silent test-name filter, and fails the pre-push hook. The string form
# merges by replacement, so a nested worktree runs each alias exactly once.
#
# Lane vocabulary (issue #1208): "offline" names the property — sealed and
# deterministic, no real network beyond localhost, no real model artifacts,
# everything scripted. The offline lane runs each package's offline_tests
# binary AND its beside-source lib unit tests (--lib); the property-named
# aliases from before the vocabulary campaign were retired with the
# campaign's final batch.
# test-offline: every package's offline_tests binary plus lib unit tests.
# test-rest-api: the REST contract and daemon rest_api_tests binaries.
# test-e2e: the root whole-product journeys (tests/e2e) that spawn the real
# astronomicald binary; run `cargo build --bins -p astronomical-daemon`
# first. The harness's workspace_binary launches binaries from the test
# binary's own profile (debug for `cargo test`, release for `--release`,
# never the other) and names the matching `cargo build --bin` command if
# the build was skipped; ASTRONOMICAL_WORKSPACE_BINARY_PROFILE overrides it.
# test-app-builder: the macOS app-builder packaging journey as an offline
# integration test — a sandboxed repository copy runs the real
# scripts/internal/build-macos-app.sh with fixture-bin tool shims on PATH,
# and typed assertions read the produced bundle through plutil and the shim
# argv logs. macOS-only (the whole file is target_os = "macos" gated); it
# runs in CI inside the required macOS offline verification check, so drift
# fails the lane instead of rotting until release day.
# test-offline-and-rest: both offline-property lanes together; run this
# before committing.
test-offline = "test --no-fail-fast -p astronomical-config -p astronomical-cli -p astronomical-ipc-protocol -p astronomical-native-build-tool -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-daemon -p astronomical-quantization --lib --test offline_tests"
test-rest-api = "test --no-fail-fast -p astronomical-rest-contract -p astronomical-daemon --test rest_api_tests"
test-e2e = "test --no-fail-fast -p astronomical-e2e --test e2e"
test-app-builder = "test -p xtask --test offline_app_builder_journeys"
test-offline-and-rest = "test --no-fail-fast -p astronomical-config -p astronomical-cli -p astronomical-ipc-protocol -p astronomical-native-build-tool -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-daemon -p astronomical-quantization -p astronomical-rest-contract --lib --test offline_tests --test rest_api_tests"
# Quantization lanes (the OptiQ port in crates/quantization). The crate's
# unit tests and offline journeys (allocator parity against the Python
# reference, taxonomy, calibration, artifact round trips) ride in the
# offline aliases above. These two aliases cover what needs a Metal device.
# test-quantization-direct-mlx: the GPU encoder against the pure reference
# encoder and the shard-wise requantizer on a synthetic two-shard source;
# seconds, no model artifacts, serial because MLX tests never parallelize.
test-quantization-direct-mlx = "test --no-fail-fast -p astronomical-quantization --features direct-mlx --test direct_mlx -- --test-threads=1"
# test-quantization-acceptance: real-model journeys (static and exact
# conversions of an installed bf16 Qwen3.5 artifact, parity against an
# artifact the Python tool produced from the same source, requantizer
# throughput against the Python tool). Set
# ASTRONOMICAL_QUANTIZATION_SOURCE_MODEL_DIR and, for the parity journey,
# ASTRONOMICAL_QUANTIZATION_PYTHON_REFERENCE_DIR first; ignored by default.
test-quantization-acceptance = "test --no-fail-fast -p astronomical-acceptance --features direct-mlx --test quantization -- --ignored --nocapture --test-threads=1"
# xtask: repository tooling (CI reporting and verification glue as typed
# Rust). `cargo xtask tier-pyramid [--update-baseline]`, `cargo xtask
# source-size [--staged] [root]`, `cargo xtask notices [--check]`, `cargo
# xtask native-fingerprint [--source-only] [--explain] --profile
# core|core+memory-contract [root]`, `cargo xtask classify-scope`, `cargo
# xtask prune-caches [--dry-run] [--repo owner/name]`, `cargo xtask
# save-sccache <primary-cache-key>`, `cargo xtask install-verification-tools
# [--prefix DIR]`, `cargo xtask bootstrap-native-dependencies
# [--cache-dir ABSOLUTE_PATH] [--verify]`.
xtask = "run -p xtask --"
# verify: compile the whole workspace across ALL targets (libs, tests,
# examples, benches) without running anything. This is the pre-push gate —
# it catches type errors in any crate or test binary (the class of failure
# that only surfaces in CI when skipped) for one local compile instead of a
# paid GitHub Actions round trip. Run `cargo verify` before every push.
verify = "check --workspace --all-targets"
# Visibility audits (issue #1355): find public items that nothing calls.
# rustc's `dead_code` lint deliberately ignores `pub` items in library crates,
# because a dependent crate could still use them, so `cargo verify` and
# `cargo clippy` never report unused public library API. These two aliases are
# how we obtain that list today.
#
# audit-unused-public-bins: the nightly rustc lint `dead_code_pub_in_binary`,
# allow-by-default and scoped to EXECUTABLE crates. Run it with --bins on
# purpose. Adding --all-targets also compiles each library's unit tests as
# executable test harnesses, and every public library item then looks unused;
# that variant reported 1,091 diagnostics, almost all rest-contract and
# mlx-c-rust lib-test items that other workspace crates do use. `-A
# clippy::all` keeps unrelated Clippy style warnings from tripping
# `build.warnings = "deny"` and hiding the answer. Verified on this workspace:
# no findings in the binary targets.
audit-unused-public-bins = "clippy --workspace --bins -- -A clippy::all -D dead_code_pub_in_binary"
# audit-unused-public-workspace: the third-party `cargo-workspace-unused-pub`
# subcommand, which performs the cross-crate analysis the lint cannot. It
# needs `rustup component add rust-analyzer`, and it writes a ~51 MB
# `index.scip` into the repository root, which must never be committed.
#
# CAVEAT: a zero result here is NOT proof of cleanliness. The tool's final
# pass is a text search for each candidate name across the workspace, and this
# repository keeps nested Git worktrees under .claude/worktrees/, each a full
# checkout carrying the candidate names. Those matches mark every candidate as
# used, so the tool reports 0 while issue #1355 still lists 21 candidates that
# really have no caller. Move .claude/worktrees aside, or run the tool against
# a checkout without nested worktrees, before trusting the output, and confirm
# any candidate by hand before changing visibility.
#
# SECOND CAVEAT (audit tranche 2): the index output is a candidate generator,
# never a verdict. It over-reports (test-harness functions look uncalled) and
# under-reports (items whose only callers are tests or feature-gated code
# count as referenced, and zero-caller `pub(crate)` items reachable through
# the module chain from the crate root are invisible to rustc's dead-code
# pass). The verdict is always `git grep -wn "<name>" -- '*.rs'` across every
# tracked source file. `crates/mlx-c-rust` is exempt from dead-surface
# cleanup by policy: its bridge is complete rather than selective (see that
# crate's lib.rs documentation).
audit-unused-public-workspace = "workspace-unused-pub"
# Acceptance lanes (issue #1198 workstream 8): one alias per GPU lane, so the
# packages, features, targets, and the GPU serial rule (`--test-threads=1`)
# cannot be forgotten. Acceptance journeys are `#[ignore]`d: they need real
# model artifacts, an Apple-Silicon host, and run through `--ignored` here.
# A bare `cargo test -p astronomical-acceptance` without features runs
# nothing — the aliases are the interface.
# test-direct-mlx: the model-serving direct-MLX contract suite plus the
# runtime-integration MLX-C coverage bridge contract (CPU-only, seconds) so
# bridge drift fails the lane instead of shipping silently.
test-direct-mlx = "test --no-fail-fast -p astronomical-acceptance --features astronomical-acceptance/direct-mlx -p astronomical-runtime-integration --features astronomical-runtime-integration/mlx -p astronomical-model-serving --features astronomical-model-serving/direct-mlx --lib --test direct_mlx --test mlx_c_coverage_contract_tests -- --test-threads=1"
# test-mlx-memory: every native memory-contract phase (model-swap allocator,
# native probe, MLX-C transitions) in one bounded invocation; the probe
# binary must exist in the native build store (build it first with
# `cargo test -p astronomical-runtime-integration --features
# mlx-memory-contract-probe --no-run`).
test-mlx-memory = "test --no-fail-fast -p astronomical-acceptance --features direct-mlx,mlx-memory-contract-probe --test memory_contracts -- --ignored --test-threads=1"
# check-mlx-memory-contract: compile-only drift gate for the feature world
# above. The lane sits off every routine graph (and off `cargo verify`, which
# never enables the feature), so API moves under it are caught here in
# seconds instead of silently drifting. The probe-profile CMake build can be
# streamed live first with
# `scripts/ci/prewarm-native-build.sh --profile core+memory-contract`.
check-mlx-memory-contract = "check -p astronomical-runtime-integration --features mlx-memory-contract-probe --all-targets"
# test-acceptance: the whole real-model acceptance package (journeys and
# contracts across every feature gate), still `--test-threads=1`.
test-acceptance = "test --no-fail-fast -p astronomical-acceptance --features direct-mlx,serving-acceptance,expert-paging,performance-measurement,performance_throughput,mlx,mlx-memory-contract-probe --tests -- --ignored --test-threads=1"
# test-prism-hadamard-direct: real-pack text output and upstream greedy parity.
# Set PRISM_HADAMARD_QWEN35_PACK_DIR and PRISM_HADAMARD_QWEN35_PARITY_REFERENCE
# to the installed pack and its upstream trajectory reference before running.
test-prism-hadamard-direct = "test --no-fail-fast -p astronomical-acceptance --features direct-mlx --test prism_hadamard -- --ignored --nocapture --test-threads=1"
# test-prism-hadamard-performance: the folded-ternary performance tiers
# (GPU operation, decoder layer, forward pass, greedy generation) through an
# optimized build; set PRISM_HADAMARD_QWEN35_PACK_DIR first. The serving tier
# over worker IPC is test-prism-hadamard-serving-throughput.
test-prism-hadamard-performance = "test --release --no-fail-fast -p astronomical-acceptance --features direct-mlx --test prism_hadamard throughput -- --ignored --nocapture --test-threads=1"
test-prism-hadamard-serving-throughput = "test --release --no-fail-fast -p astronomical-acceptance --features performance_throughput --test performance_throughput folded_ternary -- --ignored --nocapture --test-threads=1"
# test-prism-hadamard-serving: real-worker chat, greedy/sampled output, and
# one-token budget coverage; set PRISM_HADAMARD_QWEN35_PACK_DIR first.
test-prism-hadamard-serving = "test --no-fail-fast -p astronomical-acceptance --features serving-acceptance --test chat_serving should_serve_greedy_and_sampled_chat_completions_from_the_folded_pack -- --ignored --nocapture --test-threads=1"
