[build]
# Warnings are defects: every Cargo compilation must fail on the first
# warning instead of letting it scroll past and rot. `build.warnings` scopes
# the deny to workspace crates, unlike rustflags = ["-D", "warnings"] which
# would also hard-fail on any warning emitted by third-party dependencies.
warnings = "deny"

# Build parallelism deliberately stays at Cargo's default: `build.jobs`
# defaults to the logical CPU count, so any literal value could only cap
# parallelism (and would hardwire a machine-specific core count). The
# nightly parallel rustc front-end was measured and rejected: wall time
# within noise, higher CPU, and an sccache cache-key split.

[alias]
# Every alias is written as one string, never as a TOML array. Cargo merges
# config files from every ancestor directory and JOINS array values across
# them, while a string from the nearest file replaces the ancestors' value;
# an array alias would double whenever an ancestor .cargo/config.toml
# defines the same alias, repeating it into a broken command.
#
# Lane vocabulary: "integration" is the scripted, deterministic test kind
# (no network, no real model artifacts). Acceptance lanes run real-model
# journeys — `#[ignore]`d, serial (`--test-threads=1`), Apple-Silicon only —
# and take an optional `--configuration PATH` for explicit inputs; the
# per-journey parameters and findings live with those tests, not here.

# Every package's integration_tests binary plus lib unit tests.
# The package list here, in nextest-archive-integration, -rest-api and -e2e must stay
# identical: cargo unifies features per command, so a different list recompiles what
# the CI build step just compiled (49 crates and about 36 seconds when they differed).
test-integration = "test --no-fail-fast -p astronomical-config -p astronomical-cli -p astronomical-ipc-protocol -p astronomical-memory-policy -p astronomical-jangtq2-qwen35 -p astronomical-native-build-orchestration -p astronomical-native-build-tool -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-daemon -p astronomical-quantization -p astronomical-vision-tower -p astronomical-neural-engine-research -p astronomical-rest-contract -p astronomical-e2e --lib --test integration_tests --test hardware_journeys"

# Most of that selection through cargo-nextest (one process per test, so process-global
# state cannot leak between tests), for local runs; it leaves out the REST contract,
# E2E and Neural Engine research packages. CI uses the archives below instead.
nextest-integration = "nextest run --no-fail-fast -p astronomical-config -p astronomical-cli -p astronomical-ipc-protocol -p astronomical-memory-policy -p astronomical-jangtq2-qwen35 -p astronomical-native-build-orchestration -p astronomical-native-build-tool -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-daemon -p astronomical-quantization -p astronomical-vision-tower --lib --test integration_tests"

# Portable nextest archives for the CI build/test split; each selection must
# stay identical to the selection the compile step builds through the cargo
# aliases above (the workflow lane contract pins that equality).
nextest-archive-integration = "nextest archive --profile ci --archive-file target/nextest-archives/integration.tar.zst -p astronomical-config -p astronomical-cli -p astronomical-ipc-protocol -p astronomical-memory-policy -p astronomical-jangtq2-qwen35 -p astronomical-native-build-orchestration -p astronomical-native-build-tool -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-daemon -p astronomical-quantization -p astronomical-vision-tower -p astronomical-neural-engine-research -p astronomical-rest-contract -p astronomical-e2e --lib --test integration_tests --test hardware_journeys"
nextest-archive-rest-api = "nextest archive --profile ci --archive-file target/nextest-archives/rest-api.tar.zst -p astronomical-config -p astronomical-cli -p astronomical-ipc-protocol -p astronomical-memory-policy -p astronomical-jangtq2-qwen35 -p astronomical-native-build-orchestration -p astronomical-native-build-tool -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-daemon -p astronomical-quantization -p astronomical-vision-tower -p astronomical-neural-engine-research -p astronomical-rest-contract -p astronomical-e2e --test rest_api_tests"
nextest-archive-e2e = "nextest archive --profile ci --archive-file target/nextest-archives/e2e.tar.zst -p astronomical-config -p astronomical-cli -p astronomical-ipc-protocol -p astronomical-memory-policy -p astronomical-jangtq2-qwen35 -p astronomical-native-build-orchestration -p astronomical-native-build-tool -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-daemon -p astronomical-quantization -p astronomical-vision-tower -p astronomical-neural-engine-research -p astronomical-rest-contract -p astronomical-e2e --test e2e"

# The shared fixture registry and leaf-id contracts (test-fixtures), plus the
# independent FLUX reference-oracle unit coverage (flux-reference-oracle), which
# pulls in base64/image/sha2 only for this lib build.
test-test-harness-fixtures = "test --no-fail-fast -p astronomical-test-harness --features test-fixtures,flux-reference-oracle --lib"

# The REST contract and daemon rest_api_tests binaries.
test-rest-api = "test --no-fail-fast -p astronomical-rest-contract -p astronomical-daemon --test rest_api_tests"

# The root whole-product journeys (verification/e2e) that spawn the real
# astronomicald binary; build the daemon first:
# cargo build --bins -p astronomical-daemon.
test-e2e = "test --no-fail-fast -p astronomical-e2e --test e2e"

# The macOS packaging contracts of `cargo xtask app package` (signing
# plans, Cargo arguments, bundle layout, plist checks for every channel);
# runs in the required macOS CI check.
test-app-builder = "test -p xtask --bin xtask app_package"

# Both lanes together; run this before committing.
test-integration-and-rest = "test --no-fail-fast -p astronomical-config -p astronomical-cli -p astronomical-ipc-protocol -p astronomical-memory-policy -p astronomical-jangtq2-qwen35 -p astronomical-native-build-orchestration -p astronomical-native-build-tool -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-daemon -p astronomical-quantization -p astronomical-vision-tower -p astronomical-neural-engine-research -p astronomical-rest-contract --lib --test integration_tests --test hardware_journeys --test rest_api_tests"

# Vision tower journeys against real public Hugging Face repositories: whether a
# repository has a tower, and whether a tower shares a text model's base. They
# read headers and a few small tensors, never whole weights, and need the network,
# so they are #[ignore]d and absent from the lanes above; seconds to run. The unit
# tests beside the source use small local fixtures and run in the lanes above.
# Try it by hand with `astronomical vision inspect organization/name`,
# `astronomical vision match TEXT_MODEL TOWER_MODEL`, and
# `astronomical vision add TEXT_FOLDER --tower TOWER_MODEL --output DIR`.
test-vision-tower-hub = "test -p astronomical-vision-tower --test integration_tests -- --ignored"

# Quantization lanes (the OptiQ port in crates/quantization).

# The GPU encoder against the pure reference encoder and the shard-wise
# requantizer on synthetic sources (two bf16 shards, packed, fused, stacked,
# FP8); seconds, no model artifacts. Contracts are #[parallel] except the
# peak-memory one, which is #[serial] because MLX peak memory is
# process-global.
test-quantization-direct-mlx = "test --no-fail-fast -p astronomical-quantization -p astronomical-vision-tower --features direct-mlx --test direct_mlx"

# Real-model conversion, parity, and throughput journeys; append
# --configuration PATH containing model_directory and, for parity,
# reference_artifact_path.
test-quantization-acceptance = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test quantization --ignored"

# Repository tooling as typed Rust; the subcommand catalog lives in the
# xtask sources. `cargo xtask app dev` rebuilds the Development app
# (incremental `app-dev` profile, cached icon and npm install, ad-hoc
# signing) and swaps it in for the running one; `cargo xtask app instance
# status|start|stop|restart` controls that instance headless, and `restart`
# reopens the menu app if it quit one; `cargo xtask
# app info-plist --channel development|stable|app-store` prints the plist a
# channel would get, for inspecting the channel profiles. `cargo xtask app
# package --channel stable|app-store [--signing-identity NAME]` builds a
# release bundle from a clean commit in the disposable app-release lane, and
# `cargo xtask app smoke-test --app-bundle PATH [--real-model MODEL_ID]`
# launches a built bundle in isolation.
# `cargo xtask release create-dmg --app-bundle PATH --output PATH` builds the
# drag-to-Applications image and `cargo xtask release validate-dmg --dmg PATH`
# proves a notarized image's install journey; `cargo xtask release
# validate-distribution-app` checks Developer ID signatures and `cargo xtask
# release notarize-dmg [--timeout-seconds N]` notarizes and staples an image;
# `cargo xtask release install-stable [--dry-run]` and `build-and-install-stable
# [--dry-run]` promote Stable to ~/Applications; `cargo xtask release
# app-store-pkg --app-bundle PATH --installer-identity NAME` wraps an App Store
# bundle in its signed installer package; `cargo xtask release prepare-and-publish`
# and its credential-resolving front door `cargo xtask release prepare-signed`
# prepare a signed release locally and, with --publish, publish the reviewed
# directory; `cargo xtask release accept-sparkle-update` proves a signed
# update installs and relaunches and a corrupted one is rejected (release-only
# steps).
# `cargo xtask prewarm-native-build --profile core` builds the pinned native
# MLX runtime into the machine-wide store before Cargo compiles anything.
# `cargo xtask native-fingerprint --profile core [--target TRIPLE] [--explain]`
# prints that build's identity; `--cache-environment` prints it with its store
# entry directory as `$GITHUB_ENV` lines for workflows that cache the entry.
# `cargo xtask check-test-channel-isolation` fails when a package test tree
# reaches for Stable state, and `cargo xtask menu-contracts` runs the menu
# app's Swift contract tests with the Git credential helper cleared.
# `cargo xtask vendor-thin-talk-assets [--verify-only]` vendors and verifies the
# Thin Talk canvas's pinned offline web assets.
# `cargo xtask provision-bindgen-headers [--verify-headers]` extracts the
# pinned, patched MLX and MLX-C headers for bindgen (prewarm runs it first). `cargo xtask audit-test-declarations` walks every crate's
# tests/ tree and fails when a test file is unreachable from any target
# through `mod` declarations (the class of silent-orphan bug that once hid
# seven tests in an undeclared file). `cargo xtask test-run` builds exact
# Cargo executables and
# runs each selected test in its own process, with a 120-second budget
# (--case-budget-seconds replaces it for inherently long measurements),
# five-second progress, and retained manifests/logs under target/test-runs;
# serving measurements must use this runner.
#
# Function-length and complexity enforcement (issue #1637) is pre-commit
# territory ONLY (policy, 2026-10-31): the hook's clippy pass denies
# clippy::too_many_lines (the 100-line budget, #[expect]-tracked debt) and
# `cargo crap --workspace --baseline crap-baseline.json --fail-regression`
# ratchets complexity against the committed baseline as a hard failure.
# GitHub Actions runs no code-shape enforcement at all.
#
# `cargo xtask commit-identity --staged` (pre-commit) and
# `cargo xtask commit-identity --pre-push` (pre-push, reads git's ref lines on
# stdin) refuse author, committer, and Co-authored-by emails that are not safe
# to publish: only the numeric `<id>+<login>@users.noreply.github.com` form,
# GitHub-owned addresses, `noreply@` service addresses, and reserved fixture
# domains pass. A login-only no-reply address is refused because GitHub
# credits it to whichever stranger owns that login.
xtask = "run -p xtask --"

# Compile the whole workspace across ALL targets without running anything;
# the pre-push gate. Run `cargo verify` before every push.
verify = "check --workspace --all-targets"

# Visibility audits (issue #1355). Output is a candidate list, never a
# verdict: confirm any candidate by hand (`git grep -wn "<name>" -- '*.rs'`)
# before changing visibility, and run them from a checkout with no nested
# copy of these sources, or the audit reports zero from self-matches.
audit-unused-public-bins = "clippy --workspace --bins -- -A clippy::all -D dead_code_pub_in_binary"
audit-unused-public-workspace = "workspace-unused-pub"

# Acceptance lanes: one alias per GPU lane, so the packages, features,
# targets, and the serial rule cannot be forgotten.

# The model-serving direct-MLX contract suite plus the runtime-integration
# MLX-C coverage bridge contract (CPU-only) so bridge drift fails the lane.
test-direct-mlx = "test --no-fail-fast -p astronomical-acceptance --features astronomical-acceptance/direct-mlx -p astronomical-runtime-integration --features astronomical-runtime-integration/mlx -p astronomical-model-serving --features astronomical-model-serving/direct-mlx --lib --test direct_mlx --test mlx_c_coverage_contract_tests -- --test-threads=1"

# Every native memory-contract phase in one bounded invocation; the probe
# binary must exist first (see check-mlx-memory-contract).
test-mlx-memory = "test --no-fail-fast -p astronomical-acceptance --features direct-mlx,mlx-memory-contract-probe --test memory_contracts -- --ignored --test-threads=1"

# Compile-only drift gate for the mlx-memory-contract-probe feature world,
# which sits off every routine graph; API moves under it are caught here in
# seconds instead of silently drifting.
check-mlx-memory-contract = "check -p astronomical-runtime-integration --features mlx-memory-contract-probe --all-targets"

# The whole real-model acceptance package, one selected case per process;
# append --configuration PATH for explicit model/evidence inputs and
# --filter NAME to narrow the journeys. Performance measurements are left out
# on purpose (no performance-measurement feature): they compare strategies on
# demand and only record numbers, so they belong in `cargo measure-paged-prefill`,
# not in every regression pass.
test-acceptance = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx,serving-acceptance,expert-paging,performance_throughput,mlx,mlx-memory-contract-probe --tests --release --ignored"

# On-demand paged-prefill performance measurements (prefill chunk size and
# back-to-back residency churn on the large sparse model; issues #1716 and
# #1717). Each case loads the real model, so run them only when comparing
# strategies; append --filter NAME to pick cases.
measure-paged-prefill = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx,expert-paging,performance-measurement --test performance_measurement --release --ignored --filter paged_prefill"

# Routed-expert page reads from the SSD (not the file cache) through MLX: the
# production stock-safetensors page load, the same page read again warm, and
# three expert-major Atlas read shapes, with the Atlas bytes checked equal to
# the stock bytes. It converts the 16 least-cached expert layers of the
# installed large sparse MoE model into a temporary Atlas (about 13 GB of
# scratch space, checked before writing), skips any page `mincore` finds in
# the file cache, and fails within its 120-second budget when too few
# uncached pages remain. Append --configuration PATH whose `model_directory`
# names the model when the Development configuration does not discover it;
# the streaming-latency probes in the same file honour that override too.
measure-cold-expert-page-reads = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test direct_mlx --release --ignored --filter should_time_cold_routed_pages_through_mlx_for_stock_and_atlas_layouts"

# One cell of the SSD-paging graph-submission interval comparison on the
# 4-bit sparse model: append --configuration PATH whose `paging_experiment`
# object sets the ceiling, the streaming chunk and the prefill and generation
# intervals (the measurement file's header shows the shape). Run it once per
# interval pair; each run prints one `[graph-submission-interval]` line.
measure-paging-submission-intervals = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx,expert-paging,performance-measurement --test performance_measurement --release --ignored --filter should_measure_serving_rates_for_the_configured_graph_submission_intervals"

# FLUX.2 Klein REST journeys on real models, for both the BF16 build and the
# 4-bit MLX build (mlx-community/flux2-klein-4b-4bit): generation and exact
# repetition, cancellation and reuse, initial noise, and the chat swap. Each
# journey finds its build through the Development configuration's model
# directories and fails at discovery when that build is not installed; append
# --configuration PATH with reference_artifact_path to compare the BF16 image
# with the independent reference.
test-flux2-klein-rest = "run -p xtask -- test-run --package astronomical-acceptance --features serving-acceptance --test chat_serving --filter flux2_klein_rest --ignored"
# Prism-Hadamard lanes: real-pack contracts and upstream greedy parity,
# performance tiers, serving throughput, and real-worker chat; append
# --configuration PATH containing model_directory and, for parity,
# reference_artifact_path.
test-prism-hadamard-direct = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test prism_hadamard --ignored"
test-prism-hadamard-performance = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test prism_hadamard --release --filter throughput --ignored"
test-prism-hadamard-serving-throughput = "run -p xtask -- test-run --package astronomical-acceptance --features performance_throughput --test performance_throughput --release --filter folded_ternary --ignored"
test-prism-hadamard-serving = "run -p xtask -- test-run --package astronomical-acceptance --features serving-acceptance --test chat_serving --filter should_serve_greedy_and_sampled_chat_completions_from_the_folded_pack --ignored"

# `astronomical launch claude` end to end (issue #891): a real daemon on the
# configured small dense model, the launch verb's preparation, and a headless
# Claude Code turn. Needs Claude Code on PATH; prints per-stage [timing].
test-claude-code-launch = "run -p xtask -- test-run --package astronomical-acceptance --features serving-acceptance --test chat_serving --release --ignored --filter should_complete_a_claude_code_turn_on_the_local_model_through_the_launch_verb"

# JANGH2 lanes: plan contracts against real bundles, GPU decode-throughput
# (memory-traffic bound, so the optimized build is part of the alias; serial
# by rule), correctness contracts, and serving throughput over the daemon
# IPC boundary persisted to the durable throughput history; append
# --configuration PATH containing model_directory.
test-jangtq2-plan = "run -p xtask -- test-run --package astronomical-model-serving --features direct-mlx --lib --filter quantized_expert_layer_plan --ignored"
test-jangtq2-decode-throughput = "test --release --no-fail-fast -p astronomical-jangtq2-qwen35 --features direct-mlx --test direct_mlx throughput -- --ignored --nocapture --test-threads=1"
test-jangtq2-direct-mlx = "test --no-fail-fast -p astronomical-jangtq2-qwen35 --features direct-mlx --lib --test direct_mlx -- --test-threads=1"
test-jangtq2-serving-throughput = "run -p xtask -- test-run --package astronomical-acceptance --features performance_throughput --test performance_throughput --release --filter jangtq2 --ignored"

# Neural Engine hardware journeys (issue #161), verification/neural-engine: real
# hardware, optimized build, about twenty minutes in all. Narrow with --filter
# NAME. The ternary journeys need --configuration PATH whose `model_directory`
# names the Ternary-Bonsai-2-27B checkpoint, and the runner stops at the first
# failing journey, so a run without --filter needs that configuration too. The
# 900-second budget exists for the 64-layer load. The catalogue of journeys and
# their filters is the header of tests/hardware_journeys.rs.
test-neural-engine-journeys = "run -p xtask -- test-run --package astronomical-neural-engine-research --test hardware_journeys --release --ignored --case-budget-seconds 900"

# The opt-in Neural Engine prefill on a real dense artifact: the same loaded
# model alternating with and without its per-layer programs for three rounds,
# comparing prefill and decode speed, final logits, and greedy tokens over the
# Shakespeare fixture. Holds about 20 GiB and takes about six minutes; run it with
# no model loaded in either instance. Two more journeys share this form:
# `should_serve_real_dense_prefill_from_kept_programs` measures the production
# program cache, prefill only (run it twice: the first fills the cache, about three
# minutes, and the second takes about one), and
# `should_compare_real_answers_across_neural_engine_arms` checks exact answers per
# engine setup (about eight minutes).
#
# `should_measure_peak_program_memory_of_the_smallest_model`, and its `two_billion`
# and `nine_billion` siblings in `neural_engine_program_memory.rs`, check that what
# programs measure at load matches what they really hold, on three model sizes. About
# four to six minutes each, under the same filter form with `--ignored --nocapture`.
# `should_sweep_the_token_share_of_the_smallest_model`, and its `two_billion` and
# `nine_billion` siblings, compare shares of a chunk, about ten minutes each.
# `should_compare_real_chunks_on_the_smallest_model`, and the same two siblings, time
# neighbouring chunks of real prompts on each engine, two to six minutes each.
test-neural-engine-real-model = "test --release --no-fail-fast -p astronomical-acceptance --features direct-mlx --test installed_model_contracts should_compare_real_dense_prefill_with_and_without_the_neural_engine -- --ignored --nocapture --test-threads=1"

# The Neural Engine CI lane (job `neural-engine`): the production crate's unit
# tests, in seconds and with no native MLX build. The research crate is in the
# integration lane instead, because its journeys link MLX: CI compiles them and
# runs only what is not #[ignore]d.
test-neural-engine = "test --no-fail-fast -p astronomical-neural-engine --all-targets"

# Engine-versus-memory-ceiling isolation on the resident 35B sparse-MoE
# model; narrow with --filter, add --configuration PATH with
# {"diagnostics": true} for performance attribution.
test-engine-versus-memory-ceiling = "run -p xtask -- test-run --package astronomical-acceptance --features performance_throughput --test performance_throughput --release --filter engine_versus_memory_ceiling --ignored"

# Paged-versus-resident parity (issue #1679): the 35B sparse-MoE answers a long
# greedy and a short seeded question resident and paged, and both engines must
# give identical tokens. Each journey spawns its resident recording test in a
# child process (MLX fixes its memory limit once per process) and reads the
# answers from its standard output. The kernel-level guard for the same defect
# runs without a model in `test-direct-mlx` (sparse_expert_projection_page_independence).
test-paged-resident-parity = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --filter should_give_the_resident_answer --ignored"
