# A streamed reply whose layers look their routes up inside each token's graph
# (the qwen35 family's in_graph_table_serving, on by default for a model that
# streams experts) against the same reply with every route copied to the
# host. `test-in-graph-route-lookup` is the proof: one loaded model writes one
# greedy reply three times (with lookups made to refuse some tokens, with
# lookups as served, and with every route on the host), the tokens must be
# the same each time, and the lookups must have served layers and read
# experts from storage. About fifty seconds.
# `measure-in-graph-route-lookup` is the measurement, one process a case: a
# 500/50 warmup, then a 10,000-token Romeo and Juliet summary and 500 reply
# tokens through the engine's reply loop, at temperature 1.0 and at 0.7;
# compare the `[performance-attribution] status=success phase=routes_in_graph`
# and `phase=routes_on_host` lines. `attribute-in-graph-route-lookup` serves
# the same reply with attribution on, for the shares of its time. Pass
# --configuration PATH as for `measure-expert-misses`. About seventy seconds
# a case.
# `test-in-graph-drafted-blocks` is the same proof for a model with a
# multi-token-prediction head: the two in-graph replies draft three tokens a
# round, so each verified block of four rows has its routes looked up in the
# graph. The two drafted replies must be the same tokens; against the plain
# reply they are held to rounding, because a several-row kernel rounds
# differently from a one-row one, and the journey reports how far they agree.
# A streamed model packaged with a DFlash drafter, writing replies in draft
# tree rounds (issue #2330). `test-hosted-drafter-reply` writes one greedy
# reply with the drafter silent and with it proposing, checks that rounds
# ran and reports how many tokens the two agree on. A dense model's two
# replies must be equal (issue #2599); a mixture-of-experts model's part
# where two tokens are nearly tied, because its several-row expert pass
# rounds differently.
# `measure-hosted-drafter-reply` measures both, one process a case, with the
# drafter loaded in each: an essay at temperature 1.0 and 0.7 and real Python
# source continued at 0.7. Each case serves its prompt once unmeasured first,
# so the model has timed its plain tokens and rounds and the measured reply
# is decided as every reply after a first one is (`draft_round_payoff`).
# Compare the `phase=hosted_drafter_silent` and
# `phase=hosted_drafter_proposing` lines. Pass --configuration PATH as for
# `measure-expert-misses`. About thirty seconds a case on a mixture-of-experts
# model, and up to six minutes on a dense model that streams its layers.
test-hosted-drafter-reply = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --filter drafted_greedy_reply_as_the_plain_reply_begins"
# The streaming reply-speed journeys' replies asked of the resident engine
# under the same paging_experiment limit (#2585): essay, code temperature and
# code writing, each after a warm-up and one unmeasured reply. Alternate with
# measure-hosted-drafter-reply's silent cases on a model with no drafter.
measure-resident-reply-speed = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 500 --filter reply_speed_on_the_resident_engine"
# How fast each engine reads one 10,000-token prompt under the same
# paging_experiment limit (#2585): the resident case, then the streaming one,
# a process each, 16 tokens written after the prompt. Run it twice and
# compare within a sitting. request_elapsed_seconds less
# generation_elapsed_seconds in each `phase=long_prompt_read_by_` line is the
# time to the first token. Under a minute a case.
measure-long-prompt-reading = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 170 --filter long_prompt_reading_on_the_"
# A conversation's next turn on each engine under the same paging_experiment
# limit (#2585): a 10,000-token prompt, its reply, then that prompt with the
# reply and a 40-token message, with an astro_ssd_prompt_cache store as
# serving has. The resident case, then the streaming one, a process each.
# request_elapsed_seconds less generation_elapsed_seconds in each
# `phase=..._follow_up_turn` line is the time to the first token.
measure-chat-follow-up-turn = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 170 --filter a_chat_follow_up_turn_on_the_"
# Neural Engine prompt reading on the streaming engine (#2585): a dense model
# with every layer kept in memory builds its programs, attaches them, and
# reads a 10,000-token prompt; then the same prompt on the GPU alone, a
# process each. The limit must hold the model and its programs. Building
# takes about five minutes when macOS holds no prepared copy; progress and
# time left print every five seconds.
measure-neural-engine-streaming-prompt-reading = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 560 --filter a_long_prompt_on_the_streaming_engine_with_"
measure-hosted-drafter-reply = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 500 --filter reply_speed_with_the_hosted_drafter"
test-in-graph-drafted-blocks = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --filter drafted_blocks_are_looked_up_in_the_graph"
test-in-graph-route-lookup = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --filter whichever_way_routes_are_looked_up"
measure-in-graph-route-lookup = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 150 --filter reply_speed_with_routes_"
attribute-in-graph-route-lookup = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 150 --filter reply_time_with_routes_"

# The replay lab's report: every reply `measure-expert-misses` recorded under
# EVIDENCE_DIRECTORY is served again, without a GPU, under each keeping rule
# (least recently and least frequently used, decayed frequency, frequency
# admission, and Belady's MIN, the bound no rule can beat), with the
# astro_expert_cache capacity shared across layers and divided by layer as the
# engine held it when the reply began. Prints misses per reply token per rule
# and progress with an ETA; runs in seconds. Each line also gives the misses a
# token over the reply's first 48 tokens and after them: the opening is set by
# what is held when the reply begins, which no keeping rule changes.
replay-expert-misses = "run -p xtask --release -- replay-expert-misses"

# Cold SSD-streaming prefill as production serves it: the in-process engine
# with request attribution off (attribution synchronizes after every prefill
# stage and changes how reads overlap), a 500/50 warmup, then a 10,240-token
# Shakespeare prefill with the model's files kept out of the macOS file cache.
# It asks for 2 output tokens rather than the usual 500 on purpose: the
# measured time must be prefill alone, and decode has its own probe above.
# Prints request seconds and prompt tokens per second per request. Pass
# --configuration PATH whose `model_directory` and `paging_experiment` (MLX
# limit and SSD-streaming chunk) set the case.
measure-unattributed-cold-prefill = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --filter should_measure_cold_prefill_without_attribution"

# One cell of the SSD-paging graph-submission interval comparison on the
# 4-bit sparse model: append --configuration PATH whose `paging_experiment`
# object sets the ceiling, the streaming chunk and the generation interval
# (the measurement file's header shows the shape). Run it once per interval;
# each run prints one `[graph-submission-interval]` line.
measure-paging-submission-intervals = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx,expert-paging,performance-measurement --test performance_measurement --release --ignored --filter should_measure_serving_rates_for_the_configured_graph_submission_intervals"

# FLUX.2 Klein REST journeys on real models, for both the BF16 build and the
# 4-bit MLX build (mlx-community/flux2-klein-4b-4bit): generation and exact
# repetition, cancellation and reuse, initial noise, and the chat swap. Each
# journey finds its build through the Development configuration's model
# directories and fails at discovery when that build is not installed; append
# --configuration PATH with reference_artifact_path to compare the BF16 image
# with the independent reference.
test-flux2-klein-rest = "run -p xtask -- test-run --package astronomical-acceptance --features serving-acceptance --test chat_serving --filter flux2_klein_rest --ignored"
# Prism-Hadamard lanes: real-pack contracts and upstream greedy parity,
# performance tiers, serving throughput, and real-worker chat; append
# --configuration PATH containing model_directory and, for parity,
# reference_artifact_path.
test-prism-hadamard-direct = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test prism_hadamard --ignored"
test-prism-hadamard-performance = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test prism_hadamard --release --filter throughput --ignored"
test-prism-hadamard-serving-throughput = "run -p xtask -- test-run --package astronomical-acceptance --features performance_throughput --test performance_throughput --release --filter folded_ternary --ignored"
test-prism-hadamard-serving = "run -p xtask -- test-run --package astronomical-acceptance --features serving-acceptance --test chat_serving --filter should_serve_greedy_and_sampled_chat_completions_from_the_folded_pack --ignored"

# Prefill memory recovery on the largest sparse model (issues #1729, #2217):
# two real-model REST journeys. One sends a prompt whose first full chunk runs
# out of memory at a 37 GiB ceiling and requires both requests to be served.
# The other sends a short request and then a long one at 32 GiB with everyday
# settings and requires memory in use to be back above half the ceiling while
# the long prompt is still being read. Needs the GPU free and the model that
# registry/e2e_test_model_names.json names as largest_sparse_moe_streaming in
# a folder the Development configuration lists.
test-prefill-memory-recovery = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx,serving-acceptance,expert-paging --test expert_paging --release --ignored --filter prefill_memory_recovery_rest_journey"

# `astronomical launch claude` end to end (issue #891): a real daemon on the
# configured small dense model, the launch verb's preparation, and a headless
# Claude Code turn. Needs Claude Code on PATH; prints per-stage [timing].
test-claude-code-launch = "run -p xtask -- test-run --package astronomical-acceptance --features serving-acceptance --test chat_serving --release --ignored --filter should_complete_a_claude_code_turn_on_the_local_model_through_the_launch_verb"

# JANGH2 lanes: plan contracts against real bundles, GPU decode-throughput
# (memory-traffic bound, so the optimized build is part of the alias; serial
# by rule), correctness contracts, and serving throughput over the daemon
# IPC boundary; append --configuration PATH containing model_directory.
test-jangtq2-plan = "run -p xtask -- test-run --package qwen35 --features direct-mlx --lib --filter quantized_expert_layer_plan --ignored"
test-jangtq2-decode-throughput = "test --release --no-fail-fast -p jangtq2-qwen35 --features direct-mlx --test direct_mlx throughput -- --ignored --nocapture --test-threads=1"
test-jangtq2-direct-mlx = "test --no-fail-fast -p jangtq2-qwen35 --features direct-mlx --lib --test direct_mlx -- --test-threads=1"
test-jangtq2-serving-throughput = "run -p xtask -- test-run --package astronomical-acceptance --features performance_throughput --test performance_throughput --release --filter jangtq2 --ignored"

# Neural Engine hardware journeys (issue #161), verification/neural-engine: real
# hardware, optimized build, about twenty minutes in all. Narrow with --filter
# NAME. The ternary journeys need --configuration PATH whose `model_directory`
# names the Ternary-Bonsai-2-27B checkpoint, and the runner stops at the first
# failing journey, so a run without --filter needs that configuration too. The
# 900-second budget exists for the 64-layer load. The catalogue of journeys and
# their filters is the header of tests/hardware_journeys.rs.
test-neural-engine-journeys = "run -p xtask -- test-run --package astronomical-neural-engine-research --test hardware_journeys --release --ignored --case-budget-seconds 900"

# The opt-in Neural Engine prefill on a real dense artifact: the same loaded
# model alternating with and without its per-layer programs for three rounds,
# comparing prefill and decode speed, final logits, and greedy tokens over the
# Shakespeare fixture. Holds about 20 GiB and takes about six minutes; run it with
# no model loaded in either instance. Two more journeys share this form:
# `should_serve_real_dense_prefill_from_kept_programs` measures the production
# astro Neural Engine program cache, prefill only (run it twice: the first fills that cache, about three
# minutes, and the second takes about one), and
# `should_compare_real_answers_across_neural_engine_arms` checks exact answers per
# engine setup (about eight minutes).
#
# `should_measure_peak_program_memory_of_the_smallest_model`, and its `two_billion`
# and `nine_billion` siblings in `neural_engine_program_memory.rs`, check that what
# programs measure at load matches what they really hold, on three model sizes. About
# four to six minutes each, under the same filter form with `--ignored --nocapture`.
# `should_sweep_the_token_share_of_the_smallest_model`, and its `two_billion` and
# `nine_billion` siblings, compare shares of a chunk, about ten minutes each.
# `should_compare_real_chunks_on_the_smallest_model`, and the same two siblings, time
# neighbouring chunks of real prompts on each engine, two to six minutes each.
test-neural-engine-real-model = "test --release --no-fail-fast -p astronomical-acceptance --features direct-mlx --test installed_model_contracts should_compare_real_dense_prefill_with_and_without_the_neural_engine -- --ignored --nocapture --test-threads=1"

# The Neural Engine CI lane (job `neural-engine`): the production crate's unit
# tests, in seconds and with no native MLX build. The research crate is in the
# integration lane instead, because its journeys link MLX: CI compiles them and
# runs only what is not #[ignore]d.
test-neural-engine = "test --no-fail-fast -p neural-engine --all-targets"

# Engine-versus-memory-ceiling isolation on the resident 35B sparse-MoE
# model; narrow with --filter, add --configuration PATH with
# {"diagnostics": true} for performance attribution.
test-engine-versus-memory-ceiling = "run -p xtask -- test-run --package astronomical-acceptance --features performance_throughput --test performance_throughput --release --filter engine_versus_memory_ceiling --ignored"

# Fused MoE expert combination A/B on the resident Ornith-1.5-35B-A3B 4-bit
# model (Development model list): the two-step sorted weighted sum plus
# compiled shared-expert graph against the one-pass fused kernel, on one
# loaded model. Checks both arms' logits are equal, then prints min, median
# and max prefill seconds per arm for 2,048, 3,072 and 4,096-token chunks and
# the whole ~10,000-token Shakespeare prompt. About two minutes; stop the
# Development daemon first so both do not hold the model's memory.
measure-fused-expert-combination-prefill = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 600 --filter should_report_fused_expert_combination_prefill_ab_across_chunk_sizes"

# Streaming scoreboard (issue #2221): the rows the streaming memory redesign is
# judged by, one model under one limit per row, taken at the product's default
# prompt chunk with attribution off. Runs all four cells in turn, each with
# its own worker process. For one cell, run the same xtask command with that
# cell's test name as the filter, for example
# should_record_the_small_sparse_model_scoreboard_row_at_an_11_gib_limit.
# Rows print as [streaming-scoreboard] lines and append to
# target/acceptance-evidence/streaming-scoreboard/streaming-scoreboard.jsonl.
measure-streaming-scoreboard = "run -p xtask -- test-run --package astronomical-acceptance --features performance_throughput --test performance_throughput --release --ignored --case-budget-seconds 1320 --filter streaming_scoreboard"

# Paged-versus-resident parity (issue #1679): the 35B sparse-MoE answers a long
# greedy question, a short seeded one and a three-span greedy one resident and
# paged, and both engines must give identical tokens. The three-span question's
# first paged ask has one prompt span fail on purpose (issue #2221): it must be
# run again exactly once and leave at least 80% of the kept experts. Each journey spawns its resident recording test in a
# child process (MLX fixes its memory limit once per process) and reads the
# answers from its standard output. The kernel-level guard for the same defect
# runs without a model in `test-direct-mlx` (sparse_expert_projection_page_independence).
test-paged-resident-parity = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --filter should_give_the_resident_answer --ignored"
