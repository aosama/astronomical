[build]
# Warnings are defects: every Cargo compilation must fail on the first
# warning instead of letting it scroll past and rot. `build.warnings` scopes
# the deny to workspace crates, unlike rustflags = ["-D", "warnings"] which
# would also hard-fail on any warning emitted by third-party dependencies.
warnings = "deny"

# Build parallelism deliberately stays at Cargo's default: `build.jobs`
# defaults to the logical CPU count, so any literal value could only cap
# parallelism (and would hardwire a machine-specific core count). The
# nightly parallel rustc front-end was measured and rejected: wall time
# within noise, higher CPU, and an sccache cache-key split.

[alias]
# Every alias is written as one string, never as a TOML array. Cargo merges
# config files from every ancestor directory and JOINS array values across
# them, while a string from the nearest file replaces the ancestors' value;
# an array alias would double whenever an ancestor .cargo/config.toml
# defines the same alias, repeating it into a broken command.
#
# Lane vocabulary: "integration" is the scripted, deterministic test kind
# (no network, no real model artifacts). Acceptance lanes run real-model
# journeys — `#[ignore]`d, serial (`--test-threads=1`), Apple-Silicon only —
# and take an optional `--configuration PATH` for explicit inputs; the
# per-journey parameters and findings live with those tests, not here.

# Every package's integration_tests binary plus lib unit tests.
# The package list here, in nextest-archive-integration, -rest-api and -e2e must stay
# identical: cargo unifies features per command, so a different list recompiles what
# the CI build step just compiled (49 crates and about 36 seconds when they differed).
test-integration = "test --no-fail-fast -p astronomical-config -p astronomical-cli -p astronomical-ipc-protocol -p astronomical-lowercase-hex -p astronomical-decision-contract -p astronomical-expert-atlas -p astronomical-native-identity -p astronomical-memory-policy -p astronomical-jangtq2-qwen35 -p astronomical-native-build-orchestration -p astronomical-native-build-tool -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-daemon -p astronomical-quantization -p astronomical-vision-tower -p astronomical-neural-engine-research -p astronomical-rest-contract -p astronomical-e2e --lib --test integration_tests --test hardware_journeys"

# Most of that selection through cargo-nextest (one process per test, so process-global
# state cannot leak between tests), for local runs; it leaves out the REST contract,
# E2E and Neural Engine research packages. CI uses the archives below instead.
nextest-integration = "nextest run --no-fail-fast -p astronomical-config -p astronomical-cli -p astronomical-ipc-protocol -p astronomical-lowercase-hex -p astronomical-decision-contract -p astronomical-expert-atlas -p astronomical-native-identity -p astronomical-memory-policy -p astronomical-jangtq2-qwen35 -p astronomical-native-build-orchestration -p astronomical-native-build-tool -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-daemon -p astronomical-quantization -p astronomical-vision-tower --lib --test integration_tests"

# Portable nextest archives for the CI build/test split; each selection must
# stay identical to the selection the compile step builds through the cargo
# aliases above (the workflow lane contract pins that equality).
nextest-archive-integration = "nextest archive --profile ci --archive-file target/nextest-archives/integration.tar.zst -p astronomical-config -p astronomical-cli -p astronomical-ipc-protocol -p astronomical-lowercase-hex -p astronomical-decision-contract -p astronomical-expert-atlas -p astronomical-native-identity -p astronomical-memory-policy -p astronomical-jangtq2-qwen35 -p astronomical-native-build-orchestration -p astronomical-native-build-tool -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-daemon -p astronomical-quantization -p astronomical-vision-tower -p astronomical-neural-engine-research -p astronomical-rest-contract -p astronomical-e2e --lib --test integration_tests --test hardware_journeys"
nextest-archive-rest-api = "nextest archive --profile ci --archive-file target/nextest-archives/rest-api.tar.zst -p astronomical-config -p astronomical-cli -p astronomical-ipc-protocol -p astronomical-lowercase-hex -p astronomical-decision-contract -p astronomical-expert-atlas -p astronomical-native-identity -p astronomical-memory-policy -p astronomical-jangtq2-qwen35 -p astronomical-native-build-orchestration -p astronomical-native-build-tool -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-daemon -p astronomical-quantization -p astronomical-vision-tower -p astronomical-neural-engine-research -p astronomical-rest-contract -p astronomical-e2e --test rest_api_tests"
nextest-archive-e2e = "nextest archive --profile ci --archive-file target/nextest-archives/e2e.tar.zst -p astronomical-config -p astronomical-cli -p astronomical-ipc-protocol -p astronomical-lowercase-hex -p astronomical-decision-contract -p astronomical-expert-atlas -p astronomical-native-identity -p astronomical-memory-policy -p astronomical-jangtq2-qwen35 -p astronomical-native-build-orchestration -p astronomical-native-build-tool -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-daemon -p astronomical-quantization -p astronomical-vision-tower -p astronomical-neural-engine-research -p astronomical-rest-contract -p astronomical-e2e --test e2e"

# The shared fixture registry and leaf-id contracts (test-fixtures), plus the
# independent FLUX reference-oracle unit coverage (flux-reference-oracle), which
# pulls in base64/image/sha2 only for this lib build.
test-test-harness-fixtures = "test --no-fail-fast -p astronomical-test-harness --features test-fixtures,flux-reference-oracle --lib"

# The REST contract and daemon rest_api_tests binaries.
test-rest-api = "test --no-fail-fast -p astronomical-rest-contract -p astronomical-daemon --test rest_api_tests"

# The root whole-product journeys (verification/e2e) that spawn the real
# astronomicald binary; build the daemon first:
# cargo build --bins -p astronomical-daemon.
test-e2e = "test --no-fail-fast -p astronomical-e2e --test e2e"

# The macOS packaging contracts of `cargo xtask app package` (signing
# plans, Cargo arguments, bundle layout, plist checks for every channel, the
# two-process bundle and its app group); runs in the required macOS CI check.
# It selects every xtask test module whose name starts with `app_package`, so
# a new packaging test file must keep that prefix to stay in the lane.
test-app-builder = "test -p xtask --bin xtask app_package"

# Both lanes together; run this before committing.
test-integration-and-rest = "test --no-fail-fast -p astronomical-config -p astronomical-cli -p astronomical-ipc-protocol -p astronomical-lowercase-hex -p astronomical-decision-contract -p astronomical-expert-atlas -p astronomical-native-identity -p astronomical-memory-policy -p astronomical-jangtq2-qwen35 -p astronomical-native-build-orchestration -p astronomical-native-build-tool -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-daemon -p astronomical-quantization -p astronomical-vision-tower -p astronomical-neural-engine-research -p astronomical-rest-contract --lib --test integration_tests --test hardware_journeys --test rest_api_tests"

# The decision-model contract crate on its own: typed questions, validation,
# calibration, typed answers and the Laya prompt layout, pinned to the
# reference implementation by checked-in golden vectors. Pure Rust with no
# graphics processor, model or network; about a second to run. The same tests
# also run in the integration lanes above. The golden vectors are regenerated
# with crates/decision-contract/tests/fixtures/generate_laya_golden_reference_vectors.py
# under a Python environment that has the reference package installed.
test-decision-contract = "test -p astronomical-decision-contract"

# Vision tower journeys against real public Hugging Face repositories: whether a
# repository has a tower, and whether a tower shares a text model's base. They
# read headers and a few small tensors, never whole weights, and need the network,
# so they are #[ignore]d and absent from the lanes above; seconds to run. The unit
# tests beside the source use small local fixtures and run in the lanes above.
# Try it by hand with `astronomical vision inspect organization/name`,
# `astronomical vision match TEXT_MODEL TOWER_MODEL`, and
# `astronomical vision add TEXT_FOLDER --tower TOWER_MODEL --output DIR`.
test-vision-tower-hub = "test -p astronomical-vision-tower --test integration_tests -- --ignored"

# Dense placement contracts on installed models (issue #1985): the text
# weights startup placement compares with the MLX limit, on the streamed_dense
# build (text only) and the dense_vision build (tower and auxiliary tensors
# left out). They read headers only, so they take under a second, but need
# both roles discoverable from the Development model_directories.
test-dense-text-weights = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter dense_text_weights"

# Dense streaming parity (issue #1985): the streamed_dense model answers one
# Shakespeare prompt plus a short greedy decode on the streaming engine, which
# reads embedding rows and decoder layers from the SSD (with every layer
# streamed, then half kept, each prefilled chunk by chunk and layer by layer),
# and on the resident engine; tokens and final logits must be bit-identical.
# Loads the 9B model twice, about fifteen seconds.
test-dense-streaming-parity = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter should_give_the_resident_logits"

# Dense layer-major checkpoint parity (issue #1985): one Shakespeare prompt
# prefilled layer by layer and chunk by chunk over the engine's span plan, at
# 0 and 8 kept layers, must publish identical prompt-cache boundary state at
# the same positions. About fifteen seconds.
test-dense-checkpoint-parity = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter should_publish_the_chunk_path_prompt_cache_state_from_a_layer_major_prefill"

# Dense prompt forward memory (issue #1985): one streamed_dense prompt forward,
# a full 4,096-token chunk and a shorter prompt, with every layer streamed and
# with seven kept, must peak within the plan's reserve for one streamed
# forward (two layer slots plus the probed working memory). About ten seconds.
test-dense-prompt-forward-memory = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter should_keep_a_streamed_prompt_forward_within_the_planned_reserve"

# The ModernBERT trunk shared by embeddings and decision models (issue #2032).
# `test-modernbert` runs its lib tests: pure checks of batching, masks and
# config forms, plus contracts on a small synthetic ModernBERT built on the
# graphics processor (a padded row gets the hidden states it gets alone);
# about three seconds, no installed model. `test-modernbert-embedding-vectors`
# embeds three Romeo and Juliet excerpts with the real embedding model and
# compares every component against vectors recorded before the trunk was
# restructured; pass `--configuration PATH` naming a JSON file whose
# `model_directory` is the nomicai-modernbert-embed-base-8bit folder.
test-modernbert = "test -p astronomical-model-serving --features direct-mlx --lib modernbert"
test-modernbert-embedding-vectors = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter should_reproduce_the_embedding_vectors_recorded_before_the_trunk_was_restructured"

# The Laya decision-model backend (issue #2032). `test-laya` runs its lib
# tests: artifact, configuration, tokenizer and batching checks, plus the
# decision head on small synthetic weights built on the graphics processor;
# about a second, no installed model. The two journeys below load the real
# 8-bit MLX checkpoints; pass `--configuration PATH` naming a JSON file whose
# `model_directory` is the MLX Laya repository folder (English checkpoint at
# its root, `multilingual/` beside it). `test-laya-reference-decisions`
# compares token sequences exactly and probabilities within 0.05 against the
# float32 reference recorded in tests/fixtures/laya_reference_decisions.json
# (regenerate with the script beside it). `test-laya-engine-requests` covers
# refusals and a request that spans several forward passes. A few seconds each.
test-laya = "test -p astronomical-model-serving --features direct-mlx --lib decision_models"
test-laya-reference-decisions = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter laya_reference_decisions"
test-laya-engine-requests = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter laya_engine_requests"
# Text to speech: Kokoro-82M and Phonon 31M on MLX. `test-speech` runs the
# speech lib tests (shared layers, both families' layers on small weights from
# the Shakespeare fixture, the engines' request checks); about a second, no
# installed model. `test-english-speech-text` runs the pure crates that turn
# text into what the models read: Kokoro's phonemes and spoken numbers, and
# the speech contract (request checks, PCM and WAV encoding). The two journeys
# load a real checkpoint and speak a Romeo and Juliet passage through the
# speech engine; pass `--configuration PATH` naming a JSON file whose
# `model_directory` is the model folder (Kokoro: config.json,
# kokoro-v1_0.safetensors, voices/; Phonon: config.json, model.safetensors,
# tokenizer.json, default-voice.safetensors) and, to keep the audio as WAV,
# an `evidence_directory`. A few seconds each; each prints every segment's
# time. `test-kokoro-reference-speech` (same configuration as Kokoro's) holds
# the port against the PyTorch reference recorded in
# `kokoro_reference_speech.json`: frames per token, pitch, energy and loudness;
# a few seconds. `generate_kokoro_reference_speech.py` beside the fixture
# says how to record it again. `test-speech-serving` runs how speech is
# served without a model: the daemon's speech admission, events, model choice
# and `POST /v1/audio/speech`
# and IPC journeys (audio in bounded frames, refusals before dispatch), with
# scripted workers; under a minute. `test-speak-cli` runs `astronomical
# speak`'s own tests and its journeys against a stub daemon. The chat
# window's Speak button is not a cargo test: its text, piece, playback and
# button journeys are part of the web client's suite, `cd apps/thin-talk/web
# && npm test` (CI's thin-talk-web-tests step), which fakes the speech endpoint
# and Web Audio; only a rebuilt Development app can show real sound.
# That suite runs with a 1 GB heap limit (run-tests.mjs): it peaks near 600 MB,
# so `heap out of memory` there means one test is broken, usually a failing
# assert that was handed a DOM node, never that the limit is too low.
test-speech = "test -p astronomical-model-serving --features direct-mlx --lib speech"
test-english-speech-text = "test -p astronomical-english-phonemes -p astronomical-english-number-words -p astronomical-speech-contract"
test-kokoro-speech = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter kokoro_speech"
test-kokoro-reference-speech = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter kokoro_reference_speech"
test-phonon-speech = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter phonon_speech"
test-speech-serving = "test -p astronomical-daemon --lib --test rest_api_tests --test integration_tests speech"
test-speak-cli = "test -p astronomical-cli speak"
# Laya latency on an optimized build: after one warmup request, the median of
# 20 requests with 1, 5 and 10 questions, each question filled to the
# checkpoint's own token limit (512 English, 1,024 multilingual). Decision
# models generate nothing, so this replaces the usual 10,000-in / 500-out
# measurement for them. It prints numbers and asserts no threshold; a few
# seconds after the build.
measure-laya-decision-latency = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --filter should_measure_laya_decision_latency_at_the_token_limit"
# Clef latency on an optimized build: after one warmup request, the median of
# 3 requests with 1, 5 and 10 questions, each a full 16,384-token sequence (a
# long Romeo and Juliet state cut to fit). It prints numbers, with progress
# and an ETA every 5 seconds, and asserts no threshold. Each line also carries
# the peak MLX memory the process has needed so far; the last one is what the
# catalog entry records as `approximate_memory_bytes`.
measure-clef-decision-latency = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 1800 --filter should_measure_clef_decision_latency_at_the_sequence_limit"
# Kev latency on an optimized build: after one warmup request, one request
# each with 1, 5 and 10 questions on a Romeo and Juliet state at Kev's
# 65,536-token state limit, with the state's prefill rate. It prints numbers,
# with progress and an ETA every 5 seconds, and asserts no threshold. Every
# request prefills the whole state, so the case budget is an hour, not the
# default two minutes. Each line also carries the peak MLX memory the process
# has needed so far; the last one is what a Kev catalog entry records as
# `approximate_memory_bytes`.
measure-kev-decision-latency = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 3600 --filter should_measure_kev_decision_latency_at_the_state_limit"
# The reads a Qwen3.5-based decision model (Kev, Clef) makes from the backbone
# (issue #2032 phase 6): final hidden states, output-projection rows, and
# question rows continued from a checkpointed state, each checked against the
# engine's own vocabulary head or an uninterrupted pass. `model_directory` is
# an MLX Qwen3.5 model; run it with a quantized and a bfloat16 build, whose
# output projections are read along different paths.
test-qwen-decision-readout = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter qwen_decision_readout"
# The Kev decision engine (issue #2032 phase 7) on a `cargo xtask convert-kev`
# output folder given as `model_directory`: an unambiguous question answered
# correctly, every question independent of the others, and the reference's
# state limit enforced.
test-kev-engine-requests = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter kev_engine_requests"
# Kev parity with Kev's reference scoring (issue #2032 phase 7) on a
# `cargo xtask convert-kev` output folder given as `model_directory`: every
# row's tokens identical, probabilities within 0.05 of the float32 reference.
# Regenerate a fixture with tests/fixtures/generate_kev_reference_decisions.py.
test-kev-reference-decisions = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter kev_reference_decisions"
# Clef parity with Clef's reference scoring (issue #2032 phase 8) on the
# `mlx-community/clef-flash-8bit` folder given as `model_directory`: the
# sequence's tokens identical, probabilities within 0.05 of a float32
# reference on the same weights. Regenerate the fixture with
# tests/fixtures/generate_clef_reference_decisions.py.
test-clef-reference-decisions = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter clef_reference_decisions"
# The decisions lane from the outside in (issue #2032): the `astronomical
# decide` verb against a stub daemon, POST /v1/systemone and the daemon IPC
# frame against scripted workers, the worker's decisions slot, and discovery
# of a Laya repository and the checkpoints it bundles. No model is loaded, so
# these run in the ordinary integration and REST lanes too; the aliases exist
# to run just this lane while working on it.
test-decide-verb = "test -p astronomical-cli decide"
test-decisions-daemon = "test -p astronomical-daemon --lib --test integration_tests --test rest_api_tests -- decisions system_one decision_model"
test-decisions-worker = "test -p astronomical-model-serving --lib engine_backed_worker::tests::decisions"
test-laya-discovery = "test -p astronomical-config --test integration_tests model_discovery::laya"

# Dense streaming speed ladder (issue #1985), on an optimized build with the
# weight files kept out of the macOS file cache: the raw layer read rate, one
# streamed layer, then 10,000 Shakespeare tokens in and 500 out at 0, 8, 16
# and 24 kept layers. Reads cold from the SSD for about 25 minutes, hence the
# one-hour case budget; decode prints progress with an ETA every five
# seconds, and each prefill, about eight seconds, prints when it ends.
measure-dense-streaming-speed = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 3600 --filter should_measure_dense_streaming_speed_from_the_layer_read_up"

# Quantization lanes (the OptiQ port in crates/quantization).

# The GPU encoder against the pure reference encoder and the shard-wise
# requantizer on synthetic sources (two bf16 shards, packed, fused, stacked,
# FP8); seconds, no model artifacts. Contracts are #[parallel] except the
# peak-memory one, which is #[serial] because MLX peak memory is
# process-global.
test-quantization-direct-mlx = "test --no-fail-fast -p astronomical-quantization -p astronomical-vision-tower --features direct-mlx --test direct_mlx"

# Real-model conversion, parity, and throughput journeys; append
# --configuration PATH containing model_directory and, for parity,
# reference_artifact_path.
test-quantization-acceptance = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test quantization --ignored"

# Parity with OptiQ on a real base: the structural conversion byte for byte,
# the calibration sequences token for token, the bit map from OptiQ's own
# sweep, and the Rust sweep's module ranking. Append --configuration PATH
# with model_directory (a bfloat16 source) and reference_artifact_path (what
# crates/quantization/tests/fixtures/build_optiq_reference_artifacts.py wrote
# from that source; build_optiq_parity_sources.py makes the source from an
# installed quantized model). The measured sweep forwards four calibration
# sequences and takes about three minutes on Qwen3.5 0.8B, hence the
# fifteen-minute case budget and the optimized build.
test-quantization-parity = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test quantization --release --ignored --case-budget-seconds 900 --filter python_parity"

# Mixture-of-experts probing on a synthetic model: the router and each
# routed-expert projection are swapped and exactly restored, and the measured
# sweep ranks modules like OptiQ's. Append --configuration PATH with
# model_directory (what build_optiq_synthetic_moe_source.py wrote with
# --tie-word-embeddings) and reference_artifact_path (what
# build_optiq_reference_artifacts.py --reference uniform_4bit --methods optiq
# --skip-low-bit wrote from it). Seconds, not minutes: the model is tiny.
test-quantization-mixture-of-experts = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test quantization --release --ignored --case-budget-seconds 900 --filter mixture_of_experts_sweep"

# Repository tooling as typed Rust; the subcommand catalog lives in the
# xtask sources. `cargo xtask app dev` rebuilds the Development app
# (incremental `app-dev` profile, cached icon and npm install, ad-hoc
# signing) and swaps it in for the running one, opening it in front; `cargo
# xtask app dev --background` opens it behind every other window instead,
# without taking the keyboard, for rebuilding while working in another app;
# `cargo xtask app draft "<text>"` puts that text in the running Development
# chat's message field, also in the background and without sending it, so a
# question can be typed for a live check without taking the keyboard;
# `cargo xtask app export-to <absolute folder>` has that chat write its next
# export into the folder under its suggested name with no save panel, which
# would otherwise come to the front; it holds for one export;
# both link commands refuse when the Development app is not running, since
# a link would launch it in front;
# `cargo xtask app instance
# status|start|stop|restart` controls that instance headless; `stop` quits
# the chat app and the menu-bar agent, and `restart` reopens the agent (not
# the chat window) if it quit one; `cargo xtask
# app info-plist --channel development|stable|app-store [--agent]` prints the
# plist a channel's main app would get, or with `--agent` its menu-bar
# agent's, for inspecting the channel profiles. `cargo xtask app
# package --channel stable|app-store [--signing-identity NAME]` builds a
# release bundle from a clean commit in the disposable app-release lane, and
# `cargo xtask app smoke-test --app-bundle PATH [--real-model MODEL_ID]`
# launches a built bundle in isolation, then starts its menu-bar agent the
# way macOS does at login (service label as the first launch argument, root
# working directory) and requires the agent to bring the engine up. A
# store bundle is supported: its engine is started only through its agent,
# and the bundle should sit in the Applications folder, because from a build
# folder its sandboxed agent did not reach the engine. A store bundle carries
# no `astronomical` terminal command, which cannot be sandboxed, and both of
# its applications carry the privacy manifest.
# `cargo xtask release create-dmg --app-bundle PATH --output PATH` builds the
# drag-to-Applications image and `cargo xtask release validate-dmg --dmg PATH`
# proves a notarized image's install journey; `cargo xtask release
# validate-distribution-app` checks Developer ID signatures and `cargo xtask
# release notarize-dmg [--timeout-seconds N]` notarizes and staples an image;
# `cargo xtask release install-stable [--dry-run]` and `build-and-install-stable
# [--dry-run]` promote Stable to ~/Applications; `cargo xtask release
# app-store-pkg --app-bundle PATH --installer-identity NAME` wraps an App Store
# bundle in its signed installer package, and `cargo xtask release
# app-store-upload --package PATH --api-key ID --api-issuer ID [--upload]`
# asks App Store Connect to validate that package and sends it only with
# `--upload` (the API key's private half stays in
# ~/.appstoreconnect/private_keys); `cargo xtask release prepare-and-publish`
# and its credential-resolving front door `cargo xtask release prepare-signed`
# prepare a signed release locally and, with --publish, publish the reviewed
# directory; `cargo xtask release accept-sparkle-update` proves a signed
# update installs and relaunches and a corrupted one is rejected (release-only
# steps).
# `cargo xtask prewarm-native-build --profile core` builds the pinned native
# MLX runtime into the machine-wide store before Cargo compiles anything.
# `cargo xtask native-fingerprint --profile core [--target TRIPLE] [--explain]`
# prints that build's identity; `--cache-environment` prints it with its store
# entry directory as `$GITHUB_ENV` lines for workflows that cache the entry.
# `cargo xtask check-test-channel-isolation` fails when a package test tree
# reaches for Stable state, and `cargo xtask menu-contracts` runs the menu
# app's Swift contract tests with the Git credential helper cleared.
# `cargo xtask lint-acceptance-features` lints the acceptance crate's tests
# with every one of its features on; the pre-commit hook runs it on any
# staged Rust source, because no default-feature pass and no
# continuous-integration lane compiles those feature-gated journeys.
# `cargo xtask convert-laya --checkpoint DIRECTORY --output DIRECTORY` converts a
# PyTorch Laya checkpoint (model.safetensors, rl_agent_config.json,
# encoder/config.json, tokenizer/) into the MLX layout Astronomical serves:
# linear layers of the encoder and decision head quantized to 8 bits in groups
# of 32, temperatures moved into config.json, no local paths in any output file.
# Convert a bundled checkpoint such as `multilingual/` into a matching
# subfolder of the output, then run `cargo test-laya-reference-decisions` with
# the output folder as `model_directory` to compare it with the reference.
# `cargo xtask convert-kev --adapter DIRECTORY --base DIRECTORY --output DIRECTORY`
# folds a Kev LoRA adapter (adapter_model.safetensors, adapter_config.json,
# head.pt) into the Qwen3.5 base it names and writes the merged backbone in the
# base's own layout, the pointer head as kev_head.safetensors and its settings
# as kev_decision.json. It refuses a base snapshot whose revision differs from
# the one head.pt was trained on; run `cargo test-kev-engine-requests` with the
# output folder as `model_directory` to check it answers.
# `cargo xtask vendor-thin-talk-assets [--verify-only]` vendors and verifies the
# Thin Talk canvas's pinned offline web assets.
# `cargo xtask provision-bindgen-headers [--verify-headers]` extracts the
# pinned, patched MLX and MLX-C headers for bindgen (prewarm runs it first). `cargo xtask audit-test-declarations` walks every crate's
# tests/ tree and fails when a test file is unreachable from any target
# through `mod` declarations (the class of silent-orphan bug that once hid
# seven tests in an undeclared file). `cargo xtask test-run` builds exact
# Cargo executables and
# runs each selected test in its own process, with a 120-second budget
# (--case-budget-seconds replaces it for inherently long measurements),
# five-second progress, and retained manifests/logs under target/test-runs;
# serving measurements must use this runner.
#
# Function-length and complexity enforcement (issue #1637) is pre-commit
# territory ONLY (policy, 2026-10-31): the hook's clippy pass denies
# clippy::too_many_lines (the 100-line budget, #[expect]-tracked debt) and
# `cargo xtask crap-baseline` ratchets complexity against the
# crap-baseline.json committed at HEAD as a hard failure: a baseline function
# may not grow, and a function the baseline does not list yet may not exceed
# cyclomatic complexity 15 unless crap-admissions.json names it with a
# reason. `cargo xtask crap-baseline --write` regenerates the baseline from
# the current tree only after that check passes, so a plain commit cannot
# raise a baseline entry and grow its function together (an amend, rebase or
# squash can; the module doc lists what the gate cannot see).
# `cargo xtask crap-baseline --against origin/main`, run by the pre-push hook,
# judges the tree against main's baseline instead, catching a branch built on
# an older one. GitHub Actions runs no code-shape enforcement at all.
#
# `cargo xtask commit-identity --staged` (pre-commit) and
# `cargo xtask commit-identity --pre-push` (pre-push, reads git's ref lines on
# stdin) refuse author, committer, and Co-authored-by emails that are not safe
# to publish: only the numeric `<id>+<login>@users.noreply.github.com` form,
# GitHub-owned addresses, `noreply@` service addresses, and reserved fixture
# domains pass. A login-only no-reply address is refused because GitHub
# credits it to whichever stranger owns that login.
#
# `cargo xtask install-verification-tools [--prefix DIR]` installs the pinned
# cargo-about and sccache prebuilts, SHA-256 verified, into DIR (default
# `$CARGO_HOME/bin`), and skips any binary already reporting its pinned
# version. CI points DIR at a cached folder so warm runs download nothing.
xtask = "run -p xtask --"

# Compile the whole workspace across ALL targets without running anything;
# the pre-push gate. Run `cargo verify` before every push.
verify = "check --workspace --all-targets"

# Visibility audits (issue #1355). Output is a candidate list, never a
# verdict: confirm any candidate by hand (`git grep -wn "<name>" -- '*.rs'`)
# before changing visibility, and run them from a checkout with no nested
# copy of these sources, or the audit reports zero from self-matches.
audit-unused-public-bins = "clippy --workspace --bins -- -A clippy::all -D dead_code_pub_in_binary"
audit-unused-public-workspace = "workspace-unused-pub"

# Acceptance lanes: one alias per GPU lane, so the packages, features,
# targets, and the serial rule cannot be forgotten.

# The model-serving direct-MLX contract suite plus the runtime-integration
# MLX-C coverage bridge contract (CPU-only) so bridge drift fails the lane.
test-direct-mlx = "test --no-fail-fast -p astronomical-acceptance --features astronomical-acceptance/direct-mlx -p astronomical-runtime-integration --features astronomical-runtime-integration/mlx -p astronomical-model-serving --features astronomical-model-serving/direct-mlx --lib --test direct_mlx --test mlx_c_coverage_contract_tests -- --test-threads=1"

# Every native memory-contract phase in one bounded invocation; the probe
# binary must exist first (see check-mlx-memory-contract).
test-mlx-memory = "test --no-fail-fast -p astronomical-acceptance --features direct-mlx,mlx-memory-contract-probe --test memory_contracts -- --ignored --test-threads=1"

# Compile-only drift gate for the mlx-memory-contract-probe feature world,
# which sits off every routine graph; API moves under it are caught here in
# seconds instead of silently drifting.
check-mlx-memory-contract = "check -p astronomical-runtime-integration --features mlx-memory-contract-probe --all-targets"

# The whole real-model acceptance package, one selected case per process;
# append --configuration PATH for explicit model/evidence inputs and
# --filter NAME to narrow the journeys. Performance measurements are left out
# on purpose (no performance-measurement feature): they compare strategies on
# demand and only record numbers, so they belong in `cargo measure-paged-prefill`,
# not in every regression pass.
test-acceptance = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx,serving-acceptance,expert-paging,performance_throughput,mlx,mlx-memory-contract-probe --tests --release --ignored"

# On-demand paged-prefill performance measurements (prefill chunk size and
# back-to-back residency churn on the large sparse model; issues #1716 and
# #1717). Each case loads the real model, so run them only when comparing
# strategies; append --filter NAME to pick cases.
measure-paged-prefill = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx,expert-paging,performance-measurement --test performance_measurement --release --ignored --filter paged_prefill"

# Routed-expert page reads from the SSD (not the file cache) through MLX: the
# production stock-safetensors page load, the same page read again warm, and
# three expert-major Atlas read shapes, with the Atlas bytes checked equal to
# the stock bytes. It converts the 16 least-cached expert layers of the
# installed large sparse MoE model into a temporary Atlas (about 13 GB of
# scratch space, checked before writing), skips any page `mincore` finds in
# the file cache, and fails within its 120-second budget when too few
# uncached pages remain. Append --configuration PATH whose `model_directory`
# names the model when the Development configuration does not discover it;
# the streaming-latency probes in the same file honour that override too.
measure-cold-expert-page-reads = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test direct_mlx --release --ignored --filter should_time_cold_routed_pages_through_mlx_for_stock_and_atlas_layouts"

# An Expert Atlas model (made by `astronomical models convert-atlas`) against
# the stock checkpoint it came from: both validate, budget memory alike, and
# load byte-identical routed pages and a complete layer through the
# production plan builder and page loader. Pass --configuration PATH whose
# `model_directory` names the Atlas and `reference_artifact_path` its source.
verify-atlas-model-pages = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test direct_mlx --release --ignored --filter should_load_identical_expert_tensors_from_an_atlas_and_its_stock_source"

# Where a paged decode token's time goes: one 10,000-token Shakespeare request
# (after a 500/50 warmup) through the attributed in-process engine, printing
# per decode token the wall time, the per-layer route copies to the host and
# the storage reads. Use it before and after any residency-policy change.
# Pass --configuration PATH whose `model_directory` names the sparse model and
# whose `paging_experiment.maximum_mlx_memory_gigabytes` sets the MLX limit.
measure-decode-residency-attribution = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --filter should_attribute_decode_token_time_to_route_copies_and_storage_reads"
# The same probe with the model's weight files kept out of the macOS file
# cache for the whole run: what the reads cost on a Mac whose RAM is the
# limit, rather than on a larger Mac that caches the model in memory.
measure-cold-decode-residency-attribution = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --filter should_attribute_decode_token_time_with_a_cold_file_cache"

# Cold SSD-streaming prefill as production serves it: the in-process engine
# with request attribution off (attribution synchronizes after every prefill
# stage and changes how reads overlap), a 500/50 warmup, then a 10,240-token
# Shakespeare prefill with the model's files kept out of the file cache.
# It asks for 2 output tokens rather than the usual 500 on purpose: the
# measured time must be prefill alone, and decode has its own probe above.
# Prints request seconds and prompt tokens per second per request. Pass
# --configuration PATH whose `model_directory` and `paging_experiment` (MLX
# limit and SSD-streaming chunk) set the case.
measure-unattributed-cold-prefill = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --filter should_measure_cold_prefill_without_attribution"

# One cell of the SSD-paging graph-submission interval comparison on the
# 4-bit sparse model: append --configuration PATH whose `paging_experiment`
# object sets the ceiling, the streaming chunk and the prefill and generation
# intervals (the measurement file's header shows the shape). Run it once per
# interval pair; each run prints one `[graph-submission-interval]` line.
measure-paging-submission-intervals = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx,expert-paging,performance-measurement --test performance_measurement --release --ignored --filter should_measure_serving_rates_for_the_configured_graph_submission_intervals"

# FLUX.2 Klein REST journeys on real models, for both the BF16 build and the
# 4-bit MLX build (mlx-community/flux2-klein-4b-4bit): generation and exact
# repetition, cancellation and reuse, initial noise, and the chat swap. Each
# journey finds its build through the Development configuration's model
# directories and fails at discovery when that build is not installed; append
# --configuration PATH with reference_artifact_path to compare the BF16 image
# with the independent reference.
test-flux2-klein-rest = "run -p xtask -- test-run --package astronomical-acceptance --features serving-acceptance --test chat_serving --filter flux2_klein_rest --ignored"
# Prism-Hadamard lanes: real-pack contracts and upstream greedy parity,
# performance tiers, serving throughput, and real-worker chat; append
# --configuration PATH containing model_directory and, for parity,
# reference_artifact_path.
test-prism-hadamard-direct = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test prism_hadamard --ignored"
test-prism-hadamard-performance = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test prism_hadamard --release --filter throughput --ignored"
test-prism-hadamard-serving-throughput = "run -p xtask -- test-run --package astronomical-acceptance --features performance_throughput --test performance_throughput --release --filter folded_ternary --ignored"
test-prism-hadamard-serving = "run -p xtask -- test-run --package astronomical-acceptance --features serving-acceptance --test chat_serving --filter should_serve_greedy_and_sampled_chat_completions_from_the_folded_pack --ignored"

# Prefill memory recovery on the largest sparse model (issues #1729, #2217):
# two real-model REST journeys. One sends a prompt whose first full chunk runs
# out of memory at a 37 GiB ceiling and requires both requests to be served.
# The other sends a short request and then a long one at 32 GiB with everyday
# settings and requires memory in use to be back above half the ceiling while
# the long prompt is still being read. Needs the GPU free and the model that
# registry/e2e_test_model_names.json names as largest_sparse_moe_streaming in
# a folder the Development configuration lists.
test-prefill-memory-recovery = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx,serving-acceptance,expert-paging --test expert_paging --release --ignored --filter prefill_memory_recovery_rest_journey"

# `astronomical launch claude` end to end (issue #891): a real daemon on the
# configured small dense model, the launch verb's preparation, and a headless
# Claude Code turn. Needs Claude Code on PATH; prints per-stage [timing].
test-claude-code-launch = "run -p xtask -- test-run --package astronomical-acceptance --features serving-acceptance --test chat_serving --release --ignored --filter should_complete_a_claude_code_turn_on_the_local_model_through_the_launch_verb"

# JANGH2 lanes: plan contracts against real bundles, GPU decode-throughput
# (memory-traffic bound, so the optimized build is part of the alias; serial
# by rule), correctness contracts, and serving throughput over the daemon
# IPC boundary persisted to the durable throughput history; append
# --configuration PATH containing model_directory.
test-jangtq2-plan = "run -p xtask -- test-run --package astronomical-model-serving --features direct-mlx --lib --filter quantized_expert_layer_plan --ignored"
test-jangtq2-decode-throughput = "test --release --no-fail-fast -p astronomical-jangtq2-qwen35 --features direct-mlx --test direct_mlx throughput -- --ignored --nocapture --test-threads=1"
test-jangtq2-direct-mlx = "test --no-fail-fast -p astronomical-jangtq2-qwen35 --features direct-mlx --lib --test direct_mlx -- --test-threads=1"
test-jangtq2-serving-throughput = "run -p xtask -- test-run --package astronomical-acceptance --features performance_throughput --test performance_throughput --release --filter jangtq2 --ignored"

# Neural Engine hardware journeys (issue #161), verification/neural-engine: real
# hardware, optimized build, about twenty minutes in all. Narrow with --filter
# NAME. The ternary journeys need --configuration PATH whose `model_directory`
# names the Ternary-Bonsai-2-27B checkpoint, and the runner stops at the first
# failing journey, so a run without --filter needs that configuration too. The
# 900-second budget exists for the 64-layer load. The catalogue of journeys and
# their filters is the header of tests/hardware_journeys.rs.
test-neural-engine-journeys = "run -p xtask -- test-run --package astronomical-neural-engine-research --test hardware_journeys --release --ignored --case-budget-seconds 900"

# The opt-in Neural Engine prefill on a real dense artifact: the same loaded
# model alternating with and without its per-layer programs for three rounds,
# comparing prefill and decode speed, final logits, and greedy tokens over the
# Shakespeare fixture. Holds about 20 GiB and takes about six minutes; run it with
# no model loaded in either instance. Two more journeys share this form:
# `should_serve_real_dense_prefill_from_kept_programs` measures the production
# program cache, prefill only (run it twice: the first fills the cache, about three
# minutes, and the second takes about one), and
# `should_compare_real_answers_across_neural_engine_arms` checks exact answers per
# engine setup (about eight minutes).
#
# `should_measure_peak_program_memory_of_the_smallest_model`, and its `two_billion`
# and `nine_billion` siblings in `neural_engine_program_memory.rs`, check that what
# programs measure at load matches what they really hold, on three model sizes. About
# four to six minutes each, under the same filter form with `--ignored --nocapture`.
# `should_sweep_the_token_share_of_the_smallest_model`, and its `two_billion` and
# `nine_billion` siblings, compare shares of a chunk, about ten minutes each.
# `should_compare_real_chunks_on_the_smallest_model`, and the same two siblings, time
# neighbouring chunks of real prompts on each engine, two to six minutes each.
test-neural-engine-real-model = "test --release --no-fail-fast -p astronomical-acceptance --features direct-mlx --test installed_model_contracts should_compare_real_dense_prefill_with_and_without_the_neural_engine -- --ignored --nocapture --test-threads=1"

# The Neural Engine CI lane (job `neural-engine`): the production crate's unit
# tests, in seconds and with no native MLX build. The research crate is in the
# integration lane instead, because its journeys link MLX: CI compiles them and
# runs only what is not #[ignore]d.
test-neural-engine = "test --no-fail-fast -p astronomical-neural-engine --all-targets"

# Engine-versus-memory-ceiling isolation on the resident 35B sparse-MoE
# model; narrow with --filter, add --configuration PATH with
# {"diagnostics": true} for performance attribution.
test-engine-versus-memory-ceiling = "run -p xtask -- test-run --package astronomical-acceptance --features performance_throughput --test performance_throughput --release --filter engine_versus_memory_ceiling --ignored"

# Paged-versus-resident parity (issue #1679): the 35B sparse-MoE answers a long
# greedy and a short seeded question resident and paged, and both engines must
# give identical tokens. Each journey spawns its resident recording test in a
# child process (MLX fixes its memory limit once per process) and reads the
# answers from its standard output. The kernel-level guard for the same defect
# runs without a model in `test-direct-mlx` (sparse_expert_projection_page_independence).
test-paged-resident-parity = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --filter should_give_the_resident_answer --ignored"
