[build]
# Warnings are defects: every Cargo compilation must fail on the first
# warning instead of letting it scroll past and rot. `build.warnings` scopes
# the deny to workspace crates, unlike rustflags = ["-D", "warnings"] which
# would also hard-fail on any warning emitted by third-party dependencies.
warnings = "deny"

# Build parallelism deliberately stays at Cargo's default: `build.jobs`
# defaults to the logical CPU count, so any literal value could only cap
# parallelism (and would hardwire a machine-specific core count). The
# nightly parallel rustc front-end was measured and rejected: wall time
# within noise, higher CPU, and a split of the sccache keys.

[alias]
# Every alias is written as one string, never as a TOML array. Cargo merges
# config files from every ancestor directory and JOINS array values across
# them, while a string from the nearest file replaces the ancestors' value;
# an array alias would double whenever an ancestor .cargo/config.toml
# defines the same alias, repeating it into a broken command.
#
# Lane vocabulary: "integration" is the scripted, deterministic test kind
# (no network, no real model artifacts). Acceptance lanes run real-model
# journeys — `#[ignore]`d, serial (`--test-threads=1`), Apple-Silicon only —
# and take an optional `--configuration PATH` for explicit inputs; the
# per-journey parameters and findings live with those tests, not here.

# Every package's integration_tests binary plus lib unit tests.
# The lane aliases below list no packages: each package declares its lanes in its
# own Cargo.toml under [package.metadata.astronomical] test-lanes, and
# `cargo xtask lane-cargo ALIAS` builds the command from those declarations
# (issue #2473, Step 6). Adding a crate to a lane edits only that crate's
# manifest, and a package that declares no lanes fails instead of being skipped.
# test-integration and the three nextest archives share the integration lane:
# cargo unifies features per command, so a different list recompiles what the CI
# build step just compiled (49 crates and about 36 seconds when they differed).
test-integration = "xtask lane-cargo test-integration"

# Most of that selection through cargo-nextest (one process per test, so process-global
# state cannot leak between tests), for local runs; it leaves out the REST contract,
# E2E and Neural Engine research packages. CI uses the archives below instead.
nextest-integration = "xtask lane-cargo nextest-integration"

# Portable nextest archives for the CI build/test split; each selection must
# stay identical to the selection the compile step builds through the cargo
# aliases above (the workflow lane contract pins that equality).
nextest-archive-integration = "xtask lane-cargo nextest-archive-integration"
nextest-archive-rest-api = "xtask lane-cargo nextest-archive-rest-api"
nextest-archive-e2e = "xtask lane-cargo nextest-archive-e2e"

# The shared fixture registry and leaf-id contracts (test-fixtures), plus the
# independent FLUX reference-oracle unit coverage (flux-reference-oracle), which
# pulls in base64/image/sha2 only for this lib build.
test-test-harness-fixtures = "test --no-fail-fast -p test-harness --features test-fixtures,flux-reference-oracle --lib"

# The REST contract and daemon rest_api_tests binaries.
test-rest-api = "test --no-fail-fast -p rest-contract -p astronomical-daemon --test rest_api_tests"

# The root whole-product journeys (verification/e2e) that spawn the real
# astronomicald binary; build the daemon first:
# cargo build --bins -p astronomical-daemon.
test-e2e = "test --no-fail-fast -p astronomical-e2e --test e2e"

# The macOS packaging contracts of `cargo xtask app package` (signing
# plans, Cargo arguments, bundle layout, plist checks for every channel, the
# two-process bundle and its app group); runs in the required macOS CI check.
# It selects every xtask test module whose name starts with `app_package`, so
# a new packaging test file must keep that prefix to stay in the lane.
test-app-builder = "test -p xtask --bin xtask app_package"

# Both lanes together; run this before committing.
test-integration-and-rest = "xtask lane-cargo test-integration-and-rest"

# The decision-model contract crate on its own: typed questions, validation,
# calibration, typed answers and the Laya prompt layout, pinned to the
# reference implementation by checked-in golden vectors. Pure Rust with no
# graphics processor, model or network; about a second to run. The same tests
# also run in the integration lanes above. The golden vectors are regenerated
# with crates/contracts/decision-contract/tests/fixtures/generate_laya_golden_reference_vectors.py
# under a Python environment that has the reference package installed.
test-decision-contract = "test -p decision-contract"
# Decision-model calibration and head training on a person's own labelled
# examples: the examples format, the split by state, temperature fitting,
# judging each fit and training, the CPU heads that serve as the GPU trainer's
# oracle, and the proven copy of a model folder. Pure Rust on the CPU with
# no model or graphics processor; a second or two to run. The
# `astronomical decision calibrate` and `decision train` verbs drive it end
# to end.
test-decision-training = "test -p decision-training"
# The GPU training loop that runs inside the inference worker: the stepped
# job (check, train, score), runs and early stopping, each family's final
# layers' forward and backward pass, the precise (TF32-safe) matrix product,
# the objective and the anchored optimizer, all against the CPU oracle, plus
# a synthetic positive control. Needs MLX and the graphics processor (the
# tests are #[serial]); under a second once built. The whole journey runs
# live with `astronomical decision train EXAMPLES --output DIR --model ID`
# against the Development instance.
test-decision-gpu-training = "test -p decision-models --features direct-mlx --lib decision_models::training"
# The release of outgrown attention slabs between reply tokens: without it
# the `mlx_buffer_cache` gains the whole attention state every growth step
# and wired memory climbs to the system ceiling during a long reply. Needs
# MLX and the graphics processor (the tests are #[serial]); under a second
# once built.
test-reply-token-reclaim = "test -p text-generation --features direct-mlx --lib reply_token_mlx_buffer_cache_reclaim"
# Whole-model training (`decision train --whole-model`): MLX's own gradients
# through every operation Laya's forward pass uses (an 8-bit projection with
# an add-on, rotary embedding, masked attention, exact GELU), the micro-batch
# objective against final-layer training's hand-written gradient, the add-on
# layout and starting values, the add-on path every linear layer takes, and
# how serving's passes are regrouped so trained scores compare with served
# ones, and the parts of recomputing layers for a text too long for a pass
# (issue #2299) that need no model. Needs MLX and the graphics processor
# (#[serial]); about a second.
# The whole journey runs live with `astronomical decision train EXAMPLES
# --whole-model --output DIR --model laya-MLX-8bit` against Development, on
# at least 1000 labelled questions about 100 states.
# The linear add-on tests live in model-primitives (issue
# #2340), so both packages run with their direct-MLX feature.
test-decision-whole-model-training = "test -p decision-models -p model-primitives --features decision-models/direct-mlx,model-primitives/direct-mlx --lib -- adapter_training linear_adapters decision_adapters laya::served_batches laya::batching"

# Vision tower journeys against real public Hugging Face repositories: whether a
# repository has a tower, and whether a tower shares a text model's base. They
# read headers and a few small tensors, never whole weights, and need the network,
# so they are #[ignore]d and absent from the lanes above; seconds to run. The unit
# tests beside the source use small local fixtures and run in the lanes above.
# Try it by hand with `astronomical vision inspect organization/name`,
# `astronomical vision match TEXT_MODEL TOWER_MODEL`, and
# `astronomical vision add TEXT_FOLDER --tower TOWER_MODEL --output DIR`.
test-vision-tower-hub = "test -p vision-tower --test integration_tests -- --ignored"

# Dense placement contracts on installed models (issue #1985): the text
# weights startup placement compares with the MLX limit, on the streamed_dense
# build (text only) and the dense_vision build (tower and auxiliary tensors
# left out). They read headers only, so they take under a second, but need
# both roles discoverable from the Development model_directories.
test-dense-text-weights = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter dense_text_weights"

# Dense streaming parity (issue #1985): the streamed_dense model answers one
# Shakespeare prompt plus a short greedy decode on the streaming engine, which
# reads embedding rows and decoder layers from the SSD (with every layer
# streamed, then half kept, each prefilled chunk by chunk and layer by layer),
# and on the resident engine; tokens and final logits must be bit-identical.
# Loads the 9B model twice, about fifteen seconds.
test-dense-streaming-parity = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter should_give_the_resident_logits"
# Kept dense layers in register order (issues #2568, #2585): one load of the
# 4-bit dense_vision model with half its layers kept answers a Shakespeare prompt
# before and after the kept layers convert; the replies must begin alike, a layer a
# forward holds must be left alone, and converting twice must find nothing.
# About fifteen seconds.
test-dense-kept-layer-register-order = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter should_begin_the_same_reply_with_kept_layers_in_register_order"
# The streaming engine's fused expert combination on a served
# mixture-of-experts model (#2585): one load answers the Shakespeare prompt
# with the two-step combination and with the fused one; replies and every
# logit's bits must be equal. Under a minute.
test-streaming-fused-expert-combination = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --filter with_the_fused_expert_combination"

# Dense layer-major checkpoint parity (issue #1985): one Shakespeare prompt
# prefilled layer by layer and chunk by chunk over the engine's span plan, at
# 0 and 8 kept layers, must publish identical astro SSD prompt cache boundary state at
# the same positions. About fifteen seconds.
test-dense-checkpoint-parity = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter should_publish_the_chunk_path_astro_ssd_prompt_cache_state_from_a_layer_major_prefill"

# Expert layer-at-a-time checkpoint parity (issue #2221): one Shakespeare
# prompt prefilled one layer at a time and chunk by chunk on the
# small_sparse_moe_streaming model under an 11 GiB limit, with every layer
# streamed and with the planned layers kept, must publish identical
# astro SSD prompt cache boundary state, and one layer at a time must read every
# expert exactly once. A span failed on purpose and run again must leave
# the same state and read only its own layer again. A prompt with stand-in
# image embeddings, one image split across two spans, must publish the same
# state both ways. About fifty seconds.
test-expert-layer-at-a-time-parity = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter should_publish_the_chunk_path_astro_ssd_prompt_cache_state_reading_experts_one_layer_at_a_time"

# Dense prompt forward memory (issue #1985): one streamed_dense prompt forward,
# a full 4,096-token chunk and a shorter prompt, with every layer streamed and
# with seven kept, must peak within the plan's reserve for one streamed
# forward (two layer slots plus the probed MLX working buffers). About ten seconds.
test-dense-prompt-forward-memory = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter should_keep_a_streamed_prompt_forward_within_the_planned_reserve"

# Qwen3.8-Flash-Next greedy parity (issue #2533): the
# lane_mixing_sparse_moe_streaming model on the streaming engine at a 34 GiB
# limit must choose the reference implementation's greedy tokens for a short
# Romeo and Juliet prompt and for one past the sparse-attention budget
# (fixture flash_next_greedy_reference.json). About thirty seconds.
test-flash-next-parity = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter should_choose_the_reference_greedy_tokens_on_the_streaming_engine"

# Qwen3.8-Flash-Next forward speed at the lowest layer (issue #2533): the
# streaming model's own forwards in the engine's memory state at a 34 GiB
# limit, a 500/50 warmup, then a 10,000-token Romeo and Juliet prompt read
# in 4,096-token chunks and 500 reply tokens sampled at temperature 0.7 and
# at 1.0 (top-k 20). Prints prefill and decode tokens per second. About
# ninety seconds a temperature.
measure-flash-next-sampled-forward-speed = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 150 --filter should_measure_flash_next_forward_speed_at_temperature"

# The ModernBERT trunk shared by embeddings and decision models (issue #2032).
# `test-modernbert` runs its lib tests: pure checks of batching, masks and
# config forms, plus contracts on a small synthetic ModernBERT built on the
# graphics processor (a padded row gets the hidden states it gets alone);
# about three seconds, no installed model. `test-modernbert-embedding-vectors`
# embeds three Romeo and Juliet excerpts with the real embedding model and
# compares every component against vectors recorded before the trunk was
# restructured; pass `--configuration PATH` naming a JSON file whose
# `model_directory` is the nomicai-modernbert-embed-base-8bit folder.
test-modernbert = "test -p decision-models --features direct-mlx --lib modernbert"
test-modernbert-embedding-vectors = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter should_reproduce_the_embedding_vectors_recorded_before_the_trunk_was_restructured"

# The Laya decision-model backend (issue #2032). `test-laya` runs its lib
# tests: artifact, configuration, tokenizer and batching checks, plus the
# decision head on small synthetic weights built on the graphics processor;
# about a second, no installed model. The two journeys below load the real
# 8-bit MLX checkpoints; pass `--configuration PATH` naming a JSON file whose
# `model_directory` is the MLX Laya repository folder (English checkpoint at
# its root, `multilingual/` beside it). `test-laya-reference-decisions`
# compares token sequences exactly and probabilities within 0.05 against the
# float32 reference recorded in tests/fixtures/laya_reference_decisions.json
# (regenerate with the script beside it). `test-laya-engine-requests` covers
# refusals and a request that spans several forward passes. A few seconds each.
# `test-laya-whole-model-training` (and the Kev and Clef aliases below)
# trains a family's whole model on a few dozen Romeo states and proves the
# trainable copy scores exactly as serving does, that a folder with zeroed
# add-ons serves the shipped scores bit for bit, and that a folder with the
# trained add-ons serves the trained scores. `--configuration PATH` names a
# JSON file whose `model_directory` is that family's model folder.
# `test-kev-whole-model-positive-control` (and the Clef and Laya aliases)
# trains the whole model on 140 coded lines whose code alone decides the
# answer and requires 90% right on 30 unseen ones: about a minute and a half
# on Kev, fifteen on Clef.
# `test-kev-whole-model-training-speed` (and the Clef and Laya aliases) times
# a few gradient steps and the scoring on a small job, about twenty seconds,
# and prints milliseconds per question: the loop to iterate training speed on.
# `test-clef-whole-model-pass-memory` (and the Kev alias) runs one gradient
# step on a single text of about 130, 195 and 260 tokens, all inside the
# pass budget, and prints each step's peak memory above the resident model,
# under a minute on Clef: how a pass's memory grows with text length.
# `test-kev-whole-model-layer-recomputation` (and the Clef alias) trains one
# text longer than the pass budget twice, recomputing each layer and keeping
# every activation, and requires the same weights and a lower peak: about a
# minute on Kev 0.8B.
test-laya = "test -p decision-models --features direct-mlx --lib decision_models"
test-laya-reference-decisions = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter laya_reference_decisions"
test-laya-engine-requests = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter laya_engine_requests"
test-laya-whole-model-training = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter whole_model_training::should_serve_shipped_scores_with_zero_add_ons_and_trained_scores_with_trained_ones_on_laya"
test-kev-whole-model-training = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter whole_model_training::should_serve_shipped_scores_with_zero_add_ons_and_trained_scores_with_trained_ones_on_kev"
test-clef-whole-model-training = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter whole_model_training::should_serve_shipped_scores_with_zero_add_ons_and_trained_scores_with_trained_ones_on_clef"
test-kev-whole-model-positive-control = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter whole_model_positive_control::should_learn_a_code_the_final_layers_cannot_on_kev"
test-clef-whole-model-positive-control = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter whole_model_positive_control::should_learn_a_code_the_final_layers_cannot_on_clef"
test-laya-whole-model-positive-control = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter whole_model_positive_control::should_learn_a_code_the_final_layers_cannot_on_laya"
test-kev-whole-model-training-speed = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter whole_model_training_speed::should_measure_kev_whole_model_training_speed"
test-clef-whole-model-training-speed = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter whole_model_training_speed::should_measure_clef_whole_model_training_speed"
test-laya-whole-model-training-speed = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter whole_model_training_speed::should_measure_laya_whole_model_training_speed"
test-clef-whole-model-pass-memory = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter whole_model_pass_memory::should_measure_clef_whole_model_pass_memory_by_text_length"
test-kev-whole-model-pass-memory = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter whole_model_pass_memory::should_measure_kev_whole_model_pass_memory_by_text_length"
test-kev-whole-model-layer-recomputation = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter whole_model_layer_recomputation::should_train_a_text_over_the_pass_budget_to_the_same_weights_in_less_memory_on_kev"
test-clef-whole-model-layer-recomputation = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter whole_model_layer_recomputation::should_train_a_text_over_the_pass_budget_to_the_same_weights_in_less_memory_on_clef"
# Text to speech: Kokoro-82M and Phonon 31M on MLX. `test-speech` runs the
# speech lib tests (shared layers, both families' layers on small weights from
# the Shakespeare fixture, the engines' request checks) in the speech crate,
# and the worker's speech tests in the serving crate; about a second, no
# installed model. `test-english-speech-text` runs the pure crates that turn
# text into what the models read: Kokoro's phonemes and spoken numbers, and
# the speech contract (request checks, PCM and WAV encoding). The two journeys
# load a real checkpoint and speak a Romeo and Juliet passage through the
# speech engine; pass `--configuration PATH` naming a JSON file whose
# `model_directory` is the model folder (Kokoro: config.json,
# kokoro-v1_0.safetensors, voices/; Phonon: config.json, model.safetensors,
# tokenizer.json, default-voice.safetensors) and, to keep the audio as WAV,
# an `evidence_directory`. A few seconds each; each prints every segment's
# time. `test-kokoro-reference-speech` (same configuration as Kokoro's) holds
# the port against the PyTorch reference recorded in
# `kokoro_reference_speech.json`: frames per token, pitch, energy and loudness;
# a few seconds. `generate_kokoro_reference_speech.py` beside the fixture
# says how to record it again. `test-speech-serving` runs how speech is
# served without a model: the daemon's speech admission (through the
# worker loop's shared request-kind admission, against the idle-worker
# fixture), events, model choice and `POST /v1/audio/speech`
# and IPC journeys (audio in bounded frames, refusals before dispatch), with
# scripted workers; under a minute. `test-speak-cli` runs `astronomical
# speak`'s own tests and its journeys against a stub daemon. The chat
# window's Speak button is not a cargo test: its text, piece, playback and
# button journeys are part of the web client's suite, `cd apps/thin-talk/web
# && npm test` (CI's thin-talk-web-tests step), which fakes the speech endpoint
# and Web Audio; only a rebuilt Development app can show real sound.
# That suite runs with a 1 GB heap limit (run-tests.mjs): it peaks near 600 MB,
# so `heap out of memory` there means one test is broken, usually a failing
# assert that was handed a DOM node, never that the limit is too low.
test-speech = "test -p speech -p model-serving --features speech/direct-mlx,model-serving/direct-mlx --lib speech"
test-english-speech-text = "test -p english-phonemes -p english-number-words -p speech-contract"
test-kokoro-speech = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter kokoro_speech"
test-kokoro-reference-speech = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter kokoro_reference_speech"
test-phonon-speech = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter phonon_speech"
test-speech-serving = "test -p astronomical-daemon --lib --test rest_api_tests --test integration_tests speech"
test-speak-cli = "test -p astronomical-cli speak"
# Laya latency on an optimized build: after one warmup request, the median of
# 20 requests with 1, 5 and 10 questions, each question filled to the
# checkpoint's own token limit (512 English, 1,024 multilingual). Decision
# models generate nothing, so this replaces the usual 10,000-in / 500-out
# measurement for them. It prints numbers and asserts no threshold; a few
# seconds after the build.
measure-laya-decision-latency = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --filter should_measure_laya_decision_latency_at_the_token_limit"
# Clef latency on an optimized build: after one warmup request, the median of
# 3 requests with 1, 5 and 10 questions, each a full 16,384-token sequence (a
# long Romeo and Juliet state cut to fit). It prints numbers, with progress
# and an ETA every 5 seconds, and asserts no threshold. Each line also carries
# the peak MLX memory the process has needed so far; the last one is what the
# catalog entry records as `approximate_memory_bytes`.
measure-clef-decision-latency = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 1800 --filter should_measure_clef_decision_latency_at_the_sequence_limit"
# Kev latency on an optimized build: after one warmup request, one request
# each with 1, 5 and 10 questions on a Romeo and Juliet state at Kev's
# 65,536-token state limit, with the state's prefill rate. It prints numbers,
# with progress and an ETA every 5 seconds, and asserts no threshold. Every
# request prefills the whole state, so the case budget is an hour, not the
# default two minutes. Each line also carries the peak MLX memory the process
# has needed so far; the last one is what a Kev catalog entry records as
# `approximate_memory_bytes`.
measure-kev-decision-latency = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 3600 --filter should_measure_kev_decision_latency_at_the_state_limit"
# The reads a Qwen3.5-based decision model (Kev, Clef) makes from the backbone
# (issue #2032 phase 6): final hidden states, output-projection rows, and
# question rows continued from a checkpointed state, each checked against the
# engine's own vocabulary head or an uninterrupted pass. `model_directory` is
# an MLX Qwen3.5 model; run it with a quantized and a bfloat16 build, whose
# output projections are read along different paths.
test-qwen-decision-readout = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter qwen_decision_readout"
# The Kev decision engine (issue #2032 phase 7) on a `cargo xtask convert-kev`
# output folder given as `model_directory`: an unambiguous question answered
# correctly, every question independent of the others, and the reference's
# state limit enforced.
test-kev-engine-requests = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter kev_engine_requests"
# Kev parity with Kev's reference scoring (issue #2032 phase 7) on a
# `cargo xtask convert-kev` output folder given as `model_directory`: every
# row's tokens identical, probabilities within 0.05 of the float32 reference.
# Regenerate a fixture with tests/fixtures/generate_kev_reference_decisions.py.
test-kev-reference-decisions = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter kev_reference_decisions"
# Clef parity with Clef's reference scoring (issue #2032 phase 8) on the
# `mlx-community/clef-flash-8bit` folder given as `model_directory`: the
# sequence's tokens identical, probabilities within 0.05 of a float32
# reference on the same weights. Regenerate the fixture with
# tests/fixtures/generate_clef_reference_decisions.py.
test-clef-reference-decisions = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --ignored --filter clef_reference_decisions"
# The decisions lane from the outside in (issue #2032): the `astronomical
# decide` verb against a stub daemon, POST /v1/systemone and the daemon IPC
# frame against scripted workers, the worker's decisions slot, and discovery
# of a Laya repository and the checkpoints it bundles. No model is loaded, so
# these run in the ordinary integration and REST lanes too; the aliases exist
# to run just this lane while working on it.
test-decide-verb = "test -p astronomical-cli decide"
test-decisions-daemon = "test -p astronomical-daemon --lib --test integration_tests --test rest_api_tests -- decisions system_one decision_model"
test-decisions-worker = "test -p model-serving --lib engine_backed_worker::tests::decisions"
test-laya-discovery = "test -p config --test integration_tests model_discovery::laya"

# Dense streaming speed ladder (issue #1985), on an optimized build with the
# weight files kept out of the macOS file cache: the raw layer read rate, one
# streamed layer, then 10,000 Shakespeare tokens in and 500 out at 0, 8, 16
# and 24 kept layers. Reads cold from the SSD for about 25 minutes, hence the
# one-hour case budget; decode prints progress with an ETA every five
# seconds, and each prefill, about eight seconds, prints when it ends.
measure-dense-streaming-speed = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test installed_model_contracts --release --ignored --case-budget-seconds 3600 --filter should_measure_dense_streaming_speed_from_the_layer_read_up"

# Quantization lanes (the OptiQ port in crates/tooling/quantization).

# The GPU encoder against the pure reference encoder and the shard-wise
# requantizer on synthetic sources (two bf16 shards, packed, fused, stacked,
# FP8); seconds, no model artifacts. Contracts are #[parallel] except the
# peak-memory one, which is #[serial] because MLX peak memory is
# process-global.
test-quantization-direct-mlx = "test --no-fail-fast -p quantization -p vision-tower --features direct-mlx --test direct_mlx"

# Real-model conversion, parity, and throughput journeys; append
# --configuration PATH containing model_directory and, for parity,
# reference_artifact_path.
test-quantization-acceptance = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test quantization --ignored"

# Parity with OptiQ on a real base: the structural conversion byte for byte,
# the calibration sequences token for token, the bit map from OptiQ's own
# sweep, and the Rust sweep's module ranking. Append --configuration PATH
# with model_directory (a bfloat16 source) and reference_artifact_path (what
# crates/tooling/quantization/tests/fixtures/build_optiq_reference_artifacts.py wrote
# from that source; build_optiq_parity_sources.py makes the source from an
# installed quantized model). The measured sweep forwards four calibration
# sequences and takes about three minutes on Qwen3.5 0.8B, hence the
# fifteen-minute case budget and the optimized build.
test-quantization-parity = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test quantization --release --ignored --case-budget-seconds 900 --filter python_parity"

# Mixture-of-experts probing on a synthetic model: the router and each
# routed-expert projection are swapped and exactly restored, and the measured
# sweep ranks modules like OptiQ's. Append --configuration PATH with
# model_directory (what build_optiq_synthetic_moe_source.py wrote with
# --tie-word-embeddings) and reference_artifact_path (what
# build_optiq_reference_artifacts.py --reference uniform_4bit --methods optiq
# --skip-low-bit wrote from it). Seconds, not minutes: the model is tiny.
test-quantization-mixture-of-experts = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test quantization --release --ignored --case-budget-seconds 900 --filter mixture_of_experts_sweep"

# Repository tooling as typed Rust; the subcommand catalog lives in the
# xtask sources. `cargo xtask app dev` rebuilds the Development app
# (incremental `app-dev` profile, icon and npm install reused from the previous build, ad-hoc
# signing) and swaps it in for the running one, opening it in front; `cargo
# xtask app dev --background` opens it behind every other window instead,
# without taking the keyboard, for rebuilding while working in another app;
# `cargo xtask app draft "<text>"` puts that text in the running Development
# chat's message field, also in the background and without sending it, so a
# question can be typed for a live check without taking the keyboard;
# `cargo xtask app export-to <absolute folder>` has that chat write its next
# export into the folder under its suggested name with no save panel, which
# would otherwise come to the front; it holds for one export;
# both link commands refuse when the Development app is not running, since
# a link would launch it in front;
# `cargo xtask app instance
# status|start|stop|restart` controls that instance headless; `stop` quits
# the chat app and the menu-bar agent, and `restart` reopens the agent (not
# the chat window) if it quit one; `cargo xtask
# app info-plist --channel development|stable|app-store [--agent]` prints the
# plist a channel's main app would get, or with `--agent` its menu-bar
# agent's, for inspecting the channel profiles. `cargo xtask app
# package --channel stable|app-store [--signing-identity NAME]` builds a
# release bundle from a clean commit in the disposable app-release lane, and
# `cargo xtask app smoke-test --app-bundle PATH [--real-model MODEL_ID]`
# launches a built bundle in isolation, then starts its menu-bar agent the
# way macOS does at login (service label as the first launch argument, root
# working directory) and requires the agent to bring the engine up. A
# store bundle is supported: its engine is started only through its agent,
# and the bundle should sit in the Applications folder, because from a build
# folder its sandboxed agent did not reach the engine. A store bundle carries
# no `astronomical` terminal command, which cannot be sandboxed, and both of
# its applications carry the privacy manifest.
# `cargo xtask release create-dmg --app-bundle PATH --output PATH` builds the
# drag-to-Applications image and `cargo xtask release validate-dmg --dmg PATH`
# proves a notarized image's install journey; `cargo xtask release
# validate-distribution-app` checks Developer ID signatures and `cargo xtask
# release notarize-dmg [--timeout-seconds N]` notarizes and staples an image;
# `cargo xtask release install-stable [--dry-run]` and `build-and-install-stable
# [--dry-run]` promote Stable to ~/Applications; `cargo xtask release
# app-store-pkg --app-bundle PATH --installer-identity NAME` wraps an App Store
# bundle in its signed installer package, and `cargo xtask release
# app-store-upload --package PATH --api-key ID --api-issuer ID [--upload]`
# asks App Store Connect to validate that package and sends it only with
# `--upload` (the API key's private half stays in
# ~/.appstoreconnect/private_keys); `cargo xtask release prepare-and-publish`
# and its credential-resolving front door `cargo xtask release prepare-signed`
# prepare a signed release locally and, with --publish, publish the reviewed
# directory; `cargo xtask release accept-sparkle-update` proves a signed
# update installs and relaunches and a corrupted one is rejected (release-only
# steps).
# `cargo xtask prewarm-native-build --profile core` builds the pinned native
# MLX runtime into the machine-wide store before Cargo compiles anything. On
# Linux it builds MLX's CPU backend instead of Metal (issue #2424); then
# `cargo build -p runtime-integration --features mlx` links against it (see
# docs/development.md, "Building and testing on Linux").
# `cargo xtask native-fingerprint --profile core [--target TRIPLE] [--explain]`
# prints that build's identity; `--cache-environment` prints it with its store
# entry directory as `$GITHUB_ENV` lines for workflows that save the entry to the `github_actions_cache`.
# `cargo xtask check-test-channel-isolation` fails when a package test tree
# reaches for Stable state, and `cargo xtask menu-contracts` runs the menu
# app's Swift contract tests with the Git credential helper cleared.
# `cargo xtask lint-acceptance-features` lints the acceptance crate's tests
# with every one of its features on; the pre-commit hook runs it on any
# staged Rust source, because no default-feature pass and no
# continuous-integration lane compiles those feature-gated journeys.
# `cargo xtask function-length-budget` is the pre-commit hook's workspace
# clippy pass for the 100-line function budget; on macOS it is exactly
# `cargo clippy --workspace --all-targets`, and on other hosts it leaves out
# crates whose manifest lists only macOS under `package.metadata.astronomical`
# `host-platforms`, and every workspace crate depending on them.
# `cargo xtask model-serving-default-features` is the hook's default-feature
# lint of model-serving and the crates split out of it, with the same host
# awareness; `cargo xtask lint-acceptance-features` skips on a host that
# cannot build the acceptance crate.
# `cargo xtask convert-laya --checkpoint DIRECTORY --output DIRECTORY` converts a
# PyTorch Laya checkpoint (model.safetensors, rl_agent_config.json,
# encoder/config.json, tokenizer/) into the MLX layout Astronomical serves:
# linear layers of the encoder and decision head quantized to 8 bits in groups
# of 32, temperatures moved into config.json, no local paths in any output file.
# Convert a bundled checkpoint such as `multilingual/` into a matching
# subfolder of the output, then run `cargo test-laya-reference-decisions` with
# the output folder as `model_directory` to compare it with the reference.
# `cargo xtask convert-kev --adapter DIRECTORY --base DIRECTORY --output DIRECTORY`
# folds a Kev LoRA adapter (adapter_model.safetensors, adapter_config.json,
# head.pt) into the Qwen3.5 base it names and writes the merged backbone in the
# base's own layout, the pointer head as kev_head.safetensors and its settings
# as kev_decision.json. It refuses a base snapshot whose revision differs from
# the one head.pt was trained on; run `cargo test-kev-engine-requests` with the
# output folder as `model_directory` to check it answers.
# `cargo xtask vendor-thin-talk-assets [--verify-only]` vendors and verifies the
# Thin Talk canvas's pinned offline web assets.
# `cargo xtask provision-bindgen-headers [--verify-headers]` extracts the
# pinned, patched MLX and MLX-C headers for bindgen (prewarm runs it first). `cargo xtask audit-test-declarations` walks every crate's
# tests/ tree and fails when a test file is unreachable from any target
# through `mod` declarations (the class of silent-orphan bug that once hid
# seven tests in an undeclared file). `cargo xtask test-run` builds exact
# Cargo executables and
# runs each selected test in its own process, with a 120-second budget
# (--case-budget-seconds replaces it for inherently long measurements),
# five-second progress, and retained manifests/logs under target/test-runs;
# serving measurements must use this runner.
#
# Function-length and complexity enforcement (issue #1637) is pre-commit
# territory ONLY (policy, 2026-10-31): the hook's clippy pass denies
# clippy::too_many_lines (the 100-line budget, #[expect]-tracked debt) and
# `cargo xtask crap-baseline` ratchets complexity against the
# crap-baseline.json committed at HEAD as a hard failure: a baseline function
# may not grow, and a function the baseline does not list yet may not exceed
# cyclomatic complexity 15 unless crap-admissions.json names it with a
# reason. `cargo xtask crap-baseline --write` regenerates the baseline from
# the current tree only after that check passes, so a plain commit cannot
# raise a baseline entry and grow its function together (an amend, rebase or
# squash can; the module doc lists what the gate cannot see).
# `cargo xtask crap-baseline --against origin/main`, run by the pre-push hook,
# judges the tree against main's baseline instead, catching a branch built on
# an older one. GitHub Actions runs both this ratchet and check-duplication
# on the Linux config-contracts lane against HEAD^1, as the backstop for a
# checkout whose hooks did not run; it runs no clippy.
#
# `cargo xtask check-duplication [--write] [--against REF] [--top N]` is the
# duplication ratchet of issue #2473 over duplication-baseline.json. A code
# line counts as repeated when it sits in a run of at least six consecutive
# code lines (blank and `//` lines dropped, whitespace trimmed, model-family
# names such as Resident/Streaming or Kev/Clef/Laya masked) that also appears
# in another file under crates/, apps/, verification/ or xtask/. Production
# and test files are counted apart, and it prints the area pairs and file
# pairs that hold the most repeated lines (`--top N`, default 15). Each count
# may stay or go down against the baseline committed at HEAD (pre-commit) or
# at `--against origin/main` (pre-push), and the config-contracts lane runs it
# against HEAD^1; `--write` records lower counts, and only after that check
# passes. It runs in about three seconds.
#
# `cargo xtask commit-identity --staged` (pre-commit) and
# `cargo xtask commit-identity --pre-push` (pre-push, reads git's ref lines on
# stdin) refuse author, committer, and Co-authored-by emails that are not safe
# to publish: only the numeric `<id>+<login>@users.noreply.github.com` form,
# GitHub-owned addresses, `noreply@` service addresses, and reserved fixture
# domains pass. A login-only no-reply address is refused because GitHub
# credits it to whichever stranger owns that login.
#
# `cargo xtask opencode-plugin-release-check opencode-plugin-vMAJOR.MINOR.PATCH`
# refuses an OpenCode plugin release whose tag, integrations/opencode/package.json
# version and CHANGELOG.md heading disagree. With --require-on-main it also
# refuses a checked-out commit that is not on origin/main; the npm publish
# workflow always passes it (scripts/release/opencode-plugin.md).
#
# The Astronomical skill shipped with the app lives in skill/astronomical (see
# skill/README.md). `cargo test -p astronomical-cli --test integration_tests
# astronomical_skill` checks it against the CLI's help: every command, subcommand
# and flag it names must exist, every reference file must be linked from
# SKILL.md, and SKILL.md stays under its line budget. The engine compiles the
# skill in and writes it to the instance's state folder at every start;
# `cargo test -p astronomical-daemon --lib astronomical_skill` checks that its
# compiled-in file list matches skill/astronomical and that install, refresh
# and repair work, and that an update from the website installs, is refused
# when incomplete, and survives a restart.
# `cargo xtask skill-site` publishes the skill to site/skill with a manifest
# (version, oldest suitable app version, a SHA-256 per file) that installed
# apps read about once a day; `cargo xtask skill-site --check` changes nothing
# and fails when the published copy differs from skill/astronomical.
#
# `cargo xtask replay-expert-misses EVIDENCE_DIRECTORY` (alias
# `cargo replay-expert-misses`) replays the replies `measure-expert-misses`
# recorded under each astro_expert_cache keeping rule; see that alias.
#
# `cargo xtask site-layout` writes the one shared header and footer, defined
# in xtask/src/site_layout/site_header_and_footer.rs, into every page under site/; edit
# the menu there, never in a page. `cargo xtask site-layout --check` changes
# nothing and fails on a page whose copy differs; the Configuration contracts
# CI job runs it.
#
# `cargo xtask check-site-links` fails when a relative href or src in any
# page under site/ names a file that is not published with it (links that
# leave the site are not fetched); the same CI job runs it.
#
# `cargo xtask model-loading-changed PREVIOUS_TAG` prints
# `MODEL_LOADING_UNCHANGED=0` when nothing that loads models changed since
# that tag and `=1` when something did, for the release skill's round trip
# gate. The watched folders come from `cargo metadata`: every local crate the
# inference worker reaches through normal or build dependencies, plus the
# paths in xtask/src/model_loading_changed.rs that still change what a model
# loads (the quantizer, the vision tower, the native build tool, the
# third-party pins and patches, the registry), so a split or renamed crate
# can never drop out of the gate. It lists every watched folder first.
#
# `cargo xtask install-verification-tools [--prefix DIR]` installs the pinned
# cargo-about and sccache prebuilts, SHA-256 verified, into DIR (default
# `$CARGO_HOME/bin`), and skips any binary already reporting its pinned
# version. CI points DIR at a folder restored from the `github_actions_cache` so warm runs download nothing.
#
# `cargo xtask usage-report [--repo owner/name] [--catalog PATH]` prints what
# public numbers say about who uses Astronomical (issue #2413, phase 0):
# installer downloads per release grouped by week, the repository's stars,
# forks and 14-day traffic, and Hugging Face downloads for every model in
# registry/download_catalog.json. It reads GitHub through the signed-in `gh`
# CLI (traffic needs write access) and Hugging Face through `curl`, prints
# progress to standard error, and ends each table with what its numbers can
# and cannot tell. `cargo test -p xtask --bin xtask usage_report` runs its
# tests, which use recorded answers and never the network.
# `cargo xtask small-mac-matrix [--base-url URL] [--model ID]... [--mac-gb N]...`
# finds out how models behave on Macs smaller than this one (issue #2413).
# Against the Development instance only, for each model and each simulated
# Mac (8, 16, 24 and 32 GB unless --mac-gb names others) it unloads the
# model, sets the memory limit that Mac would get (two thirds of its memory,
# an approximation), asks for 8 tokens and records the outcome and time, then
# puts the limit back. It loads real models on the GPU, so check that
# Development is idle first and name one small model with --model for a short
# run. `cargo test -p xtask --bin xtask small_mac_matrix` runs its tests,
# which never touch an instance.
# `cargo xtask measure-speed [--base-url URL] [--temperature T] [--measured-on TEXT]
# [--reference-set] [--write-ledger] [--write-catalog] [MODEL_ID...]` measures
# how fast models reply. Against the Development instance only. A case (a
# model under one memory limit) is warmed up once, then writes an essay
# (temperature 1.0) and code (0.7) after a short and a long prompt, 200
# tokens out, one reply a task: repeating every task three times made the
# reference set about ten minutes of waiting for nothing one reply did not
# say. Name the MODEL_IDs in question rather than running the whole set. It
# keeps prompt reading, the first token and the reply as
# a median with its range. A model that drafts writes one unmeasured reply
# first. --temperature T sets one temperature for all. --reference-set
# measures the cases in registry/release_speed/reference_set.json (narrowed
# to any MODEL_IDs named), setting each case's memory limit and restoring
# the engine's own afterwards; a long prompt is 5,000 tokens unless the
# case sets long_prompt_tokens (the dense 27B reads about 330 tokens a
# second and uses 1,000). A case whose model is missing or whose limit the
# Mac refuses is reported and skipped. --write-ledger writes them into
# registry/release_speed/<version>.json, the release speed ledger for the
# engine's version (a clean build only), with the conditions the engine
# reported: memory limit, weights in memory or streamed, drafter in use, and
# for a task whose replies drafted, the rounds a reply, the drafts kept a
# round and the share of the reply that was kept drafts; and the most MLX
# memory a reply had in use, read from the engine's status after each reply.
# --write-catalog writes the cases measured at the Mac's own memory limit
# into registry/download_catalog.json as each entry's measured_speed, which
# the Models page shows. Progress and time left print every five seconds;
# the whole reference set takes about three minutes. It refuses to start until
# Development's config.json sets "ssd_prompt_cache": {"enabled": false} and
# "skill": {"declare_to_models": false} (restart it after editing, and put
# them back afterwards). It loads real models on the GPU, so check
# Development and Stable are idle first.
# `cargo xtask release-speed-table [--previous VERSION|FILE --current VERSION|FILE]`
# prints the "Speed" section of a release's notes from two ledgers (the two
# newest when none is named); `cargo xtask release-speed-table --check-catalog`
# fails when the catalog's measured speeds differ from the newest ledger's.
# `cargo test -p xtask --bin xtask -- measure_speed release_speed` runs their
# tests, which never touch an instance.
# Test impact selection (CI only): `cargo xtask classify-scope` publishes
# rust_test_selection for a pull request (`all`, `none`, or the affected
# packages: those owning a changed file or reading it from outside their
# folder, plus every package depending on them), and the macOS build runs
# `cargo xtask selected-cargo --selection VALUE ALIAS [ARGUMENT ...]`, which
# runs a lane alias with its -p packages and --test targets narrowed to that
# selection, or skips it when nothing is left. Any path it cannot place, a
# manifest, Cargo.lock, .cargo/ or native inputs selects `all`; the default
# branch always runs `all`. `cargo test -p xtask --bin xtask
# rust_test_selection` runs its tests.
xtask = "run -p xtask --"

# Compile the whole workspace across ALL targets without running anything;
# the pre-push gate. Run `cargo verify` before every push.
verify = "check --workspace --all-targets"

# Visibility audits (issue #1355). Output is a candidate list, never a
# verdict: confirm any candidate by hand (`git grep -wn "<name>" -- '*.rs'`)
# before changing visibility, and run them from a checkout with no nested
# copy of these sources, or the audit reports zero from self-matches.
audit-unused-public-bins = "clippy --workspace --bins -- -A clippy::all -D dead_code_pub_in_binary"
audit-unused-public-workspace = "workspace-unused-pub"

# Acceptance lanes: one alias per GPU lane, so the packages, features,
# targets, and the serial rule cannot be forgotten.

# Every acceptance test that takes the shared GPU guard claims Metal wired
# residency once per process, as the serving worker does at startup, and
# prints `[direct-mlx-test] wired_residency_claim=...`; without the claim,
# macOS may compress a large model's weights and a speed number means nothing.

# The model-serving direct-MLX contract suite plus the runtime-integration
# MLX-C coverage bridge contract (CPU-only) so bridge drift fails the lane.
test-direct-mlx = "xtask lane-cargo test-direct-mlx"

# Every native memory-contract phase in one bounded invocation; the probe
# binary must exist first (see check-mlx-memory-contract).
# MLX-only memory-fill speed probe (issue #2221): fills MLX with plain tables
# to a target, then times the same step (gathers, multiplies and page writes
# into small tables), with no Astronomical engine code. MLX fixes its limit
# once per process, so pass one test per run after `--exact`. The sweep
# raises the fill a tenth of a gigabyte at a time under a 36.5 GB limit and
# prints the memory macOS has wired across the whole system beside each:
#   cargo measure-memory-fill-speed memory_fill_speed_probe::should_time_fixed_work_as_the_fill_rises_from_34_5_to_36_gb_under_a_36_5_gb_limit
# The single fills are 35 GB/33.5, 36 GB/34.7, 36.5 GB/35.3 and 36.5 GB/34.7
# held (`should_time_fixed_work_at_a_..._limit_holding_..._gb`). Needs the
# GPU free; each run takes under a minute.
measure-memory-fill-speed = "test --release -p astronomical-acceptance --features direct-mlx,mlx-memory-contract-probe --test memory_contracts -- --ignored --nocapture --test-threads=1 --exact"

test-mlx-memory = "test --no-fail-fast -p astronomical-acceptance --features direct-mlx,mlx-memory-contract-probe --test memory_contracts -- --ignored --test-threads=1"

# Compile-only drift gate for the mlx-memory-contract-probe feature world,
# which sits off every routine graph; API moves under it are caught here in
# seconds instead of silently drifting.
check-mlx-memory-contract = "check -p runtime-integration --features mlx-memory-contract-probe --all-targets"

# The whole real-model acceptance package, one selected case per process;
# append --configuration PATH for explicit model/evidence inputs and
# --filter NAME to narrow the journeys. Performance measurements are left out
# on purpose (no performance-measurement feature): they compare strategies on
# demand and only record numbers, so they belong in `cargo measure-paged-prefill`,
# not in every regression pass.
test-acceptance = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx,serving-acceptance,expert-paging,performance_throughput,mlx,mlx-memory-contract-probe --tests --release --ignored"

# On-demand paged-prefill performance measurements (prefill chunk size and
# back-to-back residency churn on the large sparse model; issues #1716 and
# #1717). Each case loads the real model, so run them only when comparing
# strategies; append --filter NAME to pick cases.
# A drafted block rewound to its kept rows leaves the target exactly where
# forwarding only those rows would (small dense Qwen3.5 from the Development
# library, every kept count 1 to 7, plus a control without the rewind). Seconds.
test-drafted-rewind = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test direct_mlx --release --ignored --filter drafted_rewind"
# A draft tree verified in one pass on the small dense Qwen3.5: every row's
# logits match feeding its chain alone, committing a branch leaves the state
# feeding that branch leaves, and a control that commits the other branch
# differs. Seconds.
# `test-streaming-draft-tree-verification` is the same contract on the
# streaming model, whose layer step and evaluation differ: every row's logits
# match feeding its chain alone there, and committing a branch leaves the
# streamed state feeding that branch leaves. Seconds. With --configuration
# PATH naming a model_directory it also runs the contract on that model,
# holding each row to that model's own rounding between a three-token chunk
# and single tokens (1.6 on a 35B-A3B, whose wrong-branch control moves 3.6).
test-streaming-draft-tree-verification = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test direct_mlx --release --ignored --filter _streamed_"
test-draft-tree-verification = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test direct_mlx --release --ignored --filter draft_tree_verification"
# Gate 2 baseline: where one DFlash2 draft-and-verify round's time goes on the
# real 27B pair (drafter, draft head, selector, 8-row verify, readback, rewind)
# beside a plain one-row step. Each stage is timed alone. Asserts nothing;
# about 10 seconds after the pair loads. Same installed package as the Gate 1 alias.
measure-dflash2-round-cost = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test direct_mlx --release --ignored --filter dflash2_round_cost"
# Gate 1 of speculative decoding on the dense Qwen3.8 27B: tokens kept per
# verify round by the DFlash2 drafter on the real pair: the installed 27B
# package with its drafter inside (`dense_drafting` in
# registry/e2e_test_model_names.json, resolved through Development's library;
# `--configuration PATH` names another). Code at 0.7, chat at 1.0, greedy as a diagnostic;
# floors sit about 10% under z-lab's reference (6.07 and 3.00). Needs about
# 22 GB of free memory; about one minute.
measure-dflash2-kept-per-round = "run -p xtask -- test-run --package astronomical-acceptance --features direct-mlx --test direct_mlx --release --ignored --filter dflash2_kept_per_round"
# Gate 4's first measurement: kept per round if each round verified
# TensorFold's draft tree (15 nodes, 4 children) instead of one path, on the
# code-completion and chat cells, greedy and keyed-sampled (0.7 and 1.0).
