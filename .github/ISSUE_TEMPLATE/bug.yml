name: Bug report
description: Report reproducible incorrect Astronomical behavior
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste credentials, prompts, personal paths, local model inventories, proprietary model files, or unredacted logs.
  - type: textarea
    id: report
    attributes:
      label: What happened?
      description: Describe the problem in your own words.
    validations:
      required: true
