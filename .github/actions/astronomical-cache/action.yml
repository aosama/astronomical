name: 'Astronomical github_actions_cache with restoration report'
description: 'Restores or saves one named Astronomical entry of the github_actions_cache and reports its key classification and outcome in the action log and the job summary, so every restore or save stays attributable.'

inputs:
  operation:
    description: 'Whether to restore or save this github_actions_cache entry.'
    required: true
  owner:
    description: 'Lowercase hyphenated owner of this github_actions_cache entry, used in the restoration report.'
    required: true
  path:
    description: 'Paths to save into or restore from the github_actions_cache.'
    required: true
  key:
    description: 'Primary github_actions_cache key.'
    required: true
  restore-keys:
    description: 'Fallback restore-key prefixes.'
    required: false
    default: ''

outputs:
  cache-hit:
    description: 'Whether the restore operation hit a github_actions_cache key.'
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-matched-key:
    description: 'Exact github_actions_cache key matched by the restore operation.'
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    - name: Restore from the github_actions_cache
      id: restore
      if: ${{ inputs.operation == 'restore' }}
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs['restore-keys'] }}
    - name: Save to the github_actions_cache
      id: save
      if: ${{ inputs.operation == 'save' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
    - name: Report github_actions_cache operation
      id: report
      # Skip the report when the operation step was skipped (a save gated on a
      # prior github_actions_cache hit): no report for operations that never ran.
      if: ${{ inputs.operation == 'restore' && steps.restore.outcome != 'skipped' || inputs.operation == 'save' && steps.save.outcome != 'skipped' }}
      shell: bash
      env:
        CACHE_OWNER: ${{ inputs.owner }}
        CACHE_OPERATION: ${{ inputs.operation }}
        # The classification is decided here, as an expression, so the report
        # needs no script: it runs before any toolchain exists, including for
        # the xtask binary's own restore. A save is published or an error; a
        # restore whose step failed is an error, an exact hit on the primary
        # key is primary, a hit on a restore-keys prefix is fallback, and
        # anything else is a miss. `&&` binds tighter than `||`, and every
        # label is a non-empty string, so the first matching branch wins.
        CACHE_CLASSIFICATION: ${{ inputs.operation == 'save' && (steps.save.outcome == 'success' && 'published' || 'error') || steps.restore.outcome != 'success' && 'error' || steps.restore.outputs.cache-hit == 'true' && 'primary' || steps.restore.outputs.cache-matched-key != '' && 'fallback' || 'miss' }}
        CACHE_PRIMARY_KEY: ${{ inputs.key }}
        CACHE_MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key || 'none' }}
      # How long the operation took is on the run timeline (the timeline job
      # in ci.yml), which reads GitHub's own step records.
      run: |
        printf '[build-cache] owner=%s operation=%s classification=%s primary_key=%s matched_key=%s\n' \
          "$CACHE_OWNER" "$CACHE_OPERATION" "$CACHE_CLASSIFICATION" "$CACHE_PRIMARY_KEY" "$CACHE_MATCHED_KEY"
        printf -- '- github_actions_cache %s %s: `%s` (primary key `%s`, matched key `%s`)\n' \
          "$CACHE_OWNER" "$CACHE_OPERATION" "$CACHE_CLASSIFICATION" "$CACHE_PRIMARY_KEY" "$CACHE_MATCHED_KEY" \
          >> "$GITHUB_STEP_SUMMARY"
