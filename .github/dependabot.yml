version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One grouped weekly pull request instead of one pull request per crate:
    # every separate bump has to clear the full CI matrix and the
    # up-to-date-with-base branch rule on its own, which serializes four
    # green bumps into hours of waiting.
    groups:
      rust-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    # idna_adapter 1.2.x migrates to the ICU4X 2.x stack (which pulls in
    # displaydoc -> syn 3.0.3); that re-resolves bindgen 0.73.2's `syn`
    # dependency from 3.0.3 to 2.0.119 and breaks its syn::parse_quote! macro
    # in the mlx-c native build (bindgen is a transitive build-dependency of
    # mlx-c-rust). Ignore its minor/major bumps until bindgen is robust to the
    # ICU4X resolution; patch updates still flow.
    ignore:
      - dependency-name: idna_adapter
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # tower-http is held at the version reqwest resolves, so it compiles
      # once instead of twice. A 0.x minor bump is the breaking one; lift
      # this once reqwest moves to the newer tower-http.
      - dependency-name: tower-http
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
  # Verification-tool pins (sccache, cargo-about) live as exact `=X.Y.Z`
  # dependencies of a never-built crate so this entry can bump them; the
  # installer and the notices check read those exact versions. No
  # versioning-strategy is set: Cargo accepts only `auto` and
  # `lockfile-only`, and `auto` on this lockfile-free crate bumps a
  # requirement only when the new release falls outside it, which an exact
  # `=X.Y.Z` pin always does, rewriting it to the new exact version rather
  # than widening it. The cooldown gives a fresh release a week before it is
  # proposed, as supply-chain protection for binaries CI executes. A
  # cargo-about bump can change the generated license notices; the nightly
  # notices-freshness lane flags that within a day.
  - package-ecosystem: cargo
    directory: /third-party/tool-pins
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      verification-tools:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
