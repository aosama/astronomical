version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One grouped weekly pull request instead of one pull request per crate:
    # every separate bump has to clear the full CI matrix and the
    # up-to-date-with-base branch rule on its own, which serializes four
    # green bumps into hours of waiting.
    groups:
      rust-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    # idna_adapter 1.2.x migrates to the ICU4X 2.x stack (which pulls in
    # displaydoc -> syn 3.0.3); that re-resolves bindgen 0.73.2's `syn`
    # dependency from 3.0.3 to 2.0.119 and breaks its syn::parse_quote! macro
    # in the mlx-c native build (bindgen is a transitive build-dependency of
    # mlx-c-rust). Ignore its minor/major bumps until bindgen is robust to the
    # ICU4X resolution; patch updates still flow.
    ignore:
      - dependency-name: idna_adapter
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
