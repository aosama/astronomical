name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify code and static-only changes
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '[ci-change-detection] status=start event=%s started_at=%s\n' "$EVENT_NAME" "$started_at"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'code_changed=true\n' >> "$GITHUB_OUTPUT"
            printf '[ci-change-detection] status=complete classification=manual_run code_changed=true\n'
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PULL_REQUEST_BASE_SHA"
            head_sha="$PULL_REQUEST_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$CURRENT_SHA"
          fi

          if [ -z "$base_sha" ] || [ -z "$head_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            printf 'code_changed=true\n' >> "$GITHUB_OUTPUT"
            printf '[ci-change-detection] status=complete classification=unknown_history code_changed=true\n'
            exit 0
          fi

          changed_files_path="$(mktemp)"
          trap 'rm -f "$changed_files_path"' EXIT
          git diff --name-only "$base_sha" "$head_sha" > "$changed_files_path"
          changed_file_count="$(wc -l < "$changed_files_path" | tr -d '[:space:]')"
          code_changed=false

          while IFS= read -r changed_path; do
            case "$changed_path" in
              site/*|*.md|.github/assets/*|.github/workflows/pages.yml)
                ;;
              *)
                code_changed=true
                break
                ;;
            esac
          done < "$changed_files_path"

          printf 'code_changed=%s\n' "$code_changed" >> "$GITHUB_OUTPUT"
          printf '[ci-change-detection] status=complete classification=%s changed_files=%s\n' \
            "$([ "$code_changed" = true ] && printf code_or_build || printf static_only)" \
            "$changed_file_count"

  verify:
    if: ${{ needs.detect-changes.outputs.code_changed == 'true' }}
    needs: detect-changes
    name: 10-minute macOS hermetic verification
    runs-on: macos-26
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: astronomical-ci-v1
    # Keep the required status-check name stable; extra job time covers cache restore and save.
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install and configure sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.17.0
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-downloads-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-downloads-v1-
      - name: Restore verified native dependency archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Astronomical/native-dependencies
          key: ${{ runner.os }}-${{ runner.arch }}-native-dependencies-v1-${{ hashFiles('third-party/native-dependency-manifest.cmake', 'third-party/pins/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-native-dependencies-v1-
      - name: Install verification tools
        run: |
          case "$(brew tap)" in
            *aws/tap*) brew untap aws/tap ;;
          esac
          brew install cargo-about
      - name: Verify Rust dependency notices
        run: scripts/generate-rust-dependency-notices.sh --check
        timeout-minutes: 2
      - name: Provision verified native dependencies
        run: scripts/bootstrap-native-dependencies.sh
      - name: Set maximum parallel build jobs
        run: |
          printf 'CARGO_BUILD_JOBS=%s\n' "$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"
          sccache --zero-stats
      - name: Compile hermetic tests
        run: cargo test --profile ci --timings --no-fail-fast --no-run -p astronomical-config -p astronomical-ipc-protocol -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-supervisor --test hermetic_tests
        timeout-minutes: 7
      - name: Report CI artifact footprint
        run: |
          printf '%s\n' '[ci-artifacts] status=start profile=ci'
          du -sh target/ci target/cargo-timings
          debug_symbol_bundle_path="$(find target/ci -type d -name '*.dSYM' -print -quit)"
          if [ -n "$debug_symbol_bundle_path" ]; then
            printf 'Error: CI profile produced a debug-symbol bundle: %s\n' "$debug_symbol_bundle_path" >&2
            exit 1
          fi
          printf '%s\n' '[ci-artifacts] status=success d_sym_bundle_count=0'
      - name: Upload Cargo timing report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/cargo-timings
          if-no-files-found: warn
          retention-days: 7
      - name: Run hermetic tests
        run: cargo test --profile ci --no-fail-fast -p astronomical-config -p astronomical-ipc-protocol -p astronomical-runtime-integration -p astronomical-model-serving -p astronomical-inference-worker -p astronomical-supervisor --test hermetic_tests -- --test-threads "$(sysctl -n hw.logicalcpu)"
        timeout-minutes: 2
      - name: Print compiler cache statistics
        run: sccache --show-stats
        if: always()
