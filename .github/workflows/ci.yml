name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin the macOS toolchain VERSION so the native-build and Swift toolchain
  # identities stop moving whenever GitHub rolls the runner image: xcodebuild,
  # xcrun (the sdk and clang probes), and swift all honor DEVELOPER_DIR, and
  # the assert step resolves this version to an installed Xcode and exports
  # DEVELOPER_DIR for every later step of both macOS jobs. The resolution
  # accepts the readme's primary and alias layout (Xcode_<v>.app and
  # Xcode_<v>.0.app) because the deployed alias layout has drifted from the
  # readme's primary column (live in the 0.2.70-era rollout); the identity
  # probes hash toolchain outputs, not paths, so either alias yields the same
  # identity and the mixed fleet converges on one cache key. Bump procedure:
  # pick a version from the current image readme's Xcode table, update this
  # one value, and expect exactly one deliberate native and SwiftPM cache
  # rebuild; the assert step fails the job loudly — printing the image's
  # installed Xcode inventory — once the image no longer ships the pinned
  # version, forcing that bump to be intentional instead of a surprise
  # five-minute native rebuild. Linux jobs inherit the variable and simply
  # never read it.
  ASTRONOMICAL_PINNED_XCODE_VERSION: "26.6"

jobs:
  detect-changes:
    name: Classify changed files
    runs-on: ubuntu-24.04
    # The classifier compiles xtask first, and a hosted image without the
    # pinned toolchain makes rustup download it before that compile; the cap
    # covers both plus the policy contracts, with margin for a cold registry.
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
      native_inputs_changed: ${{ steps.classify.outputs.native_inputs_changed }}
      macos_verification_required: ${{ steps.classify.outputs.macos_verification_required }}
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify code and static-only changes
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: cargo run --quiet -p xtask -- classify-scope
      - name: Run pull request policy contracts
        run: node --test --test-reporter=spec .github/scripts/pull-request-issue-compliance.test.js .github/scripts/pull-request-issue-compliance-publish.test.js
        timeout-minutes: 2

  # The merge gate keys on the "CI verdict" fan-in job below, not on this
  # job's name: this job may split or rename without branch-protection
  # coordination. Keep the concurrency group's cache owner set in
  # scripts/ci/tests/test-ci-native-cache-coordination.sh in sync.
  rust-core:
    if: ${{ always() && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.macos_verification_required == 'true') }}
    needs: detect-changes
    # Descriptive job name, duration-free: the runtime cap lives in
    # timeout-minutes below, never here, so the name can't silently drift
    # from reality. The merge gate keys on the CI verdict, so renaming this
    # job no longer touches branch protection.
    name: macOS integration verification
    runs-on: macos-26
    # Job permissions replace the workflow-level set: pruning surplus caches
    # needs actions:write while everything else stays read-only.
    permissions:
      contents: read
      actions: write
    concurrency:
      group: macos-integration-${{ github.event_name }}-${{ github.ref }}
      # Never cancel an in-flight required check. A cancelled run with this job
      # name blocks merge even when a later run on the same SHA is green.
      cancel-in-progress: false
    # Restore, verification, and publication all remain inside the cost boundary.
    # The cap must cover a cold native rebuild: a new native identity (new
    # fingerprint policy, third-party bump, schema bump) pays a full CMake MLX
    # build (~360s at the hosted runners' three native jobs) before cargo even
    # starts. Cold native (~360s) + cold compile (~300s) + tests and overhead
    # (~180s) ≈ 840s. Cache pruning keeps entries under the eviction threshold,
    # so cold runs are rare; the cap is a safety net, not the fix.
    timeout-minutes: 15
    env:
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
    steps:
      - name: Configure step timing attribution
        run: |
          printf 'ASTRONOMICAL_CI_TIMING_FILE=%s/astronomical-ci-step-timings.csv\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          # The runtime-integration build script declares rerun-if-env-changed
          # for this variable, so exporting it in only the compile step flips
          # the build script's fingerprint for every later cargo invocation and
          # re-runs the script (one of two rebuild triggers fixed together:
          # the other, a phantom rerun-if-changed path, is removed in that
          # build script). Exporting it once here, before the first cargo step
          # of the job, keeps every build-script run under an identical
          # environment; the compile step still tails the file for live
          # native-build progress.
          printf 'ASTRONOMICAL_NATIVE_BUILD_PROGRESS_FILE=%s/astronomical-native-build-progress\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/astronomical-native-build-progress"
      - name: Require successful change classification
        if: ${{ needs.detect-changes.result != 'success' }}
        run: |
          printf '%s\n' 'Error: required macOS verification could not classify the changed content' >&2
          exit 1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Assert pinned Xcode toolchain
        run: |
          set -euo pipefail
          pinned_xcode_version="$ASTRONOMICAL_PINNED_XCODE_VERSION"
          resolved_developer_dir=""
          for xcode_bundle_candidate in \
            "/Applications/Xcode_${pinned_xcode_version}.app" \
            "/Applications/Xcode_${pinned_xcode_version}.0.app"; do
            if [ -x "$xcode_bundle_candidate/Contents/Developer/usr/bin/xcodebuild" ]; then
              resolved_developer_dir="$xcode_bundle_candidate/Contents/Developer"
              break
            fi
          done
          if [ -z "$resolved_developer_dir" ]; then
            printf '%s\n' "Error: this runner image ships no Xcode matching the pinned version ${pinned_xcode_version}." >&2
            printf '%s\n' 'Error: installed Xcode applications on this image:' >&2
            ls -d /Applications/Xcode*.app >&2 || true
            printf '%s\n' 'Error: pick an installed version and update the workflow-level ASTRONOMICAL_PINNED_XCODE_VERSION pin.' >&2
            exit 1
          fi
          export DEVELOPER_DIR="$resolved_developer_dir"
          printf 'DEVELOPER_DIR=%s\n' "$resolved_developer_dir" >> "$GITHUB_ENV"
          printf '[pinned-xcode] status=verified developer_dir=%s version=%s\n' \
            "$resolved_developer_dir" "$pinned_xcode_version"
          xcodebuild -version
          pinned_sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          printf '[pinned-xcode] sdk_version=%s\n' "$pinned_sdk_version"
      # The Swift toolchain identity is resolved in swift-node instead: this
      # job no longer compiles Swift, and GitHub Actions does not share
      # GITHUB_ENV across jobs.
      - name: Restore cargo-downloads-cache
        id: cargo-downloads-cache
        uses: ./.github/actions/astronomical-cache
        with:
          operation: restore
          owner: cargo-downloads
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: astronomical-v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            astronomical-v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      # Runs after the registry restore so the xtask compile below reuses the
      # cached dependency downloads instead of hitting crates.io cold.
      - name: Compute the native build identity cache key
        id: native-build-identity
        shell: bash
        run: |
          set -euo pipefail
          trap 'scripts/ci/ci-step-timing.sh end native-build-identity' EXIT
          scripts/ci/ci-step-timing.sh begin native-build-identity
          started_at_seconds="$(date +%s)"
          printf '[native-build-identity] status=start\n'
          native_identity_file="$RUNNER_TEMP/astronomical-native-identity"
          # --explain logs each toolchain probe value and its source to stderr,
          # so a native-cache identity flap is attributable from the run log
          # instead of by diffing runner images.
          cargo run --quiet -p xtask -- native-fingerprint --explain --target aarch64-apple-darwin --profile core > "$native_identity_file"
          native_build_identity="$(tr -d '[:space:]' < "$native_identity_file")"
          case "$native_build_identity" in
            ''|*[!0-9a-f]*) printf '%s\n' 'Error: native build identity is invalid' >&2; exit 1 ;;
          esac
          [ "${#native_build_identity}" -eq 64 ] || {
            printf '%s\n' 'Error: native build identity length is invalid' >&2
            exit 1
          }
          native_build_store_directory="$HOME/Library/Caches/Astronomical/native-builds"
          native_store_schema_version="$(tr -d '[:space:]' < crates/runtime-integration/build-orchestration/native-build-store-schema-version)"
          case "$native_store_schema_version" in
            ''|*[!0-9]*) printf '%s\n' 'Error: native store schema version is invalid' >&2; exit 1 ;;
          esac
          native_build_entry_directory="$native_build_store_directory/v$native_store_schema_version/entries/$native_build_identity"
          native_build_status_file="$RUNNER_TEMP/astronomical-native-build-status"
          {
            printf 'NATIVE_BUILD_IDENTITY=%s\n' "$native_build_identity"
            printf 'NATIVE_BUILD_ENTRY_DIRECTORY=%s\n' "$native_build_entry_directory"
            printf 'ASTRONOMICAL_NATIVE_BUILD_STORE_DIR=%s\n' "$native_build_store_directory"
            printf 'ASTRONOMICAL_NATIVE_BUILD_STATUS_FILE=%s\n' "$native_build_status_file"
            printf 'SCCACHE_DIR=%s\n' "$HOME/Library/Caches/Astronomical/sccache"
            printf '%s\n' 'RUSTC_WRAPPER=sccache'
            # Cap the disk cache so one generation cannot outgrow the 10 GB
            # repository cache budget or the one-minute cache segment timeout;
            # sccache enforces the cap on writes and every default-branch build
            # writes new artifacts, so this is the proactive enforcement point:
            # the cache cannot grow past the cap while compiling. The cap must
            # exist before the first server start because sccache reads it once
            # at startup. sccache parses the value as a binary multiple, so
            # 400M budgets 0.419 decimal GB of tracked entries: enough headroom
            # below the decimal 0.45 GB entry ceiling enforced by
            # cargo xtask save-sccache and cargo xtask prune-caches
            # that the trimmed directory plus cache-archive overhead stays
            # within budget.
            printf 'SCCACHE_CACHE_SIZE=%s\n' "400M"
            # sccache refuses incremental compilation, and the workspace
            # profiles leave incremental on for the local edit loop (the
            # environment variable overrides the profile), so CI pins it
            # off itself instead of depending on the manifest.
            printf '%s\n' 'CARGO_INCREMENTAL=0'
          } >> "$GITHUB_ENV"
          printf 'identity=%s\n' "$native_build_identity" >> "$GITHUB_OUTPUT"
          printf '[native-build-identity] status=complete identity=%s elapsed_seconds=%s\n' \
            "$native_build_identity" "$(( $(date +%s) - started_at_seconds ))"

      - name: Restore native-archives-cache
        id: native-archives-cache
        uses: ./.github/actions/astronomical-cache
        with:
          operation: restore
          owner: native-archives
          path: ~/Library/Caches/Astronomical/native-dependencies
          key: astronomical-v2-native-archives-${{ runner.os }}-${{ hashFiles('third-party/native-dependency-manifest.cmake', 'third-party/pins/**') }}
      - name: Restore native-build-cache
        id: native-build-cache
        uses: ./.github/actions/astronomical-cache
        with:
          operation: restore
          owner: native-build
          path: ${{ env.NATIVE_BUILD_ENTRY_DIRECTORY }}
          # Key on native build identity alone so the same identity restores
          # across runs and PR refs instead of missing on every new run_id.
          # Deliberately no restore-keys fallback: saved keys end at the
          # identity, so a shorter prefix could only match a *different*
          # identity's entry, which the build store rejects before rebuilding
          # anyway — a fallback would just waste the download. Scope rules do
          # the rest: each PR reads its own scope first, then the default
          # branch's, so a main-run save serves every later pull request.
          key: astronomical-v2-native-build-${{ runner.os }}-${{ runner.arch }}-${{ env.NATIVE_BUILD_IDENTITY }}
      - name: Restore sccache-cache
        id: sccache-cache
        uses: ./.github/actions/astronomical-cache
        with:
          operation: restore
          owner: sccache
          path: ~/Library/Caches/Astronomical/sccache
          # Key on Cargo.lock (not github.sha) so the same dependency graph
          # restores across commits instead of missing on every new SHA. The
          # native build identity is deliberately absent: the native build
          # product cache owns that identity, and embedding it here would
          # discard the whole compiler cache on every pin or patch change even
          # though sccache itself is content-addressed and never serves a
          # stale object.
          key: astronomical-v2-sccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            astronomical-v2-sccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            astronomical-v2-sccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Run the app-builder packaging journey
        run: |
          trap 'scripts/ci/ci-step-timing.sh end app-builder-journey' EXIT
          scripts/ci/ci-step-timing.sh begin app-builder-journey
          # This step runs before sccache is installed, so cargo must not try
          # to exec the not-yet-existing wrapper binary; the journey compiles
          # from the restored cargo-downloads registry in well under the step
          # budget. The host-agnostic workflow and cache contracts moved to
          # the config-contracts lane (issue #1553); what stays here is the
          # one contract that exercises macOS packaging tooling: the real
          # build-macos-app.sh in a sandbox with fixture-bin tool shims,
          # deterministic and done in seconds, so it enforces the packaging
          # contract on every pull request instead of only before releases.
          unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER
          cargo test --locked -p xtask --test integration_app_builder_journeys
        timeout-minutes: 5
      - name: Prepare durable test-log directory
        run: mkdir -p "$RUNNER_TEMP/test-logs"
      - name: Install verification tools
        run: |
          trap 'scripts/ci/ci-step-timing.sh end install-verification-tools' EXIT
          scripts/ci/ci-step-timing.sh begin install-verification-tools
          # This step installs sccache, so the xtask compile must not run
          # through the wrapper exported by the identity step: the wrapper
          # binary does not exist yet.
          unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER
          cargo run --quiet -p xtask -- install-verification-tools
      # cargo-nextest executes the integration lane (issue #1553 phase 3).
      # Pinned version and digest, verified before use like every other
      # native dependency: a digest mismatch fails the job instead of running
      # an unverified binary. Bump procedure: update both values together
      # from the release's published .sha256 for the universal-apple-darwin
      # archive.
      - name: Provision pinned cargo-nextest
        env:
          NEXTEST_VERSION: "0.9.149"
          NEXTEST_SHA256: 47b9941765a9ff94e304a3fe5444ac1c7593da655525b8b69f8f2b31a9217507
        run: |
          set -euo pipefail
          trap 'scripts/ci/ci-step-timing.sh end provision-nextest' EXIT
          scripts/ci/ci-step-timing.sh begin provision-nextest
          nextest_directory="$RUNNER_TEMP/cargo-nextest"
          mkdir -p "$nextest_directory"
          nextest_archive="$nextest_directory/cargo-nextest.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$nextest_archive" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-universal-apple-darwin.tar.gz"
          actual_nextest_sha256="$(shasum -a 256 "$nextest_archive" | awk '{print $1}')"
          if [ "$actual_nextest_sha256" != "$NEXTEST_SHA256" ]; then
            printf 'Error: cargo-nextest archive digest mismatch: expected %s, got %s\n' \
              "$NEXTEST_SHA256" "$actual_nextest_sha256" >&2
            exit 1
          fi
          tar -xzf "$nextest_archive" -C "$nextest_directory"
          printf '%s\n' "$nextest_directory" >> "$GITHUB_PATH"
          "$nextest_directory/cargo-nextest" nextest --version
        timeout-minutes: 2
      # Default-branch and dispatch builds bundle the app, so they refresh
      # the notices in place: a bot-merged dependency update can land one
      # regeneration behind, and the bundle must never ship stale notices.
      # Pull requests run no notices work at all: the committed copy's
      # freshness is repository hygiene, not a property of the change under
      # review, and the gate failed pull requests whose authors had not
      # regenerated locally. Commit the regenerated file alongside dependency
      # changes when convenient; nothing in CI demands it.
      - name: Refresh Rust dependency notices for the bundled app
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          trap 'scripts/ci/ci-step-timing.sh end dependency-notices-refresh' EXIT
          scripts/ci/ci-step-timing.sh begin dependency-notices-refresh
          cargo xtask notices
          printf '%s\n' '[rust-dependency-notices] status=refreshed-for-bundle'
        timeout-minutes: 2
      - name: Provision verified native dependencies
        id: native-archive-provisioning
        run: |
          trap 'scripts/ci/ci-step-timing.sh end provision-native-dependencies' EXIT
          scripts/ci/ci-step-timing.sh begin provision-native-dependencies
          cargo xtask bootstrap-native-dependencies
      - name: Set maximum parallel build jobs
        run: |
          printf 'CARGO_BUILD_JOBS=%s\n' "$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"
          # The prewarm step runs the CMake MLX build alone before any cargo
          # step, so the native build can use every core; the in-cargo cmake
          # fallback cannot fire because the prewarm guarantees a warm store.
          printf 'ASTRONOMICAL_NATIVE_BUILD_JOBS=%s\n' "$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"
      - name: Build native library
        id: native-build-prewarm
        shell: bash
        run: |
          set -euo pipefail
          trap 'scripts/ci/ci-step-timing.sh end native-build-prewarm' EXIT
          scripts/ci/ci-step-timing.sh begin native-build-prewarm
          # The native CMake build runs alone in this step at the full core
          # count. Every later Cargo step finds the native build store warm
          # and skips CMake, so native and Rust compilation never overlap on
          # the small hosted runners.
          scripts/ci/prewarm-native-build.sh --profile core
          [ -f "$ASTRONOMICAL_NATIVE_BUILD_STATUS_FILE" ] || {
            printf '%s\n' 'Error: native build status was not published' >&2
            exit 1
          }
          native_build_status="$(tr -d '[:space:]' < "$ASTRONOMICAL_NATIVE_BUILD_STATUS_FILE")"
          case "$native_build_status" in
            built) printf 'was_built=true\n' >> "$GITHUB_OUTPUT" ;;
            reused) printf 'was_built=false\n' >> "$GITHUB_OUTPUT" ;;
            *) printf '%s\n' 'Error: unsupported native build status: %s\n' "$native_build_status" >&2; exit 1 ;;
          esac
          printf '[native-build-prewarm] status=%s\n' "$native_build_status"
        timeout-minutes: 12
      - name: Compile integration lane tests
        shell: bash
        run: |
          set -euo pipefail
          # Cargo captures build-script stderr, so the native CMake rebuild would
          # otherwise be a silent multi-minute gap in this step's log. The build
          # script appends progress lines to this file and tail streams them live.
          # The variable arrives from the job environment (configured with the
          # step timing setup) so its value matches every cargo invocation in
          # this job; exporting it here alone would invalidate the build script
          # fingerprint of the next cargo step and force a from-scratch rebuild
          # of runtime-integration and its dependents.
          : > "$ASTRONOMICAL_NATIVE_BUILD_PROGRESS_FILE"
          tail -f "$ASTRONOMICAL_NATIVE_BUILD_PROGRESS_FILE" &
          progress_tail_pid=$!
          trap 'kill "$progress_tail_pid" 2>/dev/null || true; scripts/ci/ci-step-timing.sh end compile-integration-tests' EXIT
          scripts/ci/ci-step-timing.sh begin compile-integration-tests
          cargo test-integration --timings --no-run
          cargo test-test-harness-fixtures --no-run
          cargo test --timings --no-fail-fast --no-run -p astronomical-daemon --test rest_api_tests
          cargo test --timings --no-fail-fast --no-run -p astronomical-e2e --test e2e
          # The root E2E journeys spawn the real daemon and fixture worker
          # binaries from outside their package, so they must be built before
          # the lane runs; workspace_binary fails loudly otherwise.
          cargo build --locked --bins -p astronomical-daemon
        timeout-minutes: 12
      - name: Classify native build result
        id: native-build-result
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$ASTRONOMICAL_NATIVE_BUILD_STATUS_FILE" ] || {
            printf '%s\n' 'Error: native build status was not published' >&2
            exit 1
          }
          native_build_status="$(tr -d '[:space:]' < "$ASTRONOMICAL_NATIVE_BUILD_STATUS_FILE")"
          case "$native_build_status" in
            built) printf 'was_built=true\n' >> "$GITHUB_OUTPUT" ;;
            reused) printf 'was_built=false\n' >> "$GITHUB_OUTPUT" ;;
            *) printf '%s\n' 'Error: unsupported native build status: %s\n' "$native_build_status" >&2; exit 1 ;;
          esac
          printf '[native-build-result] status=%s\n' "$native_build_status"
      - name: Run integration lane tests
        run: |
          trap 'scripts/ci/ci-step-timing.sh end integration-tests' EXIT
          scripts/ci/ci-step-timing.sh begin integration-tests
          # Preserve cargo's exit code through tee so a failing test still fails
          # this required check; the default GitHub bash shell sets pipefail, but
          # state it explicitly so the invariant survives a shell change.
          set -o pipefail
          # nextest runs one process per test, so process-global state
          # (environment variables, signal handlers, and the MLX allocator
          # the model-serving accounting tests sample) cannot leak between
          # tests, and .config/nextest.toml enforces a per-test hang budget.
          # It reuses the binaries the compile step above already built: the
          # nextest-integration alias carries the identical selection.
          cargo nextest-integration 2>&1 | tee "$RUNNER_TEMP/test-logs/integration.log"
          cargo test-test-harness-fixtures 2>&1 | tee "$RUNNER_TEMP/test-logs/test-harness-fixtures.log"
        timeout-minutes: 2
      - name: Run Library REST contracts
        run: |
          trap 'scripts/ci/ci-step-timing.sh end rest-library-contracts' EXIT
          scripts/ci/ci-step-timing.sh begin rest-library-contracts
          set -o pipefail
          cargo test --timings -p astronomical-daemon --test rest_api_tests library -- --nocapture 2>&1 | tee "$RUNNER_TEMP/test-logs/rest-library.log"
        timeout-minutes: 2
      - name: Verify menu-facing status wire contract
        run: |
          trap 'scripts/ci/ci-step-timing.sh end rest-wire-contract' EXIT
          scripts/ci/ci-step-timing.sh begin rest-wire-contract
          set -o pipefail
          cargo test -p astronomical-daemon --test rest_api_tests rest_api::application::image_status::should_expose_image_generation_progress_with_completed_and_total_steps_when_active -- --exact 2>&1 | tee "$RUNNER_TEMP/test-logs/rest-wire-contract.log"
        timeout-minutes: 2
      - name: Run root E2E journeys
        run: |
          trap 'scripts/ci/ci-step-timing.sh end root-e2e-journeys' EXIT
          scripts/ci/ci-step-timing.sh begin root-e2e-journeys
          set -o pipefail
          cargo test --no-fail-fast -p astronomical-e2e --test e2e 2>&1 | tee "$RUNNER_TEMP/test-logs/root-e2e.log"
        timeout-minutes: 5
      # The tier pyramid and repository contract scripts moved to the
      # config-contracts lane (issue #1553): they parse inventory and
      # configuration, so ubuntu runs them in parallel instead of extending
      # this job's critical path.
      # Observatory contracts may migrate to swift-node at any time — the CI
      # verdict fans in both macOS jobs, so job membership no longer touches
      # branch protection. They stay here while this job owns the test-log
      # artifact wiring they tee into.
      - name: Run Observatory contracts
        run: |
          trap 'scripts/ci/ci-step-timing.sh end observatory-contracts' EXIT
          scripts/ci/ci-step-timing.sh begin observatory-contracts
          set -o pipefail
          node --test --test-reporter=spec apps/daemon/console/console.test.js apps/daemon/console/library.test.js apps/daemon/console/library-fetch.test.js apps/daemon/console/connect.test.js 2>&1 | tee "$RUNNER_TEMP/test-logs/observatory.log"
        timeout-minutes: 2
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-macos-rust-core-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-logs/
          if-no-files-found: warn
          retention-days: 30
      - name: Save cargo-downloads-cache
        id: cargo-downloads-cache-save
        if: ${{ !cancelled() && steps.cargo-downloads-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/astronomical-cache
        with:
          operation: save
          owner: cargo-downloads
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: astronomical-v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
      - name: Save native-archives-cache
        id: native-archives-cache-save
        if: ${{ !cancelled() && steps.native-archives-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/astronomical-cache
        with:
          operation: save
          owner: native-archives
          path: ~/Library/Caches/Astronomical/native-dependencies
          key: astronomical-v2-native-archives-${{ runner.os }}-${{ hashFiles('third-party/native-dependency-manifest.cmake', 'third-party/pins/**') }}
      - name: Save native-build-cache
        id: native-build-cache-save
        if: ${{ !cancelled() && (steps.native-build-result.outputs.was_built == 'true' || steps.native-build-prewarm.outputs.was_built == 'true') }}
        uses: ./.github/actions/astronomical-cache
        with:
          operation: save
          owner: native-build
          path: ${{ env.NATIVE_BUILD_ENTRY_DIRECTORY }}
          key: astronomical-v2-native-build-${{ runner.os }}-${{ runner.arch }}-${{ env.NATIVE_BUILD_IDENTITY }}
      - name: Enforce sccache cache budget
        id: sccache-budget
        # A restore that hits the primary key marks cache-hit=true and skips
        # the save, so an entry written before the sccache cap existed is
        # restored and re-downloaded forever. This step measures the capped
        # directory, deletes stored oversize copies of the primary key, and
        # decides whether the save below runs. Default-branch-only because the
        # save itself is; when this step is skipped the save output is empty
        # and the save step is skipped with it.
        if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --quiet -p xtask -- save-sccache "astronomical-v2-sccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}"
        timeout-minutes: 2
      - name: Save sccache-cache
        id: sccache-cache-save
        # Pull-request saves are merge-ref-scoped duplicates of the
        # default-branch entry: pull requests restore from the default branch
        # anyway, so skipping the pull-request save halves the sccache share of
        # the 10 GB repository cache budget at the cost of recompiling a pull
        # request's own new artifacts on each run. The budget step above
        # suppresses a save whenever the stored primary-key entry is already
        # within budget, and forces one only to replace an oversize entry or
        # record a new generation.
        if: ${{ !cancelled() && steps.sccache-budget.outputs.should_save == 'true' }}
        uses: ./.github/actions/astronomical-cache
        with:
          operation: save
          owner: sccache
          path: ~/Library/Caches/Astronomical/sccache
          key: astronomical-v2-sccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
      - name: Prune surplus CI caches
        # Multiple sccache generations exceed the 10 GB repository cache limit,
        # which makes GitHub evict the small native-build cache and forces the
        # next run into a silent multi-minute CMake rebuild. The prune policy
        # also deletes sccache entries above a size ceiling even when newest.
        # Tolerated failures keep read-only fork-PR tokens from failing the job.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'scripts/ci/ci-step-timing.sh end prune-ci-caches' EXIT
          scripts/ci/ci-step-timing.sh begin prune-ci-caches
          cargo run --quiet -p xtask -- prune-caches
        timeout-minutes: 2
      - name: Upload Cargo timing report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings-macos-rust-core-${{ github.run_attempt }}
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7
      - name: Print compiler cache statistics
        if: always()
        run: sccache --show-stats
      - name: Publish step timing summary
        if: always()
        run: scripts/ci/publish-ci-timing-summary.sh
        timeout-minutes: 1

  # Parallel macOS contract job, fanned in by the CI verdict rather than
  # listed in branch protection: it may split or rename freely. The Swift
  # toolchain identity is resolved here (not inherited) because GitHub
  # Actions does not share GITHUB_ENV across jobs and the SwiftPM cache key
  # must match the toolchain that would build.
  swift-node:
    if: ${{ always() && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.macos_verification_required == 'true') }}
    needs: detect-changes
    name: macOS Swift and Node contracts
    runs-on: macos-26
    concurrency:
      group: macos-swift-node-${{ github.event_name }}-${{ github.ref }}
      # Never cancel an in-flight contract check. A cancelled run leaves the
      # check name in an unresolved state that blocks reading the PR.
      cancel-in-progress: false
    timeout-minutes: 12
    env:
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
    steps:
      - name: Configure step timing attribution
        run: printf 'ASTRONOMICAL_CI_TIMING_FILE=%s/astronomical-ci-step-timings.csv\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require successful change classification
        if: ${{ needs.detect-changes.result != 'success' }}
        run: |
          printf '%s\n' 'Error: required macOS verification could not classify the changed content' >&2
          exit 1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Assert pinned Xcode toolchain
        run: |
          set -euo pipefail
          pinned_xcode_version="$ASTRONOMICAL_PINNED_XCODE_VERSION"
          resolved_developer_dir=""
          for xcode_bundle_candidate in \
            "/Applications/Xcode_${pinned_xcode_version}.app" \
            "/Applications/Xcode_${pinned_xcode_version}.0.app"; do
            if [ -x "$xcode_bundle_candidate/Contents/Developer/usr/bin/xcodebuild" ]; then
              resolved_developer_dir="$xcode_bundle_candidate/Contents/Developer"
              break
            fi
          done
          if [ -z "$resolved_developer_dir" ]; then
            printf '%s\n' "Error: this runner image ships no Xcode matching the pinned version ${pinned_xcode_version}." >&2
            printf '%s\n' 'Error: installed Xcode applications on this image:' >&2
            ls -d /Applications/Xcode*.app >&2 || true
            printf '%s\n' 'Error: pick an installed version and update the workflow-level ASTRONOMICAL_PINNED_XCODE_VERSION pin.' >&2
            exit 1
          fi
          export DEVELOPER_DIR="$resolved_developer_dir"
          printf 'DEVELOPER_DIR=%s\n' "$resolved_developer_dir" >> "$GITHUB_ENV"
          printf '[pinned-xcode] status=verified developer_dir=%s version=%s\n' \
            "$resolved_developer_dir" "$pinned_xcode_version"
          xcodebuild -version
          pinned_sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          printf '[pinned-xcode] sdk_version=%s\n' "$pinned_sdk_version"
      - name: Resolve Swift toolchain identity
        id: swift-toolchain-identity
        shell: bash
        run: |
          set -euo pipefail
          trap 'scripts/ci/ci-step-timing.sh end swift-toolchain-identity' EXIT
          scripts/ci/ci-step-timing.sh begin swift-toolchain-identity
          started_at_seconds="$(date +%s)"
          printf '[swift-toolchain-identity] status=start\n'
          swift_toolchain_manifest="$RUNNER_TEMP/astronomical-swift-toolchain"
          {
            xcodebuild -version
            swift --version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-build-version
          } > "$swift_toolchain_manifest"
          swift_toolchain_digest_output="$(shasum -a 256 "$swift_toolchain_manifest")"
          swift_toolchain_identity="${swift_toolchain_digest_output%% *}"
          printf 'SWIFT_TOOLCHAIN_IDENTITY=%s\n' "$swift_toolchain_identity" >> "$GITHUB_ENV"
          printf '[swift-toolchain-identity] status=complete identity=%s elapsed_seconds=%s\n' \
            "$swift_toolchain_identity" "$(( $(date +%s) - started_at_seconds ))"
      - name: Restore swiftpm-cache
        id: swiftpm-cache
        uses: ./.github/actions/astronomical-cache
        with:
          operation: restore
          owner: swiftpm
          path: apps/astronomical-menu/.build
          key: astronomical-v2-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_IDENTITY }}-${{ hashFiles('apps/astronomical-menu/Package.swift', 'apps/astronomical-menu/Package.resolved') }}-${{ hashFiles('apps/astronomical-menu/Sources/**/*.swift', 'apps/astronomical-menu/tests/**/*.swift') }}
          restore-keys: |
            astronomical-v2-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_IDENTITY }}-${{ hashFiles('apps/astronomical-menu/Package.swift', 'apps/astronomical-menu/Package.resolved') }}-
      - name: Keep restored SwiftPM artifacts newer than checkout
        if: ${{ steps.swiftpm-cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          started_at_seconds="$(date +%s)"
          printf '[swiftpm-timestamps] status=start\n'
          find apps/astronomical-menu/.build -type f -exec touch -c {} +
          printf '[swiftpm-timestamps] status=success elapsed_seconds=%s\n' "$(( $(date +%s) - started_at_seconds ))"
      - name: Prepare durable test-log directory
        run: mkdir -p "$RUNNER_TEMP/test-logs"
      - name: Set up Node for Thin Talk web assets
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Build Thin Talk web assets
        run: |
          set -euo pipefail
          trap 'scripts/ci/ci-step-timing.sh end thin-talk-web-assets' EXIT
          scripts/ci/ci-step-timing.sh begin thin-talk-web-assets
          (cd apps/thin-talk/web && npm ci && npm run build)
        # The step always pays a cold `npm ci` (setup-node carries no npm
        # cache here), so its duration is network-bound; 4 minutes was
        # exceeded twice in a row on unchanged web assets. 10 minutes keeps
        # a slow registry mirror from failing the whole macOS contract job.
        timeout-minutes: 10
      - name: Run macOS menu status contracts
        id: macos-menu-contracts
        run: |
          trap 'scripts/ci/ci-step-timing.sh end macos-menu-contracts' EXIT
          scripts/ci/ci-step-timing.sh begin macos-menu-contracts
          set -o pipefail
          scripts/ci/test-macos-menu-contracts.sh 2>&1 | tee "$RUNNER_TEMP/test-logs/menu-status.log"
        timeout-minutes: 2
      - name: Run Thin Talk conversation canvas contracts
        run: |
          trap 'scripts/ci/ci-step-timing.sh end thin-talk-contracts' EXIT
          scripts/ci/ci-step-timing.sh begin thin-talk-contracts
          set -o pipefail
          # -Xswiftc -warnings-as-errors mirrors the repository's Rust rule
          # that warnings are defects: a Swift warning must fail this step
          # instead of scrolling past the log.
          swift test --package-path apps/thin-talk -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/test-logs/thin-talk.log"
        timeout-minutes: 6
      # The packaging publication contracts (DMG, notarization, App Store
      # pkg, installer promotion) are sandbox integration journeys like the
      # app-builder one on the verification job; wiring them here keeps the
      # release scripts from rotting between releases (issue #1346). The
      # suite takes about half a minute with its faked toolchain. macOS
      # runner images ship no GNU timeout, and every contract bounds its
      # subject with one, so the committed wrapper goes first on PATH.
      - name: Run macOS packaging release contracts
        run: |
          trap 'scripts/ci/ci-step-timing.sh end release-contracts' EXIT
          scripts/ci/ci-step-timing.sh begin release-contracts
          set -o pipefail
          export PATH="$PWD/scripts/ci:$PATH"
          scripts/release/tests/test-release-contracts.sh 2>&1 | tee "$RUNNER_TEMP/test-logs/release-contracts.log"
        timeout-minutes: 4
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-macos-swift-node-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-logs/
          if-no-files-found: warn
          retention-days: 30
      - name: Save swiftpm-cache
        id: swiftpm-cache-save
        if: ${{ !cancelled() && steps.swiftpm-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/astronomical-cache
        with:
          operation: save
          owner: swiftpm
          path: apps/astronomical-menu/.build
          key: astronomical-v2-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_IDENTITY }}-${{ hashFiles('apps/astronomical-menu/Package.swift', 'apps/astronomical-menu/Package.resolved') }}-${{ hashFiles('apps/astronomical-menu/Sources/**/*.swift', 'apps/astronomical-menu/tests/**/*.swift') }}
      - name: Publish step timing summary
        if: always()
        run: scripts/ci/publish-ci-timing-summary.sh
        timeout-minutes: 1

  # Docs- and site-only pull requests get a green check here instead of
  # skipped macOS verification, so "all checks passed" reflects real work
  # without burning macOS runners for markdown edits.
  static:
    name: Static change checks
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: ${{ always() && needs.detect-changes.result == 'success' }}
    timeout-minutes: 5
    steps:
      - name: Configure step timing attribution
        run: printf 'ASTRONOMICAL_CI_TIMING_FILE=%s/astronomical-ci-step-timings.csv\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check static site links
        run: |
          trap 'scripts/ci/ci-step-timing.sh end site-link-check' EXIT
          scripts/ci/ci-step-timing.sh begin site-link-check
          node scripts/check-site-links.js
        timeout-minutes: 2

  # Host-agnostic configuration contracts (issue #1553, phase 2a): these
  # steps parse configuration and inventory — they do not exercise the
  # product — so an ubuntu runner runs them in parallel with the macOS
  # lanes instead of extending the macOS critical path. Like detect-changes,
  # this job restores no caches: the macOS-owned cache entries are keyed to
  # runner.os, so an ubuntu restore would always miss and the cold xtask
  # compile costs less than the wasted download would.
  config-contracts:
    name: Configuration contracts
    needs: detect-changes
    if: ${{ always() && needs.detect-changes.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Configure step timing attribution
        run: printf 'ASTRONOMICAL_CI_TIMING_FILE=%s/astronomical-ci-step-timings.csv\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run workflow and cache contracts
        run: |
          trap 'scripts/ci/ci-step-timing.sh end ci-cache-contracts' EXIT
          scripts/ci/ci-step-timing.sh begin ci-cache-contracts
          cargo test --locked -p xtask --test workflow_structural_contract
          cargo test --locked -p xtask --test workflow_verdict_contract
          cargo test --locked -p xtask --test workflow_cache_owner_contract
          scripts/ci/tests/test-ci-native-cache-coordination.sh
        timeout-minutes: 5
      - name: Report test tier pyramid
        run: |
          trap 'scripts/ci/ci-step-timing.sh end test-tier-pyramid' EXIT
          scripts/ci/ci-step-timing.sh begin test-tier-pyramid
          cargo xtask tier-pyramid
        timeout-minutes: 5
      - name: Run repository contract scripts
        run: |
          trap 'scripts/ci/ci-step-timing.sh end repository-contracts' EXIT
          scripts/ci/ci-step-timing.sh begin repository-contracts
          export PATH="$PWD/scripts/ci:$PATH"
          verification/tooling_contracts/test-cargo-citation-contract.sh
          verification/tooling_contracts/test-channel-isolation-checker-contract.sh
          verification/tooling_contracts/test-source-size-check.sh
          scripts/ci/tests/test-report-tier-pyramid-contract.sh
          cargo xtask check-architecture
        timeout-minutes: 5
      - name: Publish step timing summary
        if: always()
        run: scripts/ci/publish-ci-timing-summary.sh
        timeout-minutes: 1

  # The one required check of this workflow (issue #1553): a fan-in verdict
  # that fails closed over every lane, so branch protection and the ruleset
  # list exactly one check whose name never changes and jobs above stay free
  # to split, merge, or rename without protection coordination.
  #
  # `if: always()` is load-bearing: without it, a failed needed job would
  # skip this verdict, and GitHub treats a skipped required check as
  # satisfied — a failing lane would merge. The step below therefore sees
  # every lane's terminal result and decides.
  #
  # Skip legitimacy: the two macOS lanes legitimately skip when the
  # classifier marked macOS verification not required (site-only changes);
  # the verdict accepts a skip only under that classifier decision, so a
  # lane skipped for any other reason fails the gate.
  verdict:
    name: CI verdict
    needs: [detect-changes, rust-core, swift-node, static, config-contracts]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed unless every lane is green or legitimately skipped
        run: |
          set -euo pipefail
          fail() {
            printf '[ci-verdict] status=fail reason=%s\n' "$1" >&2
            exit 1
          }
          classification_result="${{ needs.detect-changes.result }}"
          macos_verification_required="${{ needs.detect-changes.outputs.macos_verification_required }}"
          rust_core_result="${{ needs.rust-core.result }}"
          swift_node_result="${{ needs.swift-node.result }}"
          static_result="${{ needs.static.result }}"
          config_contracts_result="${{ needs.config-contracts.result }}"
          [ "$classification_result" = "success" ] \
            || fail "classification-result=$classification_result"
          macos_lanes_may_skip=false
          if [ "$macos_verification_required" != "true" ]; then
            macos_lanes_may_skip=true
          fi
          for lane_result_pair in "rust-core:$rust_core_result" "swift-node:$swift_node_result"; do
            lane_name="${lane_result_pair%%:*}"
            lane_result="${lane_result_pair##*:}"
            case "$lane_result" in
              success)
                printf '[ci-verdict] lane=%s result=success\n' "$lane_name"
                ;;
              skipped)
                if [ "$macos_lanes_may_skip" = true ]; then
                  printf '[ci-verdict] lane=%s result=skipped classification=macos-not-required\n' "$lane_name"
                else
                  fail "lane=$lane_name skipped while classification requires macOS verification"
                fi
                ;;
              *)
                fail "lane=$lane_name result=$lane_result"
                ;;
            esac
          done
          case "$static_result" in
            success) printf '[ci-verdict] lane=static result=success\n' ;;
            *) fail "lane=static result=$static_result" ;;
          esac
          case "$config_contracts_result" in
            success) printf '[ci-verdict] lane=config-contracts result=success\n' ;;
            *) fail "lane=config-contracts result=$config_contracts_result" ;;
          esac
          printf '[ci-verdict] status=pass\n'
