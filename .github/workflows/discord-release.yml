name: Announce release on Discord

# Posts each published release to the project's Discord server through a
# channel webhook, so the post carries the project's name and logo and the
# release notes as written. A link pasted by hand shows the preview card of
# the release page instead, which is not the project's own image.
on:
  release:
    types:
      - published
  # A manual run announces an existing release again, for the first setup or
  # after a failed post.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce, such as v0.2.105
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: discord-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  announce:
    name: Post the release to Discord
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The release is read by its tag on every run, from the event or the
      # manual input, so both post the same message. Discord shows Markdown
      # headings in an embed far larger than the text around them, so they
      # become bold lines, and the notes are cut to stay inside Discord's
      # 4,096-character embed limit with room for the closing line.
      - name: Read the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name,body,url > release.json
          jq -r .body release.json | sed -E 's/^#{1,6}[[:space:]]+(.*)$/**\1**/' | head -c 3800 > release-notes.md
          {
            echo "name=$(jq -r .name release.json)"
            echo "url=$(jq -r .url release.json)"
            echo "body<<RELEASE_NOTES_END"
            cat release-notes.md
            echo
            echo
            echo "Download for Mac at getastronomical.com"
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_OUTPUT"
      # Runs on Node.js 24; the previous action targeted Node.js 20, which
      # GitHub has deprecated and now forces onto Node.js 24 with a warning.
      - name: Post the release
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          content: A new version of Astronomical is out.
          title: ${{ steps.release.outputs.name }}
          description: ${{ steps.release.outputs.body }}
          url: ${{ steps.release.outputs.url }}
          # The icon's violet.
          color: '0x6B3FC4'
          # A release announcement, not a CI status: no status prefix, no
          # job fields, and a failed post fails the run so it can be re-run.
          noprefix: true
          nodetail: true
          nocontext: true
          nofail: false
