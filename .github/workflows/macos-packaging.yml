name: macOS packaging

# Builds a real Stable bundle through `cargo xtask app package` and launches
# it with `cargo xtask app smoke-test`, so main proves the shipped packaging
# path end to end: native MLX build, thin-LTO release executables in the
# disposable target lane, the Swift menu app, Thin Talk web assets, ad hoc
# signing, and the bundle checks.
#
# A weekly backstop, never a gate. The pipeline's contracts (signing plans,
# Info.plist rendering, bundle layout checks) are typed xtask unit tests that
# the macOS build job runs on every pull request, and every release packages
# for real on the release Mac through `cargo xtask release prepare-signed`,
# which fails before any tag is pushed. What only this lane adds is a clean
# runner on the pinned toolchain, which catches a runner image or toolchain
# change that breaks packaging; a weekly run finds that within days and
# nobody waits on it. It runs weekly against main and on demand, and never
# on pull requests or pushes, where it only made people wait.
#
# Caching. The lane used to rebuild everything: about 4-7 minutes of native
# MLX compilation and 5-7 minutes of thin-LTO Rust per run. Both are now
# served from caches that cannot hand the release stale bytes:
# - The native MLX build comes from the same content-addressed native build
#   store entry ci.yml saves on main. `app package` prewarms the `core`
#   profile outside Cargo, exactly as ci.yml does, so the identity, and so
#   the cache key, is the same; a miss builds it and saves it back.
# - Rust compilation goes through sccache, which keys every object on its
#   full inputs, so the disposable release target directory still starts
#   empty and only content-identical objects are reused. Release objects
#   (optimised, with LTO bitcode) share nothing with ci.yml's debug sccache,
#   so this lane keeps its own family. The final thin-LTO links of the three
#   executables are never cacheable and always run.
#
# Never signs with an identity, notarizes, or publishes: Stable signs ad hoc
# when no --signing-identity is given, which is exactly what CI can verify
# without release credentials.

on:
  schedule:
    # Sundays at 03:41 UTC, off the hour and clear of the 02:23 notices lane.
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-packaging-${{ github.ref }}

env:
  # Must equal ci.yml's pin: the native-build identity hashes toolchain
  # outputs, so one Xcode version serves every macOS workflow. The
  # workflow_xcode_pin_contract test fails when the two drift apart.
  ASTRONOMICAL_PINNED_XCODE_VERSION: "26.6"

jobs:
  package-stable:
    name: Package and smoke-test the Stable bundle
    runs-on: macos-26
    # A fully cold run (native MLX build, cold sccache) took up to 17 minutes;
    # the limit leaves room for a slow runner on a double miss.
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Assert pinned Xcode toolchain
        uses: ./.github/actions/assert-pinned-xcode
        with:
          xcode-version: ${{ env.ASTRONOMICAL_PINNED_XCODE_VERSION }}
      - name: Set up Node for Thin Talk web assets
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/thin-talk/web/package-lock.json
      # ci.yml saves this on main; restore-only here so the two lanes never
      # race to write the same key.
      - name: Restore cargo-downloads-cache
        uses: ./.github/actions/astronomical-cache
        with:
          operation: restore
          owner: cargo-downloads
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: astronomical-v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            astronomical-v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Provision the xtask binary
        uses: ./.github/actions/provision-xtask
      - name: Compute the native build cache key
        # Prints NATIVE_BUILD_IDENTITY and NATIVE_BUILD_ENTRY_DIRECTORY; the
        # probe values go to the log so a cache miss can be attributed.
        run: xtask native-fingerprint --explain --target aarch64-apple-darwin --profile core --cache-environment >> "$GITHUB_ENV"
      - name: Restore native-archives-cache
        id: native-archives-cache
        uses: ./.github/actions/astronomical-cache
        with:
          operation: restore
          owner: native-archives
          path: ~/Library/Caches/Astronomical/native-dependencies
          key: astronomical-v2-native-archives-${{ runner.os }}-${{ hashFiles('third-party/native-dependency-manifest.cmake', 'third-party/pins/**') }}
      - name: Restore native-build-cache
        id: native-build-cache
        uses: ./.github/actions/astronomical-cache
        with:
          operation: restore
          owner: native-build
          path: ${{ env.NATIVE_BUILD_ENTRY_DIRECTORY }}
          # Identity alone, as in ci.yml: a different identity's entry would
          # be rejected by the store, so a prefix fallback could only waste a
          # download.
          key: astronomical-v2-native-build-${{ runner.os }}-${{ runner.arch }}-${{ env.NATIVE_BUILD_IDENTITY }}
      - name: Restore release-sccache-cache
        uses: ./.github/actions/astronomical-cache
        with:
          operation: restore
          owner: release-sccache
          path: ~/Library/Caches/Astronomical/release-sccache
          # The run id ends the key so every saving run writes a fresh
          # generation: the workspace crates change with every commit, and a
          # key that hit exactly would skip the save and serve last week's
          # workspace objects forever. The prefixes fall back to the newest
          # generation for the same lockfile, then the same toolchain.
          key: astronomical-v2-release-sccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'third-party/tool-pins/Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            astronomical-v2-release-sccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'third-party/tool-pins/Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}-
            astronomical-v2-release-sccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'third-party/tool-pins/Cargo.toml') }}-
      # ci.yml's rust-core saves this on main; restore-only here, as with the
      # native archives, so a release-edge 504 cannot fail the weekly run.
      - name: Restore verification-tools-cache
        uses: ./.github/actions/astronomical-cache
        with:
          operation: restore
          owner: verification-tools
          path: ~/Library/Caches/Astronomical/verification-tools
          key: astronomical-v2-verification-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third-party/tool-pins/Cargo.toml') }}
      - name: Install verification tools
        run: xtask install-verification-tools --prefix ~/Library/Caches/Astronomical/verification-tools
      - name: Route Rust compilation through sccache
        # Written after sccache is installed: provision-xtask may compile
        # before it exists. sccache refuses incremental compilation, and the
        # cap bounds the saved cache at ci.yml's budget; a full release build
        # filled 149 MiB, so the cap leaves room for several generations.
        run: |
          {
            printf 'SCCACHE_DIR=%s\n' "$HOME/Library/Caches/Astronomical/release-sccache"
            printf 'SCCACHE_CACHE_SIZE=%s\n' "600M"
            printf '%s\n' 'RUSTC_WRAPPER=sccache'
            printf '%s\n' 'CARGO_INCREMENTAL=0'
          } >> "$GITHUB_ENV"
      - name: Provision verified native dependencies
        # The package pipeline only verifies the pinned native archives
        # (MLX and its peers); a fresh runner has none, so they are
        # downloaded and digest-checked first, exactly as the macOS build
        # job does.
        run: cargo xtask bootstrap-native-dependencies
      - name: Package the Stable bundle
        # The pipeline reports each step with its elapsed time and an ETA,
        # and requires the clean checkout this job starts from.
        run: cargo xtask app package --channel stable
      - name: Smoke-test the packaged Stable bundle
        run: cargo xtask app smoke-test --app-bundle "target/astronomical-macos-stable.noindex/Astronomical.app"
      - name: Report sccache effectiveness
        if: ${{ !cancelled() }}
        run: sccache --show-stats
      - name: Save native-archives-cache
        if: ${{ !cancelled() && steps.native-archives-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/astronomical-cache
        with:
          operation: save
          owner: native-archives
          path: ~/Library/Caches/Astronomical/native-dependencies
          key: astronomical-v2-native-archives-${{ runner.os }}-${{ hashFiles('third-party/native-dependency-manifest.cmake', 'third-party/pins/**') }}
      - name: Save native-build-cache
        # A miss means this run built the entry; saving it serves ci.yml too.
        if: ${{ !cancelled() && steps.native-build-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/astronomical-cache
        with:
          operation: save
          owner: native-build
          path: ${{ env.NATIVE_BUILD_ENTRY_DIRECTORY }}
          key: astronomical-v2-native-build-${{ runner.os }}-${{ runner.arch }}-${{ env.NATIVE_BUILD_IDENTITY }}
      - name: Save release-sccache-cache
        # Default branch only, as ci.yml's sccache: an entry saved by a
        # dispatch from another branch would never be superseded and would
        # only spend the cache budget. Each weekly run saves a fresh
        # generation for the next one.
        if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
        uses: ./.github/actions/astronomical-cache
        with:
          operation: save
          owner: release-sccache
          path: ~/Library/Caches/Astronomical/release-sccache
          key: astronomical-v2-release-sccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'third-party/tool-pins/Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
