# Merges the repository owner's pull requests the moment their last check
# turns green. The author constraint is deliberate: only pull requests opened
# by the repository owner qualify, so bot pull requests (dependabot and any
# other automation) always keep the regular manual-merge flow.
#
# The evaluation re-runs on the completion of every check-producing workflow,
# so the run whose completion turns the rollup green is always the one that
# performs the merge; there is no polling anywhere. The merge goes through the
# squash endpoint with the exact reviewed head SHA, and branch protection
# remains the final authority server-side.
#
# workflow_run is used instead of pull_request_target because GitHub's default
# Actions event policy blocks pull_request_target on public repositories (the
# same constraint the PR issue compliance split documents). The workflow_run
# event always executes the default-branch copy of this file, so pull-request
# code can never weaken the automerge policy; pull-request data enters only
# through the REST API and is never checked out or executed.
name: Owner PR automerge

on:
  workflow_run:
    workflows:
      - CI
      - PR issue compliance
    types:
      - completed

permissions:
  # The squash merge creates a commit on the base branch, so contents write
  # is required for the merge endpoint and for the head-branch deletion;
  # pull-requests write authorizes the merge endpoint itself.
  contents: write
  pull-requests: write

jobs:
  automerge-owner-pr:
    name: Automerge owner pull request when green
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    concurrency:
      group: owner-pr-automerge-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Automerge owner pull request when green
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const startedAtMilliseconds = Date.now();
            const headSha = context.payload.workflow_run.head_sha;
            const repositoryFullName = `${context.repo.owner}/${context.repo.repo}`;
            // The repository owner is the only author whose pull requests may
            // automerge; dependabot and every other automation keep the
            // manual merge flow.
            const ownerLogin = context.repo.owner;

            const { data: associatedPullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha,
            });
            const pullRequest = associatedPullRequests.find((candidate) =>
              candidate.state === "open"
              && candidate.draft === false
              && candidate.base.repo.full_name === repositoryFullName,
            );
            if (pullRequest === undefined) {
              core.info(`[owner-pr-automerge] status=skipped reason=no_open_owner_pull_request sha=${headSha}`);
              return;
            }
            if (pullRequest.user?.login !== ownerLogin) {
              core.info(
                `[owner-pr-automerge] status=skipped reason=author_not_owner author=${pullRequest.user?.login} pull_request=${pullRequest.number}`,
              );
              return;
            }

            const { data: fullPullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
            });
            const rollup = fullPullRequest.statusCheckRollup ?? [];
            const pending = [];
            const failed = [];
            for (const check of rollup) {
              // The rollup mixes check runs (status/conclusion) with commit
              // statuses (state); normalize both to green, pending, or failed.
              const checkStatus = check.status ?? "COMPLETED";
              const checkConclusion = check.conclusion ?? check.state;
              if (checkStatus !== "COMPLETED") {
                pending.push(check.name ?? check.context);
                continue;
              }
              if (!["success", "SUCCESS", "neutral", "NEUTRAL", "skipped", "SKIPPED"].includes(checkConclusion)) {
                failed.push(`${check.name ?? check.context}=${checkConclusion}`);
              }
            }
            if (pending.length > 0) {
              core.info(
                `[owner-pr-automerge] status=waiting pull_request=${pullRequest.number} pending=${pending.join(",")}`,
              );
              return;
            }
            if (failed.length > 0) {
              core.info(
                `[owner-pr-automerge] status=skipped reason=failing_checks pull_request=${pullRequest.number} failed=${failed.join(",")}`,
              );
              return;
            }
            // Branch protection requires the head to be up to date with the
            // base before merging; a green but stale pull request must be
            // updated first, and the update's own fresh checks re-trigger
            // this evaluation for the merge.
            if (fullPullRequest.mergeable_state === "behind") {
              try {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequest.number,
                  expected_head_sha: fullPullRequest.head.sha,
                });
                core.info(
                  `[owner-pr-automerge] status=branch_updated pull_request=${pullRequest.number}`,
                );
              } catch (error) {
                core.info(
                  `[owner-pr-automerge] status=skipped reason=branch_update_rejected pull_request=${pullRequest.number} message=${error.message}`,
                );
              }
              return;
            }
            if (fullPullRequest.mergeable_state === "dirty") {
              core.info(
                `[owner-pr-automerge] status=skipped reason=merge_conflict pull_request=${pullRequest.number}`,
              );
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
                merge_method: "squash",
                sha: headSha,
              });
              core.info(
                `[owner-pr-automerge] status=merged pull_request=${pullRequest.number} sha=${headSha}`,
              );
            } catch (error) {
              // The head moved or the pull request merged in a concurrent
              // evaluation; both are safe no-ops for the next completion.
              core.info(
                `[owner-pr-automerge] status=skipped reason=merge_rejected pull_request=${pullRequest.number} message=${error.message}`,
              );
              return;
            }

            if (fullPullRequest.head.repo?.full_name === repositoryFullName) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${fullPullRequest.head.ref}`,
                });
                core.info(`[owner-pr-automerge] status=branch_deleted branch=${fullPullRequest.head.ref}`);
              } catch (error) {
                core.info(`[owner-pr-automerge] status=branch_delete_skipped message=${error.message}`);
              }
            }
            core.info(
              `[owner-pr-automerge] status=complete elapsed_milliseconds=${Date.now() - startedAtMilliseconds}`,
            );
