[workspace]
members = [
    "crates/mlx-c-fork",
    "apps/astronomical-cli",
    "apps/inference-worker",
    "apps/daemon",
    "crates/config",
    "crates/ipc-protocol",
    "crates/model-serving",
    "crates/astronomical-memory-policy",
    "crates/astronomical-jangtq2-qwen35",
    "crates/native-build-tool",
    "crates/native-identity",
    "crates/quantization",
    "crates/rest-contract",
    "crates/test-harness",
    "crates/runtime-integration",
    "verification/e2e",
    "verification/acceptance",
    "xtask",
]
default-members = [
    "crates/mlx-c-fork",
    "apps/astronomical-cli",
    "apps/inference-worker",
    "apps/daemon",
    "crates/config",
    "crates/ipc-protocol",
    "crates/model-serving",
    "crates/astronomical-memory-policy",
    "crates/astronomical-jangtq2-qwen35",
    "crates/native-build-tool",
    "crates/native-identity",
    "crates/quantization",
    "crates/rest-contract",
    "crates/test-harness",
    "crates/runtime-integration",
    "verification/e2e",
    "verification/acceptance",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/aosama/astronomical"
# Bare "1.101" (no prerelease suffix) — cargo rejects a "-nightly" suffix
# here, and semver would rank the prerelease below the release anyway. The
# exact compiler remains pinned by rust-toolchain.toml
# (nightly-2026-10-18); this field only records the major.minor floor.
rust-version = "1.101"
version = "0.2.82"

[workspace.dependencies]
# The complete stock MLX-C bridge, published to crates.io as mlx-c-rust.
# The crate is versioned against the MLX release its bindings target (the
# 0.32.4 line matches the pinned MLX v0.32.4; the earlier 0.7.0-alpha.1
# spelling tracked the MLX-C release and was yanked upstream in favor of
# this MLX-congruent scheme). The dependency is bindings-only by way of
# default-features = false: the crate's `link` feature (its discovery
# ladder and its own native pair) stays off, so it emits no link
# directives and runtime-integration owns the linker — the Astronomical
# pair is patched, and the ladder's stock pair must never be selected
# (upstream aosama/mlx-c-rust#19 introduced this mode for exactly that
# consumer class). The Astronomical fork delta (the patched mlx_array_detach
# symbol) lives in the local astronomical-mlx-c-fork crate; bump this
# dependency together with the third-party MLX/MLX-C pins.
mlx-c-rust = { version = "0.32.4-alpha.2", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.23"
bytes = "1"
crc32fast = "1"
futures-util = { version = "0.3", features = ["sink"] }
fs4 = "1.1.0"
# url (pulled by reqwest in astronomical-daemon) → idna chooses its Unicode
# backend from whichever 1.x version stream of idna_adapter the lockfile
# resolves, because Cargo has no global-features mechanism (issue #606). The
# exact pin below selects the 1.1.x stream (unicode-bidi,
# unicode-normalization, idna_mapping, and three tiny helpers — seven small
# crates) instead of the default 1.2.x stream (the ICU4X stack:
# icu_normalizer, icu_properties, icu_collections, icu_provider, zerovec,
# yoke, zerofrom, zerotrie, and their data tables — nineteen crates). The
# daemon's reqwest client resolves only the Hugging Face HTTPS endpoints of
# the hub transport, where both backends behave identically, so the pin
# keeps IDNA (Internationalized Domain Names for Applications) correctness
# while removing the compiled footprint. If non-ASCII domain resolution is
# ever needed, move the pin to the 1.2.x stream.
idna_adapter = "=1.1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
safetensors = { version = "=0.8.0", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serial_test = "4"
sha1 = "=0.11.0"
sha2 = "=0.11.1"
thiserror = "2"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep source-line backtraces for Astronomical code without retaining full
# variable-level debug information or adjacent macOS dSYM generations.
#
# Incremental compilation stays at Cargo's default (on) for the local edit
# loop: a one-line edit to the serving crate rebuilds its direct-MLX test
# binary in about 2 s incrementally against about 6.4 s from scratch
# (measured on an Apple Silicon laptop), at roughly 0.4 GB of incremental
# cache per compiled variant. The setting was off for a while because
# sccache refuses incremental compilation; CI, which relies on sccache, now
# pins CARGO_INCREMENTAL=0 in its own environment (the variable overrides
# the profile), and a local machine that still wraps rustc with sccache
# must do the same or drop the wrapper.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"

# Third-party dependencies do not need local debug information.
[profile.dev.package."*"]
debug = false

# Tests share target/debug with development builds. Give them the same bounded
# diagnostics policy so acceptance feature combinations do not recreate the
# object-file growth avoided by the development profile.
[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"

[profile.test.package."*"]
debug = false

[profile.full-debug]
inherits = "dev"
debug = true
split-debuginfo = "packed"

[profile.release]
lto = "thin"
strip = "symbols"
