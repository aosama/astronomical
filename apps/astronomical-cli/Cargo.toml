[package]
name = "astronomical-cli"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
# One explicit test target: unit tests live inside src/ (lib test binary) and
# the verb journeys stay in tests/cli_journeys/ behind tests/offline_tests.rs.
# autotests = false keeps stray .rs files under tests/ from auto-discovering as
# extra linked test binaries.
autotests = false

[[bin]]
name = "astronomical"
path = "src/main.rs"

[[test]]
name = "offline_tests"
path = "tests/offline_tests.rs"

[lints]
workspace = true

[features]
default = []
# `astronomical quantize convert` runs the sensitivity sweep and the
# requantizer in-process, which links MLX and the model-serving engine into
# the CLI binary. The default CLI stays MLX-free: `quantize plan` (allocate
# from an existing sensitivity document) and `quantize inspect` (read an
# artifact's metadata) are pure and always available; `convert` is compiled
# in only with this feature, and without it the verb explains how to build
# a CLI that has it.
quantize-convert = [
    "astronomical-quantization/direct-mlx",
    "dep:astronomical-model-serving",
]

[dependencies]
astronomical-config = { path = "../../crates/config" }
astronomical-ipc-protocol = { path = "../../crates/ipc-protocol" }
astronomical-model-serving = { path = "../../crates/model-serving", features = ["direct-mlx"], optional = true }
astronomical-quantization = { path = "../../crates/quantization" }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
