[package]
name = "astronomical-cli"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
# One explicit test target: unit tests live inside src/ (lib test binary) and
# the verb journeys stay in tests/cli_journeys/ behind tests/hermetic_tests.rs.
# autotests = false keeps stray .rs files under tests/ from auto-discovering as
# extra linked test binaries.
autotests = false

[[bin]]
name = "astronomical"
path = "src/main.rs"

[[test]]
name = "hermetic_tests"
path = "tests/hermetic_tests.rs"

[lints]
workspace = true

[dependencies]
astronomical-config = { path = "../../crates/config" }
astronomical-ipc-protocol = { path = "../../crates/ipc-protocol" }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
