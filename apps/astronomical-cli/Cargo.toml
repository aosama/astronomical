[package]
name = "astronomical-cli"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
# One explicit test target, matching the workspace convention shared by the
# other integration-tested packages: the target root is
# tests/integration_tests.rs and the journey tree lives under
# tests/integration/ with shared stubs under tests/integration/support/.
# autotests = false keeps any stray .rs file under tests/ from
# auto-discovering as an extra test binary.
autotests = false

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest"]

[[bin]]
name = "astronomical"
path = "src/main.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[lints]
workspace = true

[features]
default = []
# `astronomical quantize convert` runs the sensitivity sweep and the
# requantizer in-process, which links MLX, the Qwen 3.5 family and its
# sensitivity probe into the CLI binary (not the serving worker). The default CLI stays MLX-free: `quantize plan` (allocate
# from an existing sensitivity document) and `quantize inspect` (read an
# artifact's metadata) are pure and always available; `convert` is compiled
# in only with this feature, and without it the verb explains how to build
# a CLI that has it.
quantize-convert = [
    "quantization/direct-mlx",
    "dep:qwen35-quantization-probe",
    "dep:memory-policy",
    "dep:runtime-integration",
]

[dependencies]
config = { path = "../../crates/foundation/config" }
expert-atlas = { path = "../../crates/engine/expert-atlas" }
decision-contract = { path = "../../crates/contracts/decision-contract" }
decision-training = { path = "../../crates/tooling/decision-training" }
ipc-protocol = { path = "../../crates/contracts/ipc-protocol" }
speech-contract = { path = "../../crates/contracts/speech-contract" }
qwen35-quantization-probe = { path = "../../crates/tooling/qwen35-quantization-probe", optional = true }
# The machine's memory ceiling the convert and evaluate verbs size MLX by.
memory-policy = { path = "../../crates/foundation/memory-policy", optional = true }
quantization = { path = "../../crates/tooling/quantization" }
runtime-integration = { path = "../../crates/foundation/runtime-integration", features = ["mlx"], optional = true }
vision-tower = { path = "../../crates/tooling/vision-tower" }
serde.workspace = true
serde_json.workspace = true
tempfile = "=3.27.0"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
