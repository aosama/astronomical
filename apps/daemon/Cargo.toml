[package]
name = "astronomical-daemon"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest"]

[package.metadata.cargo-machete]
# idna_adapter is a resolution-only pin with no import (see its entry below).
ignored = ["idna_adapter"]

# The daemon binary: a thin composition root (argument grammar, instance
# lock, startup failure reporting) over the library in src/.
[[bin]]
name = "astronomicald"
path = "src/bin/astronomicald/main.rs"

# Fixture executables the integration journeys spawn as real worker
# processes. They live in tests/fixtures/ (they are fixtures, not tests) and
# are declared here because cargo only links named bins; `cargo test` builds
# them so journeys can locate them through CARGO_BIN_EXE_*.
[[bin]]
name = "astronomical-daemon-test-worker"
path = "tests/fixtures/scripted_worker.rs"
bench = false
test = false

[[bin]]
name = "astronomical-daemon-idle-worker"
path = "tests/fixtures/idle_worker.rs"
bench = false
test = false

[[bin]]
name = "astronomical-daemon-test-daemon"
path = "tests/fixtures/test_daemon.rs"
bench = false
test = false

[[bin]]
name = "astronomical-daemon-loading-forever-worker"
path = "tests/fixtures/loading_forever_worker.rs"
bench = false
test = false

[[bin]]
name = "astronomical-daemon-delayed-engine-ready-worker"
path = "tests/fixtures/delayed_engine_ready_worker.rs"
bench = false
test = false

[[bin]]
name = "astronomical-daemon-mismatched-ready-worker"
path = "tests/fixtures/mismatched_ready_worker.rs"
bench = false
test = false

[[bin]]
name = "astronomical-daemon-stderr-probe-worker"
path = "tests/fixtures/stderr_probe_worker.rs"
bench = false
test = false

[[bin]]
name = "astronomical-daemon-replacement-ready-worker"
path = "tests/fixtures/replacement_ready_worker.rs"
bench = false
test = false

[lints]
workspace = true

[features]
# App Store channel: forwards the config crate's Application Support state-root
# resolution so store builds derive all state from the container-mapped
# location. Direct-channel builds stay on the home-directory dot-folder.
app-store-state-root = ["config/app-store-state-root"]

[dependencies]
config = { path = "../../crates/foundation/config" }
decision-contract = { path = "../../crates/contracts/decision-contract" }
ipc-protocol = { path = "../../crates/contracts/ipc-protocol" }
download-catalog = { path = "../../crates/tooling/download-catalog" }
lowercase-hex = { path = "../../crates/foundation/lowercase-hex" }
rest-contract = { path = "../../crates/contracts/rest-contract" }
speech-contract = { path = "../../crates/contracts/speech-contract" }
axum.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
fs4.workspace = true
# Resolution-only dependency: it pins the idna Unicode backend for the
# reqwest → url → idna chain above; see the workspace entry (issue #606).
idna_adapter.workspace = true
image.workspace = true
libc.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
# Matches reqwest's tower-http so one copy is compiled; the daemon uses only
# CorsLayer, whose API 0.7 did not change.
tower-http = { version = "0.6.11", features = ["cors"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
ipc-protocol = { path = "../../crates/contracts/ipc-protocol", features = ["test-support"] }
image.workspace = true
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
