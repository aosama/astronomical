[package]
name = "astronomical-inference-worker"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest"]

[[bin]]
name = "astronomical-inference-worker-scripted-worker"
path = "tests/fixtures/scripted_worker.rs"
bench = false
test = false

[[bin]]
name = "astronomical-inference-worker-stubborn-eof-worker"
path = "tests/fixtures/stubborn_eof_worker.rs"
bench = false
test = false

[lints]
workspace = true

[features]
performance-measurement = []
performance_throughput = []
serving-acceptance = []

[dependencies]
config = { path = "../../crates/foundation/config" }
ipc-protocol = { path = "../../crates/contracts/ipc-protocol" }
model-serving = { path = "../../crates/engine/model-serving", features = ["direct-mlx"] }
# The Linux physical-memory parser beside the machine ceiling it feeds.
memory-policy = { path = "../../crates/foundation/memory-policy" }
runtime-integration = { path = "../../crates/foundation/runtime-integration", features = ["mlx"] }
mlx-bridge.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
astronomical-daemon = { path = "../daemon" }
test-harness = { path = "../../crates/foundation/test-harness", features = ["flux-reference-oracle", "test-fixtures"] }
serde_json.workspace = true
serial_test.workspace = true
tempfile = "=3.27.0"
