<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The page is a rendering tenant for model output, so it may execute only its
      own bundled scripts and may load images only through the private asset
      scheme. The one network exception is connect-src for the loopback daemon:
      the page calls the REST API directly, so a payload that slips past
      sanitisation still cannot reach anywhere but this Mac's daemon.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' thintalk-asset:; style-src 'self' thintalk-asset: 'unsafe-inline'; img-src 'self' thintalk-asset: data:; font-src 'self' thintalk-asset:; connect-src http://127.0.0.1:* http://localhost:*; media-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <link rel="stylesheet" href="thintalk-asset://shell/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="thintalk-asset://shell/vendor/highlight-github-dark.min.css" />
    <link rel="stylesheet" href="thintalk-asset://shell/bundle.css" />
    <title>Astronomical</title>
  </head>
  <body>
    <div id="app">
      <!--
        The sidebar is app-owned chrome: the session list renders state the
        controller publishes, and every control reports an intent back.
      -->
      <nav id="sidebar" aria-label="Sessions">
        <div class="sidebar__header">
          <span class="sidebar__app-name">Astronomical</span>
          <button type="button" class="sidebar__new-chat" id="sidebar-new-chat" data-testid="sidebar-new-chat">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
            New chat
          </button>
        </div>
        <ul id="session-list" role="listbox" aria-label="Conversations"></ul>
      </nav>
      <div id="main">
        <div id="surface">
          <main id="transcript" role="log" aria-live="polite" aria-label="Conversation"></main>
          <section id="empty-state" class="empty-state" hidden>
            <h1 class="empty-state__title">Astronomical</h1>
            <p class="empty-state__subtitle">Ask your local model anything.</p>
            <p class="empty-state__notice" id="empty-state-notice"></p>
          </section>
        </div>
        <!--
          The failure banner and the composer are app-owned chrome, not model output,
          so their markup is static and nothing here passes through the sanitiser.
          Every control reports to the controller; the page owns no chat behaviour.
          Every interactive control carries an id equal to its data-testid, so
          assistive technology and automation agents share one stable identifier
          that survives layout changes (issue 752).
        -->
        <aside id="failure-banner" role="alert" data-testid="composer-banner" hidden>
          <div class="failure-banner__text">
            <p class="failure-banner__message" data-testid="banner-message"></p>
            <p class="failure-banner__next" data-testid="banner-next-action"></p>
          </div>
          <button type="button" class="failure-banner__retry" id="composer-retry" data-testid="composer-retry">Retry</button>
        </aside>
        <footer id="composer" class="composer">
          <textarea
            id="composer-input"
            data-testid="composer-input"
            aria-label="Message Astronomical"
            placeholder="Message Astronomical"
            rows="1"
          ></textarea>
          <div class="composer__actions">
            <div class="composer__group">
              <!--
                Astro's skill buttons. Each one only fills the message field with
                a starter question (src/astro/AstroComposerChrome.ts); the person
                still presses send. They sit inside the field as quiet icons, the
                place a Mac app keeps its attach controls, so Send stays the one
                coloured control; the title names each on hover. Shown while
                Astro is shown.
              -->
              <div id="skill-launchers" class="skill-launchers" role="group" aria-label="Skills" data-testid="skill-launchers" hidden>
                <button type="button" class="composer__icon skill-launcher" id="composer-skill-look" data-testid="composer-skill-look" data-skill="look" title="Look at a photo" aria-label="Look at a photo">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM3 16l5-4 4 3 3-2 6 4"/><circle cx="8.5" cy="9.5" r="1.3"/></svg>
                </button>
                <button type="button" class="composer__icon skill-launcher" id="composer-skill-read" data-testid="composer-skill-read" data-skill="read" title="Read a file" aria-label="Read a file">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM9 13h7M9 17h5"/></svg>
                </button>
                <button type="button" class="composer__icon skill-launcher" id="composer-skill-pictures" data-testid="composer-skill-pictures" data-skill="pictures" title="Draw" aria-label="Draw">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6-9 9H5v-6zM12 6l6 6"/></svg>
                </button>
              </div>
            </div>
            <div class="composer__group">
              <!--
                The model control: which model answers, and behind it one panel
                with every installed chat and picture model, the Tools switch and
                a way to the Models page (src/ModelPanelView.ts). It sits beside
                Send because it is a setting of the message, not a starter.
              -->
              <div class="composer__menu-anchor composer__menu-anchor--model">
                <button type="button" class="composer__model" id="composer-model" data-testid="composer-model" aria-label="Model" aria-haspopup="menu" aria-expanded="false" hidden>
                  <svg class="composer__model-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5a3 3 0 0 0-5.6-1.3 3.2 3.2 0 0 0-2.2 5.3 3.4 3.4 0 0 0 1.3 5.7A3.3 3.3 0 0 0 12 17.5z"/><path d="M12 6.5a3 3 0 0 1 5.6-1.3 3.2 3.2 0 0 1 2.2 5.3 3.4 3.4 0 0 1-1.3 5.7A3.3 3.3 0 0 1 12 17.5z"/></svg>
                  <span class="composer__model-label" data-testid="composer-model-label">Model</span>
                  <svg class="composer__chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                </button>
                <ul class="composer__menu composer__menu--models" id="composer-model-menu" data-testid="composer-model-menu" role="menu" aria-label="Models" hidden></ul>
              </div>
              <button type="button" class="composer__send" id="composer-send" data-testid="composer-send" aria-label="Send message" disabled>
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L13 3M13 3H6M13 3v7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
              </button>
              <button type="button" class="composer__send composer__send--stop" id="composer-stop" data-testid="composer-stop" aria-label="Stop streaming" hidden>
                <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
              </button>
            </div>
          </div>
        </footer>
        <!--
          Shown in place of the composer while messages are being picked for an
          export (src/MessagePicker.ts): how many are ticked, and the way back
          to the export sheet.
        -->
        <div id="pick-bar" class="pick-bar" data-testid="pick-bar" hidden>
          <p class="pick-bar__count" data-testid="pick-count" aria-live="polite"></p>
          <button type="button" class="pick-bar__cancel" id="pick-cancel" data-testid="pick-cancel">Cancel</button>
          <button type="button" class="pick-bar__done" id="pick-done" data-testid="pick-done">Export</button>
        </div>
        <p id="brief-notice" class="brief-notice" role="status" data-testid="brief-notice" hidden></p>
      </div>
      <!--
        The get-started journey covers the whole window, sidebar included, for
        a newcomer (and from Settings' "Show the welcome again"). Settings
        (⌘,) covers it the same way. Both sit inside #app so they
        inherit the title bar inset. They are app-owned chrome built by
        src/astro/GetStartedView.ts and src/astro/SettingsView.ts; nothing
        in them comes from a model.
      -->
      <section id="get-started" class="get-started" role="dialog" aria-modal="true" aria-label="Get started" data-testid="get-started" hidden></section>
      <section id="settings" class="settings" role="dialog" aria-modal="true" aria-label="Settings" data-testid="settings" hidden></section>
      <!--
        The export sheet, drawn by export.js (src/export/ExportSheetView.ts),
        which the page loads the first time someone exports.
      -->
      <section id="export-sheet" class="export-sheet" role="dialog" aria-modal="true" data-testid="export-sheet" hidden></section>
    </div>
    <!--
      KaTeX and mermaid stay as vendored globals because they are large, slow to
      parse, and only needed on demand; everything else is bundled with the app's
      TypeScript into bundle.js/bundle.css.
    -->
    <script src="thintalk-asset://shell/vendor/katex/katex.min.js"></script>
    <script src="thintalk-asset://shell/vendor/mermaid.min.js"></script>
    <script src="thintalk-asset://shell/bundle.js"></script>
  </body>
</html>
