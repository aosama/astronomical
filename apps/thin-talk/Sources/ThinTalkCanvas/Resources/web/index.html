<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The page is a rendering tenant for model output, so it may execute only its
      own bundled scripts and may load images only through the private asset
      scheme. The one network exception is connect-src for the loopback daemon:
      the page calls the REST API directly, so a payload that slips past
      sanitisation still cannot reach anywhere but this Mac's daemon.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' thintalk-asset:; style-src 'self' thintalk-asset: 'unsafe-inline'; img-src 'self' thintalk-asset: data:; font-src 'self' thintalk-asset:; connect-src http://127.0.0.1:* http://localhost:*; media-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <link rel="stylesheet" href="thintalk-asset://shell/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="thintalk-asset://shell/vendor/highlight-github-dark.min.css" />
    <link rel="stylesheet" href="thintalk-asset://shell/bundle.css" />
    <title>Thin Talk</title>
  </head>
  <body>
    <div id="app">
      <!--
        The sidebar is app-owned chrome: the session list renders state the
        controller publishes, and every control reports an intent back.
      -->
      <nav id="sidebar" aria-label="Sessions">
        <div class="sidebar__header">
          <span class="sidebar__app-name">Thin Talk</span>
          <button type="button" class="sidebar__new-chat" id="sidebar-new-chat" data-testid="sidebar-new-chat">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
            New chat
          </button>
        </div>
        <ul id="session-list" role="listbox" aria-label="Conversations"></ul>
      </nav>
      <div id="main">
        <div id="surface">
          <main id="transcript" role="log" aria-live="polite" aria-label="Conversation"></main>
          <section id="empty-state" class="empty-state" hidden>
            <h1 class="empty-state__title">Thin Talk</h1>
            <p class="empty-state__subtitle">Ask your local model anything.</p>
            <p class="empty-state__notice" id="empty-state-notice"></p>
          </section>
        </div>
        <!--
          The failure banner and the composer are app-owned chrome, not model output,
          so their markup is static and nothing here passes through the sanitiser.
          Every control reports to the controller; the page owns no chat behaviour.
          Every interactive control carries an id equal to its data-testid, so
          assistive technology and automation agents share one stable identifier
          that survives layout changes (issue 752).
        -->
        <aside id="failure-banner" role="alert" data-testid="composer-banner" hidden>
          <div class="failure-banner__text">
            <p class="failure-banner__message" data-testid="banner-message"></p>
            <p class="failure-banner__next" data-testid="banner-next-action"></p>
          </div>
          <button type="button" class="failure-banner__retry" id="composer-retry" data-testid="composer-retry">Retry</button>
        </aside>
        <!--
          Astro's skill buttons. Each one only fills the message field with a
          starter question (src/astro/AstroComposerChrome.ts); the person still
          presses send. Shown while Astro is shown.
        -->
        <div id="skill-launchers" class="skill-launchers" role="group" aria-label="Skills" data-testid="skill-launchers" hidden>
          <button type="button" class="skill-launcher skill-launcher--pictures" id="composer-skill-pictures" data-testid="composer-skill-pictures" data-skill="pictures" title="Draw">
            <span class="skill-launcher__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v16H3zM3 18l6-5 4 3 3-2 5 4"/></svg></span><span class="skill-launcher__name">Draw</span>
          </button>
          <button type="button" class="skill-launcher skill-launcher--look" id="composer-skill-look" data-testid="composer-skill-look" data-skill="look" title="Look at a photo">
            <span class="skill-launcher__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6"/></svg></span><span class="skill-launcher__name">Look at a photo</span>
          </button>
          <button type="button" class="skill-launcher skill-launcher--read" id="composer-skill-read" data-testid="composer-skill-read" data-skill="read" title="Read a file">
            <span class="skill-launcher__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM9 13h7M9 17h5"/></svg></span><span class="skill-launcher__name">Read a file</span>
          </button>
          <button type="button" class="skill-launcher skill-launcher--voice" id="composer-skill-voice" data-testid="composer-skill-voice" data-skill="voice" title="Talking to Astro is coming soon" aria-disabled="true">
            <span class="skill-launcher__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10M8 8v6M16 8v6"/></svg></span><span class="skill-launcher__name">Talk (soon)</span>
          </button>
        </div>
        <footer id="composer" class="composer">
          <img id="composer-astro" class="composer__astro" src="astro/astro-look-4.webp" alt="" data-testid="composer-astro">
          <textarea
            id="composer-input"
            data-testid="composer-input"
            aria-label="Message Thin Talk"
            placeholder="Message Thin Talk"
            rows="1"
          ></textarea>
          <div class="composer__actions">
            <div class="composer__group">
              <div class="composer__menu-anchor">
                <button type="button" class="composer__pill" id="composer-model" data-testid="composer-model" aria-label="Chat model" aria-haspopup="menu" aria-expanded="false" hidden>
                  <span data-testid="composer-model-label">Model</span>
                  <svg class="composer__chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                </button>
                <ul class="composer__menu" id="composer-model-menu" data-testid="composer-model-menu" role="menu" hidden></ul>
              </div>
              <div class="composer__menu-anchor composer__menu-anchor--image-model">
                <button type="button" class="composer__pill" id="composer-image-model" data-testid="composer-image-model" aria-label="Image model" aria-haspopup="menu" aria-expanded="false" hidden>
                  <svg class="composer__pill-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.6" stroke="currentColor" stroke-width="1.4" fill="none"/><circle cx="6" cy="6.6" r="1.2" fill="currentColor"/><path d="M2.8 12l3.6-3.6 2.4 2.4 1.6-1.6 2.8 2.8" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" fill="none"/></svg>
                  <span data-testid="composer-image-model-label">Pictures</span>
                  <svg class="composer__chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                </button>
                <ul class="composer__menu" id="composer-image-model-menu" data-testid="composer-image-model-menu" role="menu" hidden></ul>
              </div>
            </div>
            <div class="composer__group">
              <button type="button" class="composer__send" id="composer-send" data-testid="composer-send" aria-label="Send message" disabled>
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L13 3M13 3H6M13 3v7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
              </button>
              <button type="button" class="composer__send composer__send--stop" id="composer-stop" data-testid="composer-stop" aria-label="Stop streaming" hidden>
                <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
              </button>
            </div>
          </div>
        </footer>
      </div>
      <!--
        Astro's first flight covers the whole window, sidebar included, for a
        newcomer (and on Your Astro's "Replay"). Your Astro, opened from
        Settings (⌘,), covers it the same way. Both sit inside #app so they
        inherit the title bar inset. They are app-owned chrome built by
        src/astro/FirstFlightView.ts and src/astro/YourAstroView.ts; nothing
        in them comes from a model.
      -->
      <section id="first-flight" class="first-flight" role="dialog" aria-modal="true" aria-label="Meet Astro" data-testid="first-flight" hidden></section>
      <section id="your-astro" class="your-astro" role="dialog" aria-modal="true" aria-label="Your Astro" data-testid="your-astro" hidden></section>
    </div>
    <!--
      KaTeX and mermaid stay as vendored globals because they are large, slow to
      parse, and only needed on demand; everything else is bundled with the app's
      TypeScript into bundle.js/bundle.css.
    -->
    <script src="thintalk-asset://shell/vendor/katex/katex.min.js"></script>
    <script src="thintalk-asset://shell/vendor/mermaid.min.js"></script>
    <script src="thintalk-asset://shell/bundle.js"></script>
  </body>
</html>
