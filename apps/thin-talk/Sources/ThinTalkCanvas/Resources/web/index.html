<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The page is a rendering tenant for model output, so it may execute only its
      own bundled scripts and may load images only through the private asset
      scheme. `connect-src 'none'` and `default-src 'none'` mean a payload that
      slips past sanitisation still cannot reach the network.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' thintalk-asset:; style-src 'self' thintalk-asset: 'unsafe-inline'; img-src 'self' thintalk-asset: data:; font-src 'self' thintalk-asset:; connect-src 'none'; media-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <link rel="stylesheet" href="thintalk-asset://shell/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="thintalk-asset://shell/vendor/highlight-github-dark.min.css" />
    <link rel="stylesheet" href="thintalk-asset://shell/canvas.css" />
    <title>Thin Talk</title>
  </head>
  <body>
    <div id="surface">
      <main id="transcript" role="log" aria-live="polite" aria-label="Conversation"></main>
      <section id="empty-state" class="empty-state" hidden>
        <h1 class="empty-state__title">Thin Talk</h1>
        <p class="empty-state__subtitle">Ask your local model anything.</p>
        <p class="empty-state__notice" id="empty-state-notice"></p>
      </section>
    </div>
    <!--
      The failure banner and the composer are app-owned chrome, not model output,
      so their markup is static and nothing here passes through the sanitiser.
      Every control reports to Swift; the page owns no behaviour.
    -->
    <aside id="failure-banner" role="alert" data-testid="composer-banner" hidden>
      <div class="failure-banner__text">
        <p class="failure-banner__message" data-testid="banner-message"></p>
        <p class="failure-banner__next" data-testid="banner-next-action"></p>
      </div>
      <button type="button" class="failure-banner__retry" data-testid="composer-retry">Retry</button>
    </aside>
    <footer id="composer" class="composer">
      <textarea
        id="composer-input"
        data-testid="composer-input"
        aria-label="Message Thin Talk"
        placeholder="Message Thin Talk"
        rows="1"
      ></textarea>
      <div class="composer__actions">
        <div class="composer__group">
          <button type="button" class="composer__icon" data-testid="composer-attach" aria-label="Attach file" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
          </button>
          <div class="composer__menu-anchor">
            <button type="button" class="composer__pill" data-testid="composer-effort" aria-label="Thinking level" aria-haspopup="menu" aria-expanded="false">
              <span data-testid="composer-effort-label">Quick</span>
              <svg class="composer__chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            </button>
            <ul class="composer__menu" data-testid="composer-effort-menu" role="menu" hidden></ul>
          </div>
          <button type="button" class="composer__pill" data-testid="composer-features" aria-label="Features" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l1.4 4.6L14 8l-4.6 1.4L8 14l-1.4-4.6L2 8l4.6-1.4z" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="composer__group">
          <button type="button" class="composer__icon" data-testid="composer-visual" aria-label="Toggle visual mode" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="5" cy="9" r="3" stroke="currentColor" stroke-width="1.4" fill="none"/><circle cx="11" cy="9" r="3" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8 9h0M2.5 6L4 4M13.5 6L12 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
          </button>
          <button type="button" class="composer__icon" data-testid="composer-voice" aria-label="Voice input" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 9v-2M6 11V5M9 13V3M12 11V5M14 9V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
          </button>
          <button type="button" class="composer__send" data-testid="composer-send" aria-label="Send message" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L13 3M13 3H6M13 3v7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </button>
          <button type="button" class="composer__send composer__send--stop" data-testid="composer-stop" aria-label="Stop streaming" hidden>
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </footer>
    <!--
      Script order is the dependency order of the canvas modules: the content-key
      and trust foundations, then the maths and diagram pipelines that build on
      them, then the renderer that composes answers, then the transcript layer.
    -->
    <script src="thintalk-asset://shell/vendor/morphdom-umd.min.js"></script>
    <script src="thintalk-asset://shell/vendor/purify.min.js"></script>
    <script src="thintalk-asset://shell/vendor/katex/katex.min.js"></script>
    <script src="thintalk-asset://shell/vendor/mermaid.min.js"></script>
    <script src="thintalk-asset://shell/vendor/marked.min.js"></script>
    <script src="thintalk-asset://shell/vendor/highlight.min.js"></script>
    <script src="thintalk-asset://shell/canvas-content-key.js"></script>
    <script src="thintalk-asset://shell/canvas-trust.js"></script>
    <script src="thintalk-asset://shell/canvas-math.js"></script>
    <script src="thintalk-asset://shell/canvas-diagrams.js"></script>
    <script src="thintalk-asset://shell/canvas-render.js"></script>
    <script src="thintalk-asset://shell/canvas-composer.js"></script>
    <script src="thintalk-asset://shell/canvas.js"></script>
  </body>
</html>
