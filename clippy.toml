# Clippy configuration, searched from the workspace root and applied to every
# member crate.
#
# Function-length budget: 100 clippy code-lines. Clippy counts only lines that
# carry code — comment lines and blank lines are excluded (with stateful
# /* */ handling) — so documentation-heavy functions read shorter here than
# their raw brace-to-brace span suggests. Keep any other measurement in line
# with that definition or the numbers will disagree.
#
# The lint (clippy::too_many_lines, pedantic group, allow-by-default) is
# ARMED: "deny" under [workspace.lints.clippy] in the root Cargo.toml (and in
# the runtime-integration and acceptance crates' own lints tables), with
# #[expect] on every pre-existing over-budget function. The budget therefore
# fails any build that crosses it, an #[expect] self-cleans when its function
# shrinks below the budget, and `cargo xtask function-length` now reports
# UNTRACKED over-budget functions (zero while every site carries its expect;
# the tracked-debt count is `git grep -c 'expect(clippy::too_many_lines)'`).
# The pre-commit hook re-proves the default and MLX worlds on Rust-touching
# commits; CI's clippy budget steps cover all three worlds including the
# acceptance feature superset.
#
# Report runs must set CARGO_BUILD_WARNINGS=warn (the lane does). The
# repository denies warnings via [build] warnings, which turns this lint into
# an error and aborts dependent crates, truncating the report. Never set
# CARGO_BUILD_WARNINGS=allow for clippy accounting: it suppresses diagnostics
# entirely instead of merely downgrading them.
too-many-lines-threshold = 100
