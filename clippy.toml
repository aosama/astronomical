# Clippy configuration, searched from the workspace root and applied to every
# member crate.
#
# Function-length budget: 80 clippy code-lines, the limit AGENTS.md sets for
# every function, production and test alike (it was 100 until the limit was
# lowered). No code may carry an #[allow] or #[expect] against it:
# `cargo xtask function-length-budget` refuses one before running clippy.
# Clippy counts only lines that carry code — comment lines and blank lines
# are excluded (with stateful /* */ handling) — so documentation-heavy
# functions read shorter here than their raw brace-to-brace span suggests. Keep any other measurement in line
# with that definition or the numbers will disagree.
#
# The lint (clippy::too_many_lines, pedantic group, allow-by-default) is
# ARMED: "deny" under [workspace.lints.clippy] in the root Cargo.toml (and in
# the runtime-integration and acceptance crates' own lints tables), so the
# budget fails any build that crosses it.
#
# WHERE it is enforced (policy decision, 2026-10-31): the pre-commit hook
# ONLY — no clippy runs in GitHub Actions at all, so the hook's single
# default-world pass is the budget's sole proof. The hook run reuses Cargo's
# incremental-compilation state; feature-gated code is linted by the developer's own lane
# runs. Rustc-level warnings stay denied in every CI compile through the
# [build] warnings policy; only clippy-only lints left CI.
#
# The complexity ratchet beside this length budget is cargo-crap's, run through
# `cargo xtask crap-baseline` (see .cargo-crap.toml): it parses
# sources without compiling, scores every function — tests included, #[test]
# functions excepted by the tool — and fails when any function's cyclomatic
# complexity grows against the committed baseline, or when a function the
# baseline does not list yet exceeds complexity 15. When cargo-crap's
# structural-signals release ships, gating lines there restores an explicit
# line-count ratchet.
#
# Report runs must set CARGO_BUILD_WARNINGS=warn (the lane does). The
# repository denies warnings via [build] warnings, which turns this lint into
# an error and aborts dependent crates, truncating the report. Never set
# CARGO_BUILD_WARNINGS=allow for clippy accounting: it suppresses diagnostics
# entirely instead of merely downgrading them.
too-many-lines-threshold = 80
