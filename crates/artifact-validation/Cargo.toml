[package]
name = "astronomical-artifact-validation"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
# Keeps each tensor's absolute file range for the MLX loaders; adds no
# dependency.
direct-mlx = []

# One-way edge: every model family depends on this crate and it depends on
# none of them; `cargo xtask check-architecture` enforces the serving edge.
[dependencies]
# Bounded safetensors header parsing and the strict-JSON duplicate guard.
astronomical-memory-policy = { path = "../memory-policy" }
# Decodes Hugging Face snapshot folder names into model ids.
astronomical-config = { path = "../config" }
astronomical-lowercase-hex = { path = "../lowercase-hex" }
libc.workspace = true
safetensors.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
