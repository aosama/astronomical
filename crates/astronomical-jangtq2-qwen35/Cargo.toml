[package]
name = "astronomical-jangtq2-qwen35"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
# The graphics-processor worlds: the Metal codebook decode kernels, the fused
# gathered projection kernel, and their serial measurement tests. The pure
# format contract (entry parsing, codebook math, Hadamard rotation, on-disk
# tensor inventory, golden vectors) builds and tests in the offline lane
# without any of this, so a contract change never rebuilds the graphics-
# processor world.
direct-mlx = ["dep:astronomical-runtime-integration", "dep:astronomical-mlx-c-rust"]

[dependencies]
astronomical-mlx-c-rust = { path = "../mlx-c-rust", optional = true }
astronomical-runtime-integration = { path = "../runtime-integration", features = ["mlx"], optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
serial_test.workspace = true
