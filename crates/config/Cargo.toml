[package]
name = "astronomical-config"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
astronomical-expert-atlas = { path = "../expert-atlas" }
astronomical-lowercase-hex = { path = "../lowercase-hex" }
# The voice-name rule discovery lists speech voices by, shared with the
# engines that load them; pure Rust with no further dependencies.
astronomical-speech-contract = { path = "../speech-contract" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"

[features]
# App Store channel: default state roots resolve beneath the platform-standard
# macOS Application Support directory (mapped into the sandbox container)
# instead of a home-directory dot-folder. See AstronomicalInstancePaths.
app-store-state-root = []
