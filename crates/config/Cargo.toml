[package]
name = "config"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest"]

[lints]
workspace = true

[dependencies]
expert-atlas = { path = "../expert-atlas" }
lowercase-hex = { path = "../lowercase-hex" }
# The voice-name rule discovery lists speech voices by, shared with the
# engines that load them; pure Rust with no further dependencies.
speech-contract = { path = "../speech-contract" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
test-harness = { path = "../test-harness", features = ["test-fixtures"] }

[features]
# App Store channel: default state roots resolve beneath the platform-standard
# macOS Application Support directory (mapped into the sandbox container)
# instead of a home-directory dot-folder. See AstronomicalInstancePaths.
app-store-state-root = []
