[package]
name = "speech-contract"
description = "The text-to-speech contract shared by the worker, daemon and CLI: the request and its model-independent checks, the failure reasons, and PCM and WAV audio encoding."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# No graphics-processor dependency: the daemon and the CLI encode and check
# speech without linking MLX, as decision-contract serves decisions.

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = []

[dependencies]
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
