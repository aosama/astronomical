[package]
name = "decision-models"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
direct-mlx = ["dep:runtime-integration", "dep:mlx-bridge", "qwen35/direct-mlx", "engine-core/direct-mlx", "model-primitives/direct-mlx"]

# The decision and embedding models (issue #2340), above the Qwen 3.5 family
# their Kev and Clef backbones come from. One-way edge: nothing here may depend
# on model-serving; `cargo xtask check-architecture` enforces it.
[dependencies]
# The decision-model contract: typed questions, calibration, typed answers and
# each family's prompt layout.
decision-contract = { path = "../decision-contract" }
# Calibration and training; this crate is its one consumer among the model
# crates.
decision-training = { path = "../decision-training" }
engine-core = { path = "../engine-core" }
model-primitives = { path = "../model-primitives" }
ipc-protocol = { path = "../ipc-protocol" }
memory-policy = { path = "../memory-policy" }
qwen35 = { path = "../qwen35" }
runtime-integration = { path = "../runtime-integration", features = ["mlx"], optional = true }
mlx-bridge = { workspace = true, optional = true }
safetensors.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokenizers.workspace = true

[dev-dependencies]
# Skips the tests of Astronomical's own Metal kernels where there is no Metal.
test-harness = { path = "../test-harness" }
model-primitives = { path = "../model-primitives", features = ["test-support"] }
# The GPU tests sample the process-global MLX allocator, so they serialize.
serial_test.workspace = true
tempfile = "=3.27.0"
