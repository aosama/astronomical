[package]
name = "astronomical-decision-models"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
direct-mlx = ["dep:astronomical-runtime-integration", "dep:mlx-bridge", "astronomical-qwen35/direct-mlx", "astronomical-engine-core/direct-mlx", "astronomical-model-primitives/direct-mlx"]

# The decision and embedding models (issue #2340), above the Qwen 3.5 family
# their Kev and Clef backbones come from. One-way edge: nothing here may depend
# on astronomical-model-serving; `cargo xtask check-architecture` enforces it.
[dependencies]
# The decision-model contract: typed questions, calibration, typed answers and
# each family's prompt layout.
astronomical-decision-contract = { path = "../decision-contract" }
# Calibration and training; this crate is its one consumer among the model
# crates.
astronomical-decision-training = { path = "../decision-training" }
astronomical-engine-core = { path = "../engine-core" }
astronomical-model-primitives = { path = "../model-primitives" }
astronomical-ipc-protocol = { path = "../ipc-protocol" }
astronomical-memory-policy = { path = "../memory-policy" }
astronomical-qwen35 = { path = "../qwen35" }
astronomical-runtime-integration = { path = "../runtime-integration", features = ["mlx"], optional = true }
mlx-bridge = { workspace = true, optional = true }
safetensors.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokenizers.workspace = true

[dev-dependencies]
astronomical-model-primitives = { path = "../model-primitives", features = ["test-support"] }
# The GPU tests sample the process-global MLX allocator, so they serialize.
serial_test.workspace = true
tempfile = "=3.27.0"
