[package]
name = "astronomical-decision-training"
description = "Calibrating and training decision models on a person's own labelled examples: the example format, held-out splits, temperature fitting, CPU training of the final layers, the never-worse gates and the proven model folder, with no graphics-processor dependency."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Unit tests live beside their source as `*_tests.rs` modules inside `src/`.
# `autotests = false` keeps stray .rs files under tests/ from
# auto-discovering as extra test binaries.
autotests = false

[lints]
workspace = true

[dependencies]
astronomical-decision-contract = { path = "../decision-contract" }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
safetensors.workspace = true
tempfile = "=3.27.0"
