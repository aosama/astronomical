[package]
name = "astronomical-engine-core"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
direct-mlx = ["dep:astronomical-runtime-integration", "dep:mlx-bridge", "astronomical-gpu-building-blocks/direct-mlx"]

# The engine contract, MLX memory and the astro_decoder_state_cache, below
# every model family (issue #2340). One-way edge: nothing here may depend on a
# family or on astronomical-model-serving; `cargo xtask check-architecture`
# enforces the serving edge.
[dependencies]
astronomical-gpu-building-blocks = { path = "../gpu-building-blocks" }
astronomical-ipc-protocol = { path = "../ipc-protocol" }
astronomical-memory-policy = { path = "../memory-policy" }
astronomical-runtime-integration = { path = "../runtime-integration", features = ["mlx"], optional = true }
mlx-bridge = { workspace = true, optional = true }
libc.workspace = true
# Grammar-constrained decoding for structured generation.
regex-automata = "0.4"
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# start_paused virtual time for #[tokio::test(start_paused = true)] bodies.
tokio = { workspace = true, features = ["test-util"] }
# The GPU tests sample the process-global MLX allocator, so they serialize.
serial_test.workspace = true
tempfile = "=3.27.0"
