[package]
name = "engine-core"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.astronomical]
# Builds on macOS only for now; the pre-commit hook's function-length
# pass (`cargo xtask function-length-budget`) leaves it out on other hosts.
# Drop this table once it builds on Linux (#2424).
host-platforms = ["macos"]

[lints]
workspace = true

[features]
default = []
direct-mlx = ["dep:runtime-integration", "dep:mlx-bridge", "model-primitives/direct-mlx"]

# The engine contract, MLX memory and the astro_decoder_state_cache, below
# every model family (issue #2340). One-way edge: nothing here may depend on a
# family or on model-serving; `cargo xtask check-architecture`
# enforces the serving edge.
[dependencies]
model-primitives = { path = "../model-primitives" }
ipc-protocol = { path = "../ipc-protocol" }
memory-policy = { path = "../memory-policy" }
runtime-integration = { path = "../runtime-integration", features = ["mlx"], optional = true }
mlx-bridge = { workspace = true, optional = true }
libc.workspace = true
# Grammar-constrained decoding for structured generation.
regex-automata = "0.4"
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# start_paused virtual time for #[tokio::test(start_paused = true)] bodies.
tokio = { workspace = true, features = ["test-util"] }
# The GPU tests sample the process-global MLX allocator, so they serialize.
serial_test.workspace = true
tempfile = "=3.27.0"
