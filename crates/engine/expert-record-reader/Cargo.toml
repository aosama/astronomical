[package]
name = "expert-record-reader"
description = "Reads expert records from storage straight into memory the caller owns: one scatter read per record, issued from long-lived threads."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
build = "build.rs"

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = []

[lints]
workspace = true

[dependencies]
libc.workspace = true
thiserror.workspace = true

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = "=3.27.0"
