[package]
name = "model-serving"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest", "direct-mlx"]
direct-mlx-lane-feature = "direct-mlx"

[lints]
workspace = true

[features]
default = []
direct-mlx = ["decision-models/direct-mlx", "qwen35/direct-mlx", "artifact-validation/direct-mlx", "engine-core/direct-mlx", "image-generation/direct-mlx", "model-primitives/direct-mlx", "speech/direct-mlx", "dep:runtime-integration"]

# The worker and the wiring between model families (issue #2340). Every crate
# below is consumed one way; `cargo xtask check-architecture` holds each of
# the split-out crates off this one.
[dependencies]
# Model folder validation every family shares.
artifact-validation = { path = "../../foundation/artifact-validation" }
# The engine contract, MLX memory and the astro_decoder_state_cache, below the
# families.
engine-core = { path = "../engine-core" }
# The Qwen 3.5 family, which the decision models score on and the worker
# serves.
qwen35 = { path = "../../families/text/qwen35" }
# The decision and embedding models and their seams.
decision-models = { path = "../../families/decision/decision-models" }
# The image generation families and their worker seam.
image-generation = { path = "../../families/image/image-generation" }
# The model primitives every family shares.
model-primitives = { path = "../model-primitives" }
# The text-to-speech families and their worker seam.
speech = { path = "../../families/speech/speech" }
config = { path = "../../foundation/config" }
# The decision-model contract the worker passes to and from the decision
# engines.
decision-contract = { path = "../../contracts/decision-contract" }
# The speech request, failures and audio encoding the worker passes to and
# from the speech engines.
speech-contract = { path = "../../contracts/speech-contract" }
ipc-protocol = { path = "../../contracts/ipc-protocol" }
# Pure memory policy (budget composition, admission, residency planning,
# serving ceiling), with no MLX dependency.
memory-policy = { path = "../../foundation/memory-policy" }
lowercase-hex = { path = "../../foundation/lowercase-hex" }
runtime-integration = { path = "../../foundation/runtime-integration", features = ["mlx"], optional = true }
image.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# The OptiQ artifact round-trip integration test reads the quantizer's schemas.
quantization = { path = "../../tooling/quantization" }
test-harness = { path = "../../foundation/test-harness", features = ["test-fixtures"] }
model-primitives = { path = "../model-primitives", features = ["test-support"] }
# start_paused virtual time for #[tokio::test(start_paused = true)] bodies.
tokio = { workspace = true, features = ["test-util"] }
tempfile = "=3.27.0"
