[package]
name = "english-phonemes"
description = "Turns English text into the phoneme strings the Kokoro speech model reads, from the Misaki pronunciation lexicon Kokoro was trained with."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = []

[dependencies]
english-number-words = { path = "../english-number-words" }
serde_json.workspace = true

[lints]
workspace = true
