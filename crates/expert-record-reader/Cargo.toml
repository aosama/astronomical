[package]
name = "expert-record-reader"
description = "Reads expert records from storage straight into memory the caller owns: one scatter read per record, issued from long-lived threads."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
build = "build.rs"

[package.metadata.astronomical]
# Builds on macOS only for now; the pre-commit hook's function-length
# pass (`cargo xtask function-length-budget`) leaves it out on other hosts.
# Drop this table once it builds on Linux (#2424).
host-platforms = ["macos"]

[lints]
workspace = true

[dependencies]
libc.workspace = true
thiserror.workspace = true

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = "=3.27.0"
