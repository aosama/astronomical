[package]
name = "decision-models"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest", "direct-mlx"]
direct-mlx-lane-feature = "direct-mlx"

[lints]
workspace = true

[features]
default = []
direct-mlx = ["dep:runtime-integration", "dep:mlx-bridge", "qwen35/direct-mlx", "engine-core/direct-mlx", "model-primitives/direct-mlx"]
# The directional gradient check (`training::directional_gradient_check`):
# a diagnostic the acceptance journeys run on a real checkpoint to prove a
# backend's backward pass, kept out of the serving build (issue #2699).
gradient-check = ["direct-mlx"]

# The decision shell (issues #2340, #2473): what every decision family
# shares, above the Qwen 3.5 family the Kev and Clef backbone comes from.
# Each family is a crate of its own beside it. One-way edge: nothing here may depend
# on model-serving; `cargo xtask check-architecture` enforces it.
[dependencies]
# The decision-model contract: typed questions, calibration, typed answers and
# each family's prompt layout.
decision-contract = { path = "../../../contracts/decision-contract" }
# Calibration and training; this crate is its one consumer among the model
# crates.
decision-training = { path = "../../../tooling/decision-training" }
engine-core = { path = "../../../engine/engine-core" }
model-primitives = { path = "../../../engine/model-primitives" }
ipc-protocol = { path = "../../../contracts/ipc-protocol" }
memory-policy = { path = "../../../foundation/memory-policy" }
qwen35 = { path = "../../text/qwen35" }
runtime-integration = { path = "../../../foundation/runtime-integration", features = ["mlx"], optional = true }
mlx-bridge = { workspace = true, optional = true }
safetensors.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokenizers.workspace = true

[dev-dependencies]
# Skips the tests of Astronomical's own Metal kernels where there is no Metal.
test-harness = { path = "../../../foundation/test-harness" }
model-primitives = { path = "../../../engine/model-primitives", features = ["test-support"] }
# The GPU tests sample the process-global MLX allocator, so they serialize.
serial_test.workspace = true
tempfile = "=3.27.0"
