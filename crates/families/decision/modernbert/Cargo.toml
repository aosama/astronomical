[package]
name = "modernbert"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest", "direct-mlx"]
direct-mlx-lane-feature = "direct-mlx"

[lints]
workspace = true

[features]
default = []
direct-mlx = ["decision-models/direct-mlx", "dep:runtime-integration", "dep:mlx-bridge", "engine-core/direct-mlx", "model-primitives/direct-mlx"]

# The ModernBERT embedding family, on the shared ModernBERT trunk.
# One crate per family (issue #2473, Step 7); the decision-models shell
# beside it holds what every decision family shares. One-way edges: nothing
# here may depend on model-serving or on another decision family.
[dependencies]
# The decision shell every decision family shares.
decision-models = { path = "../decision-models" }
engine-core = { path = "../../../engine/engine-core" }
model-primitives = { path = "../../../engine/model-primitives" }
ipc-protocol = { path = "../../../contracts/ipc-protocol" }
memory-policy = { path = "../../../foundation/memory-policy" }
runtime-integration = { path = "../../../foundation/runtime-integration", features = ["mlx"], optional = true }
mlx-bridge = { workspace = true, optional = true }
safetensors.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokenizers.workspace = true

[dev-dependencies]
model-primitives = { path = "../../../engine/model-primitives", features = ["test-support"] }
