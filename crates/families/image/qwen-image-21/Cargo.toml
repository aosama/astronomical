[package]
name = "qwen-image-21"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest", "direct-mlx"]
direct-mlx-lane-feature = "direct-mlx"

[lints]
workspace = true

[features]
default = []
direct-mlx = ["image-generation/direct-mlx", "dep:runtime-integration", "dep:mlx-bridge", "model-primitives/direct-mlx", "artifact-validation/direct-mlx"]

# The Qwen-Image-2.1 image family.
# One crate per family (issue #2473, Step 7); the image-generation shell
# beside it holds the seam every image family implements. One-way edges:
# nothing here may depend on model-serving or on another image family.
[dependencies]
# The image engine seam and shell every image family shares.
image-generation = { path = "../image-generation" }
artifact-validation = { path = "../../../foundation/artifact-validation" }
model-primitives = { path = "../../../engine/model-primitives" }
ipc-protocol = { path = "../../../contracts/ipc-protocol" }
memory-policy = { path = "../../../foundation/memory-policy" }
runtime-integration = { path = "../../../foundation/runtime-integration", features = ["mlx"], optional = true }
mlx-bridge = { workspace = true, optional = true }
image.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
tracing.workspace = true

[dev-dependencies]
image-generation = { path = "../image-generation", features = ["test-support"] }
test-harness = { path = "../../../foundation/test-harness", features = ["test-fixtures"] }
# The GPU tests sample the process-global MLX allocator, so they serialize.
serial_test.workspace = true
tempfile = "=3.27.0"
