[package]
name = "model-family-registry"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest"]

[lints]
workspace = true

# The list of model families (issue #2473, Step 5), above model discovery and
# below config. Like discovery it never links MLX, because the daemon
# recognizes folders through it.
[dependencies]
model-discovery = { path = "../../../foundation/model-discovery" }
# Each family's recognition crate, in the family's own folder.
qwen35-recognition = { path = "../../text/qwen35/recognition" }
flux2-klein-recognition = { path = "../../image/flux2-klein/recognition" }
qwen-image-21-recognition = { path = "../../image/qwen-image-21/recognition" }
kokoro-recognition = { path = "../../speech/kokoro/recognition" }
phonon-recognition = { path = "../../speech/phonon/recognition" }
kev-recognition = { path = "../../decision/kev/recognition" }
clef-recognition = { path = "../../decision/clef/recognition" }
laya-recognition = { path = "../../decision/laya/recognition" }
modernbert-recognition = { path = "../../decision/modernbert/recognition" }
serde_json.workspace = true
