[package]
name = "qwen35"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest", "direct-mlx"]
direct-mlx-lane-feature = "direct-mlx"

[lints]
workspace = true

[features]
default = []
direct-mlx = ["dep:neural-engine", "dep:runtime-integration", "dep:mlx-bridge", "dep:mlx-c-fork", "jangtq2-qwen35/direct-mlx", "engine-core/direct-mlx", "model-primitives/direct-mlx", "artifact-validation/direct-mlx"]

# The Qwen 3.5 family (issue #2340). One-way edge: nothing here may depend on
# model-serving or on the decision models above it;
# `cargo xtask check-architecture` enforces the serving edge.
[dependencies]
artifact-validation = { path = "../../../foundation/artifact-validation" }
config = { path = "../../../foundation/config" }
engine-core = { path = "../../../engine/engine-core" }
expert-atlas = { path = "../../../engine/expert-atlas" }
expert-record-reader = { path = "../../../engine/expert-record-reader" }
model-primitives = { path = "../../../engine/model-primitives" }
ipc-protocol = { path = "../../../contracts/ipc-protocol" }
# The jangtq2 weight family (issue #1427), consumed one way.
jangtq2-qwen35 = { path = "../../../weight-formats/jangtq2-qwen35" }
lowercase-hex = { path = "../../../foundation/lowercase-hex" }
memory-policy = { path = "../../../foundation/memory-policy" }
neural-engine = { path = "../../../hardware/neural-engine", features = ["mlx-hand-off"], optional = true }
runtime-integration = { path = "../../../foundation/runtime-integration", features = ["mlx"], optional = true }
mlx-bridge = { workspace = true, optional = true }
mlx-c-fork = { path = "../../../foundation/mlx-c-fork", optional = true }
image.workspace = true
libc.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
model-primitives = { path = "../../../engine/model-primitives", features = ["test-support"] }
test-harness = { path = "../../../foundation/test-harness", features = ["test-fixtures"] }
libc.workspace = true
# start_paused virtual time for #[tokio::test(start_paused = true)] bodies.
tokio = { workspace = true, features = ["test-util"] }
# The GPU tests sample the process-global MLX allocator, so they serialize.
serial_test.workspace = true
tempfile = "=3.27.0"
