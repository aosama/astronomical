[package]
name = "artifact-validation"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest"]

[lints]
workspace = true

[features]
default = []
# Keeps each tensor's absolute file range for the MLX loaders; adds no
# dependency.
direct-mlx = []

# One-way edge: every model family depends on this crate and it depends on
# none of them; `cargo xtask check-architecture` enforces the serving edge.
[dependencies]
# Bounded safetensors header parsing and the strict-JSON duplicate guard.
memory-policy = { path = "../memory-policy" }
# Decodes Hugging Face snapshot folder names into model ids.
config = { path = "../config" }
lowercase-hex = { path = "../lowercase-hex" }
libc.workspace = true
safetensors.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
