[package]
name = "metal-kernel-declarations"
description = "Reads the signature block of Astronomical's own Metal kernels: the declarations a launcher hands MLX, the wrapper MLX writes around a kernel body, and the naming convention by scope (issue #2712)."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Deliberately dependency-free: the build scripts of the crates that own
# kernels and the xtask offline compile both read it, and neither should
# pull MLX or anything else in through it.

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
