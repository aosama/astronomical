[package]
name = "mlx-c-fork"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = []

[lints.rust]
# The extern declaration of the patched MLX-C symbol lives here; the unsafe
# surface is exactly one foreign function behind a checked wrapper.
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
# The workspace's function-length budget (clippy.toml); this table replaces
# the workspace lints, so it must deny the lint itself.
too_many_lines = "deny"

[dependencies]
mlx-bridge.workspace = true
