[package]
name = "model-discovery"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest"]

[lints]
workspace = true

# Model discovery (issue #2473, Step 5): reads folders and documents only, so
# the daemon discovers models without linking MLX.
[dependencies]
lowercase-hex = { path = "../lowercase-hex" }
# The voice-name rule discovery lists speech voices by, shared with the
# engines that load them; pure Rust with no further dependencies.
speech-contract = { path = "../../contracts/speech-contract" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
# The reviewed image pipeline documents the shared folder checks are tested on.
test-harness = { path = "../test-harness", features = ["test-fixtures"] }
