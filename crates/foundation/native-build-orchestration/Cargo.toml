[package]
name = "native-build-orchestration"
description = "Single compilation home of the native build orchestration: CMake invocation, identity-keyed store, linking, parallelism, and progress"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest"]

[lints]
workspace = true

[dependencies]
# The store locks entries with fs4 (and keeps build-slot locks across
# child processes with rustix) and hashes manifests with sha2; the
# identity policy comes from the shared native-identity library.
fs4.workspace = true
rustix.workspace = true
sha2.workspace = true
native-identity = { path = "../native-identity" }

[dev-dependencies]
tempfile = "=3.27.0"
