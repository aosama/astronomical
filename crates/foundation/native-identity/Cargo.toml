[package]
name = "native-identity"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Native build identity policy shared by the Cargo build scripts (as a
# build-dependency), the standalone native-build tool, and `cargo xtask
# native-fingerprint` (issue #1250). Pure logic: no native code, no network.
autotests = false

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest"]

[lints]
workspace = true

[dependencies]
sha2.workspace = true

[[test]]
name = "integration_tests"
path = "tests/integration/source_identity.rs"

