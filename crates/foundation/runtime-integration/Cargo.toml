[package]
name = "runtime-integration"
build = "build.rs"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest", "direct-mlx"]
direct-mlx-lane-feature = "mlx"

[package.metadata.cargo-machete]
# cargo-machete reports this build dependency as unused, but build.rs uses it.
ignored = ["native-build-orchestration"]

[features]
default = []
# `mlx` links the pinned, patched native MLX image (see build.rs and
# build-orchestration/) and enables every runtime module that touches it.
# The two ungated modules (mlx_metallib_path, mlx_runtime_types) keep the
# crate useful on machines without the native build.
mlx = ["dep:mlx-bridge", "dep:mlx-c-fork", "dep:libc", "dep:sha2", "dep:lowercase-hex"]
# Adds the allocator memory-contract probe binary to the native profile;
# see native/tests/mlx_memory_contract_probe.cpp.
mlx-memory-contract-probe = ["mlx"]

[lints.rust]
# The whole point of this crate is to contain the product's unsafe MLX-C
# surface; every unsafe block carries a SAFETY argument and every raw C
# handle has exactly one RAII owner.
unsafe_code = "allow"
unused_must_use = "deny"

# mlx-c-fork is an optional dependency behind the mlx feature, used by the
# runtime's CUDA settings and by the coverage contract (whose test target
# carries required-features). Builds without the feature never touch it, and
# Cargo's unused-dependency lint cannot see through the feature gate, so the
# manifest lint stays allowed here.
[lints.cargo]
unused_dependencies = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Function-length budget gate (issue #1637).
too_many_lines = "deny"

[dependencies]
lowercase-hex = { path = "../lowercase-hex", optional = true }
# The published stock MLX-C bindings (operations, types, raw FFI surface).
mlx-bridge = { workspace = true, optional = true }
# The Astronomical fork delta over the stock surface (the patched native
# symbols: mlx_array_detach and the CUDA run-time settings). Kept separate
# from the stock crate so the stock crate stays vanilla and publishable.
mlx-c-fork = { path = "../mlx-c-fork", optional = true }
libc = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror.workspace = true

[build-dependencies]
# The build script's orchestration surface: CMake invocation, store,
# linking, parallelism, and progress (their single compilation home; issue #1628).
native-build-orchestration = { path = "../native-build-orchestration" }

[dev-dependencies]
lowercase-hex = { path = "../lowercase-hex" }
native-identity = { path = "../native-identity" }
test-harness = { path = "../test-harness" }
sha2.workspace = true
tempfile = "=3.27.0"

# The live MLX-C coverage contract: the provisioned pinned headers and the
# compiled bridge inventory (stock crate plus the fork's symbols) must agree
# exactly. Requires the mlx feature, so it never builds in the integration lane.
[[test]]
name = "mlx_c_coverage_contract_tests"
required-features = ["mlx"]
