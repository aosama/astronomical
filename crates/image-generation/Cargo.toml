[package]
name = "astronomical-image-generation"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
direct-mlx = ["dep:astronomical-runtime-integration", "dep:mlx-bridge", "astronomical-gpu-building-blocks/direct-mlx", "astronomical-artifact-validation/direct-mlx"]

# The image generation families (FLUX.2 klein, Qwen-Image-2.1) and the
# worker-facing seam they implement (issue #2340). One-way edge: nothing here
# may depend on astronomical-model-serving; `cargo xtask check-architecture`
# enforces it.
[dependencies]
astronomical-artifact-validation = { path = "../artifact-validation" }
astronomical-gpu-building-blocks = { path = "../gpu-building-blocks" }
astronomical-ipc-protocol = { path = "../ipc-protocol" }
astronomical-memory-policy = { path = "../memory-policy" }
astronomical-runtime-integration = { path = "../runtime-integration", features = ["mlx"], optional = true }
mlx-bridge = { workspace = true, optional = true }
image.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
tracing.workspace = true

[dev-dependencies]
astronomical-test-harness = { path = "../test-harness", features = ["test-fixtures"] }
# The GPU tests sample the process-global MLX allocator, so they serialize.
serial_test.workspace = true
tempfile = "=3.27.0"
