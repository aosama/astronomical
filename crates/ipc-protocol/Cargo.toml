[package]
name = "astronomical-ipc-protocol"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
# The decision-model contract: the question and answer types a decisions
# request and its outcome are made of. It is pure Rust with no
# graphics-processor dependency, so carrying its types here costs the daemon
# and the command-line tool nothing extra to build.
astronomical-decision-contract = { path = "../decision-contract" }
astronomical-lowercase-hex = { path = "../lowercase-hex" }
astronomical-rest-contract = { path = "../../crates/rest-contract" }
# The speech request, its failures and its voice-name rule, shared with the
# worker and the daemon. Pure Rust, like the decision contract.
astronomical-speech-contract = { path = "../speech-contract" }
base64.workspace = true
bytes.workspace = true
crc32fast.workspace = true
futures-util.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
