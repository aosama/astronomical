[package]
name = "astronomical-mlx-c-rust"
build = "build.rs"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[features]
# The aligned-expert-pack loader inside astronomical-runtime-integration consumes
# the populated-raw constructor on MlxArray; the gate keeps that constructor out
# of builds that never load expert packs.
experimental-aligned-expert-packs = []

[dependencies]
thiserror.workspace = true

[build-dependencies]
bindgen = "0.73"
