[package]
name = "astronomical-model-serving"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
direct-mlx = ["dep:astronomical-runtime-integration", "dep:mlx-c-rust", "dep:astronomical-mlx-c-fork", "dep:astronomical-quantization", "astronomical-jangtq2-qwen35/direct-mlx"]

[dependencies]
astronomical-config = { path = "../config" }
astronomical-ipc-protocol = { path = "../ipc-protocol" }
# Pure memory policy and expert-paging arithmetic (budget composition, page
# admission peaks, residency planning, reclamation/recovery, serving ceiling).
# It carries no MLX dependency and this edge is one way, so building or
# testing the policy crate never pulls in the serving crate or its
# graphics-processor tests; the MLX-facing owners in this crate depend on it.
# The one-way direction is enforced by `cargo xtask check-architecture`.
astronomical-memory-policy = { path = "../astronomical-memory-policy" }
# The jangtq2 weight family as its own crate (issue #1427): format contract,
# codebook math, Hadamard rotation, Metal page decoder, fused gathered
# projection kernel. The pure contract builds in the integration lane; this edge
# is one way (the family never depends back on the serving crate, enforced by
# `cargo xtask check-architecture`), and the Qwen3.5 streaming engine keeps
# the serving integration (page loading, slot writes, dispatch) here.
astronomical-jangtq2-qwen35 = { path = "../astronomical-jangtq2-qwen35" }
# The quantization crate's pure surface (probe trait, artifact schemas). Its
# GPU world is never enabled from here: the Qwen3.5 sensitivity probe under
# src/quantization_probe implements the trait with this crate's own engine
# and MLX bindings, so the dependency direction stays quantization <-
# model-serving and the quantization crate never learns about an engine.
# Optional because only the direct-MLX probe uses it in production code;
# the integration artifact round-trip test reaches it as a dev-dependency.
astronomical-quantization = { path = "../quantization", optional = true }
astronomical-runtime-integration = { path = "../runtime-integration", features = ["mlx"], optional = true }
mlx-c-rust = { workspace = true, optional = true }
astronomical-mlx-c-fork = { path = "../mlx-c-fork", optional = true }
image.workspace = true
libc.workspace = true
regex-automata = "0.4"
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
astronomical-quantization = { path = "../quantization" }
astronomical-test-harness = { path = "../test-harness", features = ["test-fixtures"] }
libc.workspace = true
# start_paused virtual time for harness offline_tokio_test! bodies.
tokio = { workspace = true, features = ["test-util"] }
serial_test.workspace = true
tempfile = "=3.27.0"
tracing-subscriber.workspace = true
