[package]
name = "astronomical-model-serving"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
direct-mlx = ["astronomical-decision-models/direct-mlx", "astronomical-qwen35/direct-mlx", "astronomical-artifact-validation/direct-mlx", "astronomical-engine-core/direct-mlx", "astronomical-image-generation/direct-mlx", "astronomical-gpu-building-blocks/direct-mlx", "astronomical-speech/direct-mlx", "dep:astronomical-runtime-integration"]

# The worker and the wiring between model families (issue #2340). Every crate
# below is consumed one way; `cargo xtask check-architecture` holds each of
# the split-out crates off this one.
[dependencies]
# Model folder validation every family shares.
astronomical-artifact-validation = { path = "../artifact-validation" }
# The engine contract, MLX memory and the astro_decoder_state_cache, below the
# families.
astronomical-engine-core = { path = "../engine-core" }
# The Qwen 3.5 family, which the decision models score on and the worker
# serves.
astronomical-qwen35 = { path = "../qwen35" }
# The decision and embedding models and their seams.
astronomical-decision-models = { path = "../decision-models" }
# The image generation families and their worker seam.
astronomical-image-generation = { path = "../image-generation" }
# The GPU building blocks every family shares.
astronomical-gpu-building-blocks = { path = "../gpu-building-blocks" }
# The text-to-speech families and their worker seam.
astronomical-speech = { path = "../speech" }
astronomical-config = { path = "../config" }
# The decision-model contract the worker passes to and from the decision
# engines.
astronomical-decision-contract = { path = "../decision-contract" }
# The speech request, failures and audio encoding the worker passes to and
# from the speech engines.
astronomical-speech-contract = { path = "../speech-contract" }
astronomical-ipc-protocol = { path = "../ipc-protocol" }
# Pure memory policy (budget composition, admission, residency planning,
# serving ceiling), with no MLX dependency.
astronomical-memory-policy = { path = "../astronomical-memory-policy" }
astronomical-lowercase-hex = { path = "../lowercase-hex" }
astronomical-runtime-integration = { path = "../runtime-integration", features = ["mlx"], optional = true }
image.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# The OptiQ artifact round-trip integration test reads the quantizer's schemas.
astronomical-quantization = { path = "../quantization" }
astronomical-test-harness = { path = "../test-harness", features = ["test-fixtures"] }
astronomical-gpu-building-blocks = { path = "../gpu-building-blocks", features = ["test-support"] }
# start_paused virtual time for #[tokio::test(start_paused = true)] bodies.
tokio = { workspace = true, features = ["test-util"] }
tempfile = "=3.27.0"
