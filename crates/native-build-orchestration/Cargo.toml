[package]
name = "astronomical-native-build-orchestration"
description = "Single compilation home of the native build orchestration: CMake invocation, identity-keyed store, linking, parallelism, and progress"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
# The store locks entries with fs4 and hashes manifests with sha2; the
# identity policy comes from the shared native-identity library.
fs4.workspace = true
sha2.workspace = true
astronomical-native-identity = { path = "../native-identity" }

[dev-dependencies]
tempfile = "=3.27.0"
