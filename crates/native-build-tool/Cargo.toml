[package]
name = "astronomical-native-build-tool"
description = "Builds Astronomical's pinned native runtime ahead of Cargo so native and Rust compilation never overlap"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
# The included build modules own these dependencies: the native build store
# locks entries with fs4 and hashes manifests with sha2; the identity policy
# comes from the shared native-identity library (issue #1250).
fs4.workspace = true
sha2.workspace = true
astronomical-native-identity = { path = "../native-identity" }

# cargo-machete reports all three dependencies above as unused because its
# text search only scans this package's directory, while the code that uses
# them is compiled in through `#[path]` module includes whose files live
# under crates/runtime-integration/ (see src/lib.rs and the nested include
# in build_native_store.rs). Keep this ignore list in sync with that
# include chain.
[package.metadata.cargo-machete]
ignored = ["astronomical-native-identity", "fs4", "sha2"]
