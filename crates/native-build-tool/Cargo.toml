[package]
name = "native-build-tool"
description = "Builds Astronomical's pinned native runtime ahead of Cargo so native and Rust compilation never overlap"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest"]

[lints]
workspace = true

[dependencies]
# The orchestration this tool runs: CMake invocation, store, progress (the
# modules' single compilation home; issue #1628). Its tree is exactly fs4,
# sha2, and native-identity, so the tool stays cheap to build.
native-build-orchestration = { path = "../native-build-orchestration" }
