[package]
name = "astronomical-native-build-tool"
description = "Builds Astronomical's pinned native runtime ahead of Cargo so native and Rust compilation never overlap"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
# The orchestration this tool runs: CMake invocation, store, progress (the
# modules' single compilation home; issue #1628). Its tree is exactly fs4,
# sha2, and native-identity, so the tool stays cheap to build.
astronomical-native-build-orchestration = { path = "../native-build-orchestration" }
