[package]
name = "astronomical-qwen35"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
direct-mlx = ["dep:astronomical-neural-engine", "dep:astronomical-runtime-integration", "dep:mlx-bridge", "dep:astronomical-mlx-c-fork", "dep:astronomical-quantization", "astronomical-quantization/direct-mlx", "astronomical-jangtq2-qwen35/direct-mlx", "astronomical-engine-core/direct-mlx", "astronomical-gpu-building-blocks/direct-mlx", "astronomical-artifact-validation/direct-mlx"]

# The Qwen 3.5 family (issue #2340). One-way edge: nothing here may depend on
# astronomical-model-serving or on the decision models above it;
# `cargo xtask check-architecture` enforces the serving edge.
[dependencies]
astronomical-artifact-validation = { path = "../artifact-validation" }
astronomical-config = { path = "../config" }
astronomical-engine-core = { path = "../engine-core" }
astronomical-expert-atlas = { path = "../expert-atlas" }
astronomical-expert-record-reader = { path = "../expert-record-reader" }
astronomical-gpu-building-blocks = { path = "../gpu-building-blocks" }
astronomical-ipc-protocol = { path = "../ipc-protocol" }
# The jangtq2 weight family (issue #1427), consumed one way.
astronomical-jangtq2-qwen35 = { path = "../astronomical-jangtq2-qwen35" }
astronomical-lowercase-hex = { path = "../lowercase-hex" }
astronomical-memory-policy = { path = "../astronomical-memory-policy" }
# The quantization crate's pure surface (probe trait, artifact schemas); only
# the direct-MLX sensitivity probe uses it in production code.
astronomical-quantization = { path = "../quantization", optional = true }
astronomical-neural-engine = { path = "../neural-engine", features = ["mlx-hand-off"], optional = true }
astronomical-runtime-integration = { path = "../runtime-integration", features = ["mlx"], optional = true }
mlx-bridge = { workspace = true, optional = true }
astronomical-mlx-c-fork = { path = "../mlx-c-fork", optional = true }
image.workspace = true
libc.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
astronomical-gpu-building-blocks = { path = "../gpu-building-blocks", features = ["test-support"] }
astronomical-quantization = { path = "../quantization" }
astronomical-test-harness = { path = "../test-harness", features = ["test-fixtures"] }
libc.workspace = true
# start_paused virtual time for #[tokio::test(start_paused = true)] bodies.
tokio = { workspace = true, features = ["test-util"] }
# The GPU tests sample the process-global MLX allocator, so they serialize.
serial_test.workspace = true
tempfile = "=3.27.0"
