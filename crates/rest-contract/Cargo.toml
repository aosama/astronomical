[package]
name = "rest-contract"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest"]

[lints]
workspace = true

[dependencies]
# The speech request checks and audio formats the speech endpoint shares
# with the worker; pure Rust.
speech-contract = { path = "../speech-contract" }
base64.workspace = true
regex-automata = "0.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
