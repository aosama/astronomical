[package]
name = "astronomical-runtime-integration"
build = "build.rs"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
mlx = ["dep:astronomical-mlx-c-rust"]
mlx-memory-contract-probe = ["mlx"]

[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
astronomical-mlx-c-rust = { path = "../mlx-c-rust", optional = true }
libc.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[build-dependencies]
fs4.workspace = true
sha2.workspace = true

[dev-dependencies]
fs4.workspace = true
sha2.workspace = true
tempfile = "=3.27.0"

[[test]]
name = "mlx_c_coverage_contract_tests"
required-features = ["mlx"]
