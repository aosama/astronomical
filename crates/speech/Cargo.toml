[package]
name = "astronomical-speech"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
direct-mlx = ["dep:astronomical-runtime-integration", "dep:mlx-bridge", "dep:astronomical-gpu-building-blocks", "astronomical-gpu-building-blocks/direct-mlx", "dep:astronomical-english-phonemes", "dep:astronomical-config", "dep:tokenizers", "dep:serde_json", "dep:thiserror"]

# The text-to-speech families (Kokoro, Phonon) and the worker-facing seam
# they implement (issue #2340). One-way edge: nothing here may depend on
# astronomical-model-serving; `cargo xtask check-architecture` enforces it.
[dependencies]
# The speech request, failures and audio encoding every side shares.
astronomical-speech-contract = { path = "../speech-contract" }
# The MLX memory telemetry each speech step reports.
astronomical-memory-policy = { path = "../astronomical-memory-policy" }
# The rest serve only the direct-MLX engines.
astronomical-config = { path = "../config", optional = true }
astronomical-english-phonemes = { path = "../english-phonemes", optional = true }
astronomical-gpu-building-blocks = { path = "../gpu-building-blocks", optional = true }
astronomical-runtime-integration = { path = "../runtime-integration", features = ["mlx"], optional = true }
mlx-bridge = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[dev-dependencies]
# The GPU tests sample the process-global MLX allocator, so they serialize.
serial_test.workspace = true
tempfile = "=3.27.0"
