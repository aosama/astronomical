[package]
name = "test-harness"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = []

[lints]
workspace = true

[features]
# The FLUX reference-oracle contract is shared by the worker's integration suite
# and the root acceptance package; only those consumers pay for `image` and
# friends, keeping every ordinary unit-test binary lean.
test-fixtures = []
flux-reference-oracle = ["dep:base64", "dep:image", "dep:sha2"]

[dependencies]
lowercase-hex = { path = "../lowercase-hex" }
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
tokio.workspace = true
