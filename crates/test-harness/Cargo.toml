[package]
name = "astronomical-test-harness"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
# The FLUX reference-oracle contract is shared by the worker's integration suite
# and the root acceptance package; only those consumers pay for `image` and
# friends, keeping every ordinary unit-test binary lean.
test-fixtures = []
flux-reference-oracle = ["dep:base64", "dep:image", "dep:sha2"]

[dependencies]
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
tokio.workspace = true
