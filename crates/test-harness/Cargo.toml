[package]
name = "astronomical-test-harness"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The network-denial keystone talks to Apple's Seatbelt through a contained
# dlsym FFI shim; that is this crate's one sanctioned use of unsafe, kept out
# of every production crate where the workspace-wide denial stays absolute.
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[features]
# The FLUX reference-oracle contract is shared by the worker's integration suite
# and the root acceptance package; only those consumers pay for `image` and
# friends, keeping every ordinary unit-test binary lean.
test-fixtures = []
flux-reference-oracle = ["dep:base64", "dep:image", "dep:sha2"]

[dependencies]
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
tokio.workspace = true
