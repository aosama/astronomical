[package]
name = "download-catalog"
description = "The release-bundled model download catalog and its validating parser, kept free of the engine's native build so a catalog edit can be checked on its own."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest"]

[dependencies]
# leaf_model_id and the exhaustive_table macro; pure Rust, no native build.
config = { path = "../../foundation/config" }
lowercase-hex = { path = "../../foundation/lowercase-hex" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
