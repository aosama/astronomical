[package]
name = "qwen35-quantization-probe"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration", "integration-and-rest", "nextest", "direct-mlx"]

[lints]
workspace = true

# The Qwen 3.5 sensitivity probe for the quantizer (issue #2340). It is the one
# place a model family meets the 17,000-line quantizer, so it lives apart from
# both: the Qwen crate, the worker and the daemon never compile the quantizer,
# and only the CLI's `quantize-convert` feature and the acceptance tests pull
# this crate in. It runs on MLX and turns on its dependencies' direct-mlx
# itself, so the pre-commit default-features check lints it in its own call.
[dependencies]
quantization = { path = "../quantization", features = ["direct-mlx"] }
qwen35 = { path = "../../families/text/qwen35", features = ["direct-mlx"] }
runtime-integration = { path = "../../foundation/runtime-integration", features = ["mlx"] }
mlx-bridge.workspace = true
# The probe model (`probe_model`) is built from the Qwen 3.5 crate's shared
# pieces and the engine crates beneath it, as the family's own models are.
artifact-validation = { path = "../../foundation/artifact-validation", features = ["direct-mlx"] }
engine-core = { path = "../../engine/engine-core", features = ["direct-mlx"] }
expert-atlas = { path = "../../engine/expert-atlas" }
memory-policy = { path = "../../foundation/memory-policy" }
model-primitives = { path = "../../engine/model-primitives", features = ["direct-mlx"] }
text-generation = { path = "../../families/text/text-generation", features = ["direct-mlx"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
