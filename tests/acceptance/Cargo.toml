[package]
name = "astronomical-acceptance"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The acceptance suite is journeys only: test binaries, no library, no units.
# Every binary needs real model artifacts and an Apple-Silicon GPU, so nothing
# here is wired into CI; each binary is feature-gated and runs ignored by
# default under `--ignored` on a laptop that has the artifacts installed.
autotests = false

[features]
direct-mlx = []
serving-acceptance = []
expert-paging = []
performance-measurement = []
performance_throughput = []
mlx = []
mlx-memory-contract-probe = ["mlx"]

[[test]]
name = "chat_serving"
path = "tests/chat_serving.rs"

[[test]]
name = "prompt_cache"
path = "tests/prompt_cache.rs"

[[test]]
name = "expert_paging"
path = "tests/expert_paging.rs"

[[test]]
name = "performance_measurement"
path = "tests/performance/measurement.rs"

[[test]]
name = "performance_throughput"
path = "tests/performance/throughput.rs"

[[test]]
name = "direct_mlx"
path = "tests/gpu_contracts/direct_mlx.rs"
required-features = ["direct-mlx"]

[[test]]
name = "installed_model_contracts"
path = "tests/gpu_contracts/installed_model_contracts.rs"
required-features = ["direct-mlx"]

[[test]]
name = "engine_prompt_cache"
path = "tests/prompt_cache_engine.rs"
required-features = ["direct-mlx"]

[[test]]
name = "runtime_direct_mlx"
path = "tests/gpu_contracts/runtime_mlx/direct_mlx.rs"
required-features = ["mlx"]

[[test]]
name = "memory_contracts"
path = "tests/memory_contracts.rs"
required-features = ["direct-mlx", "mlx-memory-contract-probe"]

[[test]]
name = "mlx_runtime_policy"
path = "tests/gpu_contracts/runtime_mlx/mlx_runtime_policy.rs"
required-features = ["mlx"]

[[test]]
name = "mlx_safetensors_writer_memory_policy"
path = "tests/gpu_contracts/runtime_mlx/mlx_safetensors_writer_memory_policy.rs"
required-features = ["mlx"]

# The moved runtime-MLX suites build raw MLX-C graph probes, mirroring the
# unsafe ownership boundary their source crate carries. Workspace lints are
# restated manually so `unsafe_code` can be relaxed while `unused_must_use`
# and the clippy set keep their workspace strictness.
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
astronomical-config = { path = "../../crates/config" }
astronomical-daemon = { path = "../../apps/daemon" }
astronomical-inference-worker = { path = "../../apps/inference-worker" }
astronomical-ipc-protocol = { path = "../../crates/ipc-protocol" }
astronomical-model-serving = { path = "../../crates/model-serving", features = ["direct-mlx"] }
astronomical-mlx-c-rust = { path = "../../crates/mlx-c-rust" }
astronomical-rest-contract = { path = "../../crates/rest-contract" }
astronomical-runtime-integration = { path = "../../crates/runtime-integration", features = ["mlx"] }
astronomical-test-harness = { path = "../../crates/test-harness", features = ["flux-reference-oracle"] }
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
serial_test.workspace = true
sha2.workspace = true
tempfile = "=3.27.0"
thiserror.workspace = true
tokenizers.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
