[package]
name = "astronomical-e2e"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The E2E suite is journeys only: one test binary, no library, no units.
autotests = false

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = ["integration"]

[[test]]
name = "e2e"
path = "tests/e2e.rs"
harness = true

[lints]
workspace = true

[dev-dependencies]
config = { path = "../../crates/foundation/config" }
astronomical-daemon = { path = "../../apps/daemon" }
ipc-protocol = { path = "../../crates/contracts/ipc-protocol" }
rest-contract = { path = "../../crates/contracts/rest-contract" }
test-harness = { path = "../../crates/foundation/test-harness", features = ["test-fixtures"] }
base64.workspace = true
image.workspace = true
serde_json.workspace = true
serial_test.workspace = true
tempfile = "=3.27.0"
tokio.workspace = true
