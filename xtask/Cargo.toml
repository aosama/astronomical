[package]
name = "xtask"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Repository tooling: CI reporting and verification glue as typed Rust, driven
# through `cargo xtask <command>` (see the alias in .cargo/config.toml).
autotests = false

[lints]
workspace = true

[dependencies]
astronomical-native-identity = { path = "../crates/native-identity" }
astronomical-test-harness = { path = "../crates/test-harness" }
# Signal handlers, process-group signaling, access(2), and localtime_r for
# the disposable-target lifecycle runner: the one sanctioned unsafe edge.
libc.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
serial_test.workspace = true
serde_yaml = "0.9"
tempfile = "=3.27.0"

[[test]]
name = "offline_gh_shim_journeys"
path = "tests/offline_gh_shim_journeys.rs"

[[test]]
name = "offline_install_tools_journeys"
path = "tests/offline_install_tools_journeys.rs"

[[test]]
name = "offline_bootstrap_journeys"
path = "tests/offline_bootstrap_journeys.rs"

[[test]]
name = "offline_app_builder_journeys"
path = "tests/offline_app_builder_journeys.rs"

[[test]]
name = "offline_disposable_target_journeys"
path = "tests/offline_disposable_target_journeys.rs"

[[test]]
name = "disposable_target_retirement_contract"
path = "tests/disposable_target_retirement_contract.rs"

[[test]]
name = "workflow_structural_contract"
path = "tests/workflow_structural_contract.rs"

[[test]]
name = "workflow_cache_owner_contract"
path = "tests/workflow_cache_owner_contract.rs"
