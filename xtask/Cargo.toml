[package]
name = "xtask"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Repository tooling: CI reporting and verification glue as typed Rust, driven
# through `cargo xtask <command>` (see the alias in .cargo/config.toml).
autotests = false

# The test lanes this package runs in. `cargo xtask lane-cargo` builds each
# lane's command from these declarations (issue #2473, Step 6), so no alias
# lists packages by hand; an empty list says the package is in no lane.
[package.metadata.astronomical]
test-lanes = []

[lints]
workspace = true

[dependencies]
memory-policy = { path = "../crates/foundation/memory-policy" }
native-identity = { path = "../crates/foundation/native-identity" }
test-harness = { path = "../crates/foundation/test-harness" }
lowercase-hex = { path = "../crates/foundation/lowercase-hex" }
# Signal handlers, process-group signaling, access(2), and localtime_r for
# the disposable-target lifecycle runner: the one sanctioned unsafe edge.
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
serial_test.workspace = true
serde_yaml = "0.9"
tempfile = "=3.27.0"

[[test]]
name = "workflow_verified_work_contract"
path = "tests/workflow_verified_work_contract.rs"

